teria mirror Silver Bullet's own architecture (skills + hooks + state file + stop-checks + plugin packaging), guaranteeing SB scores 7/7 by construction. Critique should either disclose this framing bias explicitly in the report or add at least two SB-neutral axes (e.g. adoption/community size, autonomy level, cost-to-operate, evidence of production use) so rivals are not penalized for architectural difference rather than capability."}, {"target": "Zuvo OSS-license classification", "severity": "low", "finding": "The claim is truncated mid-sentence in the [Cohort Request JSON](ocg-cohort-request-attempt-51881c3e-8026-41a5-99eb-5fd210e1d793.json) and asserts OSS status by directive rather than evidence. Needs the actual LICENSE file/SPDX identifier captured; if the project is source-available (e.g. BSL/Elastic) the brief's 'Zuvo is OSS' instruction would be factually wrong and should be flagged back rather than propagated."}, {"target": "startup-weighted comparison matrix requirement", "severity": "low", "finding": "No claim candidate establishes the weighting scheme (what a startup buyer optimizes for: time-to-first-value, zero-cost entry, no procurement, host lock-in risk). Without stated weights the matrix scores will be unauditable and will read as arbitrary."}, {"target": "Cognition Scout vs. Devin", "severity": "medium", "finding": "The tertiary list includes both Devin and 'Cognition Scout'. 'Cognition Scout' is not a documented public product name — likely confused with Cognition Labs' Devin or a rumored product. Naming rules require product-level names only; Cognition is the parent/vendor name, not the product peer. Devin and Factory.ai should carry the analyst-substitute slot."}, {"target": "Cavekit v3.1 vs v4 classification", "severity": "low", "finding": "Cavekit v3.1 is listed as APO core seed while v4 is adjacent-only, with no explanation of the version split. A reader cannot evaluate Cavekit without knowing which version satisfies the 7 criteria and why v4 was demoted. State the criteria outcome for both versions explicitly."}], "gaps": [{"area": "Tertiary market (agentic SDLC SaaS)", "description": "Factory.ai (Droids), Devin, Augment Cosmos, Tembo, and Cognition Scout are entirely unresearched despite being mandated as analyst-grade substitutes. Pricing, autonomy model, enforcement/governance claims, and deployment model are all missing.", "suggested_action": "Run a dedicated evidence pass per vendor capturing: pricing page, autonomy claim, SDLC phases covered, governance/audit features, and self-labeling language; score each against the 7 inclusion criteria and note which fail process layer above host runtime (most are hosts, not wrappers)."}, {"area": "Per-seed evidence for the 16 APO seeds", "description": "Twelve primary-market seeds have no per-product evidence at all — no repo, no docs URL, no feature inventory. The primary chart cannot be built from bulk dismissal.", "suggested_action": "Create one evidence stub per seed with: canonical URL, license, last-commit date, star count (if OSS), packaging type, and a 7-criteria pass/fail vector. Mark unfindable seeds as 'no verifiable public artifact' rather than 'thin wrapper'."}, {"area": "Citation verification", "description": "Repo URLs appear constructed from product names rather than resolved; at least one (anomalyco/silver-bullet) contradicts the repo's own documented origin (alo-exp/silver-bullet).", "suggested_action": "Add a mandatory URL-resolution gate before consolidation: every source must return HTTP 200 with the product name present in the page; failures are demoted to 'unverified' and cannot back a claim above confidence 0.5."}, {"area": "Differentiation evidence vs closest OSS substitutes", "description": "No head-to-head feature comparison exists between Silver Bullet and its three strongest substitutes (BMAD-METHOD, Superpowers, Ruflo/Claude Flow) on the dimensions SB claims to win: deterministic blocking gates, cross-session/branch-scoped state, and specialist-agent routing.", "suggested_action": "Build a 3x3 evidence table citing each rival's own docs for hook/gate mechanism, state persistence mechanism, and agent-routing mechanism — then restate the SB differentiation claim only where the rival demonstrably lacks the mechanism."}, {"area": "Adoption and viability signals", "description": "No traction data anywhere: stars, forks, contributors, release cadence, funding, customer logos. A startup-weighted matrix without viability signals cannot distinguish a maintained product from an abandoned weekend repo.", "suggested_action": "Capture stars/forks/last-release for OSS entries and funding/stage/customer count for SaaS entries; add an 'activity' column and auto-flag anything with no commit or release in 6+ months as at-risk."}, {"area": "Missing candidate scan", "description": "Research relied solely on the seed list; no independent discovery pass ran. Likely-missing APO/plugin candidates include Agent OS (Builder Methods), Kiro spec-driven workflow, Roo Code Boomerang/orchestrator modes, Task Master AI, ClaudeKit, agent-rules/awesome-claude-code registries, and OpenSpec.", "suggested_action": "Run a discovery sweep over the claude-code-plugin / claude-code-skills GitHub topics and awesome-* registries, then triage each hit against inclusion criteria and exclusion classes before deciding the core-count bound (8–24)."}, {"area": "Exclusion-boundary rationale", "description": "The report has no documented reasoning for why hard-excluded and adjacent items (Cursor, Copilot, LangGraph, CrewAI, OpenHands) are out, which is exactly what a skeptical buyer will challenge first.", "suggested_action": "Add a short 'Why these are not peers' section mapping each adjacent/excluded entry to its exclusion class with one-line justification, so the scope decision is auditable rather than assumed."}, {"area": "Startup buyer weighting model", "description": "The weighting that makes the matrix 'startup-weighted' is undefined.", "suggested_action": "Declare explicit weights up front (e.g. cost 25%, time-to-value 20%, lifecycle span 20%, enforcement depth 20%, lock-in/portability 15%), publish them in the report, and compute every score from those weights so results are reproducible."}, {"area": "Pricing and procurement dimensions", "description": "Comparison matrix lacks pricing, license, support tier, and procurement model. For a procurement-ready landscape, these are required columns for the analyst buyer.", "suggested_action": "Add columns: license (OSS/SSPL/commercial/Free-tier), pricing model (per-seat/per-token/per-task/free), support tier (community/enterprise), and last-release date. Populate from vendor site for commercial; from repo for OSS."}, {"area": "Cross-market composition analysis", "description": "Landscape treats markets as disjoint, but APO + secondary products are routinely composed (SB host + BMAD-method skill, or GSD + Superpowers, or Claude Code + cc10x). Substitutability is conditional on host.", "suggested_action": "Add a 'composed stacks' row set to Top-N or Adjacent: e.g., 'Claude Code + cc10x + GSD', 'Cursor + BMAD-METHOD', 'Codex + Silver Bullet + Superpowers'. Score the composed stack against the 7 criteria, not just the parts."}]}, "authoritative": true, "model_routing": {"requested_model_id": "gemini-3.5-flash", "effective_model_id": "gemini-3.5-flash"}}, {"schema_id": "dr-phase-contribution-envelope-v1", "version": "1.0.0", "run_id": "run-57f38dfa25d83cc50d224e283d4692f3", "work_item_id": "work-1b8aaa25eb4fe996d9ca130354287452", "phase_id": "DR-CRITIQUE", "logical_model_id": "ocg-minimax-m3", "attempt_id": "attempt-51881c3e-8026-41a5-99eb-5fd210e1d793", "model_family_id": "minimax", "payload": {"critiques": [{"target": "Silver Bullet self-claim 'most complete open-source APO'", "severity": "high", "finding": "Self-serving vendor claim presented as landscape finding. No external benchmark or third-party ranking supports 'most complete' — it conflates shipped-skill count (85+) with process depth, and ignores that AI-DLC, Conductor, and Cavekit v3.1 may have comparable or stronger multi-phase enforcement even with smaller surface area. Confidence 0.92 is overcalibrated for an unverified superlative."}, {"target": "Claim that Silver Bullet and AI-DLC are 'the only seeds' with documented multi-phase lifecycle enforcement + host-integrated packaging", "severity": "high", "finding": "Factually unsupported as stated. Conductor.build ships a multi-stage build/test/release orchestrator with host integration; cc10x is a Claude Code plugin with composable subagents; Cavekit v3.1 packages lifecycle workflows as Claude skills. The binary 'only two' framing collapses what is actually a spectrum of enforcement depth and should be rephrased as a depth-ranked tier list with evidence per product."}, {"target": "Zuvo classification as 'OSS methodology pack' (secondary market)", "severity": "medium", "finding": "Zuvo is described as OSS in the brief, but its positioning, repo activity, and feature set were not validated in prior context. If Zuvo ships deterministic gates or cross-session state it qualifies for APO; if it is purely a methodology overlay it is secondary. The landscape card should explicitly justify the market assignment against the 7 inclusion criteria, not assume secondary by default."}, {"target": "Tertiary market — Magic.dev and Cognition Scout as in-scope substitutes", "severity": "high", "finding": "Hard-exclusion list flags Magic.dev as excluded, yet the multi-market seed list re-includes it under 'agentic-sdlc-saas'. This is a direct contradiction. Also, 'Cognition Scout' is not a documented public product name — likely confused with Cognition Labs' Devin or a rumored product. Either confirm the public product page or drop it. Devin and Factory should carry the analyst-substitute slot."}, {"target": "Tertiary market — missing SAAS-side competitors", "severity": "high", "finding": "Tertiary market omits multiple analyst-grade agentic SDLC platforms that should be peers: Replit Agent, Bolt.new, Lovable, v0 (Vercel), Sourcegraph Amp, Warp Terminal, Pieces for Developers, Rovo Dev (Atlassian), GitHub Copilot Coding Agent, Tabnine, Qodo (formerly Codium), and Continue Dev. The '8–24 in-scope' budget is not exhausted by Factory/Devin/Cosmos/Tembo alone — the tertiary card set is underpopulated and over-indexed on a few names."}, {"target": "Secondary market — incomplete plugin inventory", "severity": "medium", "finding": "Missing plausible OSS SDLC-plugin substitutes that compete for the same buyer: Roo Code / Roo Cline (VS Code agentic extension), Avante (Neovim), Continue OSS, MentatBot, Plandex, Forge (openHands-light), Aider (excluded as coding_agent but commonly used as APO substrate), and the Hermes / Fabric agent pattern packs. Also missing the 'everything-claude-code' / 'claude-code-templates' family that has exploded on GitHub and competes with SB's skill catalog directly."}, {"target": "APO seed list — unverified products", "severity": "high", "finding": "Several core seeds (Deepwork, Turboshovel, Barkain Workflow Orchestrator, Director, Claude Harness, AgentHub, ATeam, AgentSys) have no public documentation, repo, or vendor site referenced in prior context. They cannot be credibly placed in a landscape without first-party evidence; risk of hallucinated product presence. Recommend either linking to canonical sources or marking as 'research-pending / unverified' in the matrix."}, {"target": "AI-DLC provenance", "severity": "medium", "finding": "AI-DLC is cited via an AWS AI-DLC announcement / awslabs docs but no product URL, repo, or vendor is provided. If 'AI-DLC' refers to AWS/awslabs's published methodology (not a shippable product), it is excluded as 'methodology without shipped enforcement' rather than APO. The seed list conflates method/paper with product."}, {"target": "Cavekit v3.1 vs v4 treatment", "severity": "low", "finding": "Cavekit v3.1 is listed as APO core seed while v4 is adjacent-only, with no explanation of the version split. A reader cannot evaluate Cavekit without knowing which version satisfies the 7 criteria and why v4 was demoted. State the criteria outcome for both versions explicitly."}, {"target": "Confidence calibration across claims", "severity": "medium", "finding": "Confidence scores cluster 0.78–0.92 but evidence density does not. The 'most formidable substitute set' claim (0.85) cites four repos but no comparative metric; the 'only two' claim (0.78) is treated as more certain than its evidence warrants. Recalibrate against the 7-criteria rubric per product rather than per market."}, {"target": "Cross-market interaction underweighted", "severity": "medium", "finding": "The brief warns APO must not exclude secondary substitutes, but the prior context does not analyze how SB users actually compose with BMAD/GSD/Superpowers (e.g., SB-as-host-runtime with BMAD-method or GSD invoked as a skill). Without that, the 'formidable substitute' framing mischaracterizes the real competitive dynamic, which is composition and substitutability depending on host."}, {"target": "Hard-exclusion list has internal contradictions", "severity": "high", "finding": "Magic.dev appears in both tertiary seeds and the hard-exclusion list. Cursor Background Agents, Sweep, Aider, Cline are excluded as 'coding_agent' but several of them (notably Sweep, Aider, Cline) are routinely cited as APO-adjacent by practitioners and should be in the Adjacent section, not silently dropped."}], "gaps": [{"area": "APO market — unverified seed products", "description": "Deepwork, Turboshovel, Barkain Workflow Orchestrator, Director, Claude Harness, AgentHub, ATeam, AgentSys have no cited canonical source. Cannot score inclusion criteria or place in chart without first-party evidence.", "suggested_action": "Run targeted repo and vendor-site lookups for each unverified seed; for any that yield no evidence, move to an explicit 'research-pending' row or drop from the in-scope set rather than carrying forward as a placeholder."}, {"area": "AI-DLC product vs methodology", "description": "No vendor or shippable product URL; likely a published methodology, which would not pass the 'shipped, enforced SDLC process product' test.", "suggested_action": "Confirm whether AI-DLC exists as a downloadable product/plugin. If methodology only, demote to Adjacent and add a note that it is a reference framework, not a competing product."}, {"area": "Tertiary market underpopulated", "description": "Only 4 SaaS substitutes (Factory, Devin, Augment Cosmos, Tembo) plus a long list of host runtimes; the brief allows 8–24 in-scope total. Major analyst-grade agentic SDLC platforms are missing.", "suggested_action": "Add to tertiary: Replit Agent, Bolt.new, Lovable, v0, Sourcegraph Amp, Rovo Dev, GitHub Copilot Coding Agent, Qodo, Tabnine, Pieces. Score each against the 7 inclusion criteria and place in Top-N or Adjacent accordingly."}, {"area": "Secondary plugin market underpopulated", "description": "Brief lists 8 plugins but the live OSS ecosystem contains 20+ methodology/skill packs that compete for the same workflow-niche.", "suggested_action": "Add: Roo Code/Roo Cline, Avante, MentatBot, Plandex, Forge, the 'everything-claude-code' / 'awesome-claude-code' template family, Hermes agent patterns, Fabric. Filter using the 7-criteria rubric; most will land Adjacent (coding_agent) but a few may qualify as APO-class."}, {"area": "Cross-market composition analysis missing", "description": "Landscape treats markets as disjoint, but APO + secondary products are routinely composed (SB host + BMAD-method skill, or GSD + Superpowers, or Claude Code + cc10x). Substitutability is conditional on host.", "suggested_action": "Add a 'composed stacks' row set to Top-N or Adjacent: e.g., 'Claude Code + cc10x + GSD', 'Cursor + BMAD-METHOD', 'Codex + Silver Bullet + Superpowers'. Score the composed stack against the 7 criteria, not just the parts."}, {"area": "Pricing and procurement dimensions missing", "description": "Comparison matrix lacks pricing, license, support tier, and procurement model. For a procurement-ready landscape, these are required columns for the analyst buyer.", "suggested_action": "Add columns: license (OSS/SSPL/commercial/Free-tier), pricing model (per-seat/per-token/per-task/free), support tier (community/enterprise), and last-release date. Populate from vendor site for commercial; from repo for OSS."}, {"area": "Evidence density per product", "description": "Prior context cites a URL per claim but not per cell of the comparison matrix. Cells like 'deterministic quality gates: ✅' need a one-line evidence link.", "suggested_action": "For every product × criterion cell, attach a one-line evidence anchor (repo path, doc URL, or 'unverified'). Reject cells with no evidence from the in-scope set."}, {"area": "Sunset and version drift not checked", "description": "Several seeds (e.g., Claude Harness, AgentHub, Conductor) may have changed scope, been renamed, or gone dormant since the category pack was written.", "suggested_action": "Verify last commit / last release date and current scope for every seed before the landscape ships. Move dormant (>12 months no release) products to a 'dormant — verify' bucket and out of Top-N."}, {"area": "Adjacent-section coverage", "description": "Adjacent seeds (LangGraph, CrewAI, MetaGPT, LangChain, AxonFlow, Cavekit v4) need explicit treatment; the prior context does not analyze why each is adjacent vs in-scope.", "suggested_action": "For each adjacent seed, document the 7-criteria pass/fail pattern that demoted it (e.g., LangGraph = generic_agent_framework, no shipped SDLC enforcement). This prevents reader confusion and supports later reclassification if a product evolves."}, {"area": "Confidence-claim linkage", "description": "Confidence scores float independently of evidence count and recency; high-confidence claims sometimes rest on a single source.", "suggested_action": "Tie confidence to a 2-axis rubric: (a) number of independent sources, (b) source authority. Cap confidence at the lower of the two. A 0.92 claim backed by one vendor-controlled source should drop to ~0.65."}]}, "authoritative": true}, {"schema_id": "dr-phase-contribution-envelope-v1", "version": "1.0.0", "run_id": "run-57f38dfa25d83cc50d224e283d4692f3", "work_item_id": "work-1b8aaa25eb4fe996d9ca130354287452", "phase_id": "DR-CRITIQUE", "logical_model_id": "ocg-qwen3.7-plus", "attempt_id": "attempt-51881c3e-8026-41a5-99eb-5fd210e1d793", "model_family_id": "qwen", "payload": {"critiques": [{"target": "Silver Bullet confidence score (0.92)", "severity": "high", "finding": "Confidence is unjustifiably high given that most APO seeds (Deepwork, Turboshovel, Barkain, Claude Code Expert, AgentHub, ATeam) have no claims at all — suggesting incomplete research rather than SB dominance. The 0.92 score reflects SB documentation quality, not comparative market evidence."}, {"target": "Tertiary market composition", "severity": "critical", "finding": "The category pack's hard-exclusion list explicitly bars Magic.dev, Cognition Scout, Cursor, Claude Code, Codex, and GitHub Copilot, yet the prior context lists them in the tertiary agentic-sdlc-saas market. This is a direct contract violation — the analysis must exclude these or the category pack must be amended."}, {"target": "APO market fragmentation claim", "severity": "medium", "finding": "Claim that 'most seeds are community packs or thin wrappers' is asserted at 0.78 confidence without evidence for 10+ of the 16 named APO seeds. cc10x, Director, Claude Harness, AgentHub, ATeam, Deepwork, Turboshovel, Cavekit v3.1, and Barkain all lack substantive evaluation."}, {"target": "AI-DLC positioning", "severity": "medium", "finding": "AI-DLC is claimed as one of only two seeds with 'documented multi-phase lifecycle enforcement' but the supporting source (AWS / awslabs materials) describes a conceptual framework, not a shipped product with hooks/gates/packaging. Conflates methodology documentation with product capability."}, {"target": "Secondary market substitute threat", "severity": "low", "finding": "Claim that OSS packs 'lack deterministic gate enforcement and cross-session state' is plausible but unverified for each pack. BMAD and GSD may have evolved hook/gate capabilities; the assertion needs per-product evidence rather than blanket characterization."}, {"target": "Truncated Zuvo analysis", "severity": "medium", "finding": "The fourth claim is cut off mid-sentence, indicating incomplete analysis. Zuvo's OSS classification and market positioning need full articulation."}], "gaps": [{"area": "APO seed coverage", "description": "10 of 16 APO seeds have zero claims. No evidence gathered on Deepwork, Turboshovel, Cavekit v3.1, Barkain Workflow Orchestrator, Claude Code Expert, AgentHub, ATeam, or Director. Cannot assess market fragmentation without evaluating the fragments.", "suggested_action": "Research each APO seed against the 7 inclusion criteria. Produce per-seed pass/fail matrix. Recalculate market structure claims only after coverage is complete."}, {"area": "Hard-exclusion compliance", "description": "Tertiary market includes 6 products explicitly barred by the category pack's hard-exclusion list. This invalidates the tertiary market composition and any comparative claims involving those products.", "suggested_action": "Remove Magic.dev, Cognition Scout, Cursor, Claude Code, Codex, and GitHub Copilot from tertiary market. Replace with in-scope alternatives from the category pack (Factory.ai, Devin, Augment Cosmos, Tembo) or request category pack amendment."}, {"area": "Factory↔Factory.ai aliasing", "description": "Category pack instructs to apply factory↔factory-ai aliases, but no evidence this was consistently applied across all claims and comparisons.", "suggested_action": "Audit all references to ensure Factory.ai and Factory are treated as the same product. Standardize naming to 'Factory.ai' per category pack convention."}, {"area": "Cross-market evolution analysis", "description": "No assessment of whether secondary-market OSS packs (BMAD, GSD, Superpowers) could evolve deterministic gates and cross-session state to become APOs, threatening SB's primary-market position.", "suggested_action": "Add a 'market convergence risk' section analyzing each secondary-market pack's roadmap, contributor activity, and architectural capacity to absorb APO capabilities."}, {"area": "Startup-weighted comparison matrix", "description": "The research query explicitly requires 'startup-weighted comparison matrix entries' but no matrix is present in the prior context. Claims are narrative-only without structured per-criterion scoring.", "suggested_action": "Produce a comparison matrix with rows = in-scope solutions, columns = 7 inclusion criteria + evidence strength + startup-weighted score. Each cell must cite source."}, {"area": "Cavekit v3.1 vs v4 classification", "description": "Cavekit v3.1 is listed as an APO seed; Cavekit v4 is listed as adjacent-only. No justification for why a version bump changes market classification. Possible aliasing error or missing analysis.", "suggested_action": "Clarify whether Cavekit v3.1 and v4 are the same product line. If so, justify the split classification or consolidate. If different products, provide per-version evidence against inclusion criteria."}, {"area": "Evidence-backed claim requirement", "description": "Research query requires 'evidence-backed claims' but several claims cite only homepages or topic pages (sb.alolabs.dev, github.com/topics/claude-code-plugin) without specific documentation of capabilities.", "suggested_action": "Replace generic homepage citations with specific documentation links showing each claimed capability (e.g., hooks documentation for deterministic gates, plugin manifest for packaging, memory system docs for cross-session state)."}]}, "authoritative": true}, {"schema_id": "dr-phase-contribution-envelope-v1", "version": "1.0.0", "run_id": "run-57f38dfa25d83cc50d224e283d4692f3", "work_item_id": "work-1b8aaa25eb4fe996d9ca130354287452", "phase_id": "DR-CRITIQUE", "logical_model_id": "ocg-deepseek-v4-flash", "attempt_id": "attempt-51881c3e-8026-41a5-99eb-5fd210e1d793", "model_family_id": "deepseek", "payload": {"critiques": [{"target": "SB-primary bias in competitor characterization", "severity": "high", "finding": "Claim 2 dismisses cc10x, Director, Claude Harness, AgentHub, ATeam as 'community packs or thin wrappers' without evidence. This is a rhetorical framing that skews the APO comparison toward SB's favor. Each of these seeds may have legitimately different architectural approaches (e.g., Conductor (SaaS-adjacent coding-agent aggregator, not APO)'s pipeline DSL, AgentHub's multi-runtime abstraction) that deserve neutral description. Suggestion: replace dismissive labels with structured comparison across inclusion criteria."}, {"target": "Hard exclusion list overreach", "severity": "high", "finding": "Cursor Background Agents, Windsurf, and OpenHands are hard-excluded but at least one has a plausible process-orchestration layer. Cursor Background Agents runs parallel agentic workflows with gated progression; Windsurf has agentic cascades. The exclusion rationale 'never list as in-scope' contradicts the analysis instruction to map 'Cosmos/Factory/Devin-class vendors as landscape peers per market definition.' Either justify each exclusion with specific failure against inclusion criteria, or move to Adjacent."}, {"target": "Market segmentation overlap ambiguity", "severity": "medium", "finding": "Cursor, Claude Code, Codex, and GitHub Copilot appear in tertiary market (agentic SDLC SaaS) AND in hard exclusion classes as 'host_runtime.' This is contradictory. A product cannot simultaneously be an in-scope market peer and a never-list exclusion. The host_runtime exclusion says 'adjacent only, not a process-orchestrator peer' — but tertiary classification lists them as peers. Resolve: either admit them as Adjacent-only with rationale, or treat their process-orchestration-specific layers (e.g., Cursor Background Agents, Codex Skills) separately from the runtime itself."}, {"target": "Claim 1 confidence overstatement", "severity": "medium", "finding": "Claiming SB 'satisfies all 7 inclusion criteria' at 0.92 confidence is unsupported without public evidence for criteria 6 (quality/release enforcement claim). The claim cites sb.alolabs.dev but this is the product's own site — not independent validation. The 'most complete open-source APO' superlative needs comparative evidence (how many criteria does each competitor satisfy?). Suggestion: add a scored criteria matrix before making superlative claims."}, {"target": "Secondary market underweighted in competitive threat assessment", "severity": "medium", "finding": "The analysis correctly identifies SDLC plugins as 'the most formidable substitute set' but the solution-card depth planned for secondary market appears lighter than for APO. BMAD, GSD, and Superpowers each have distinct design philosophies (methodology-first vs. workflow-first vs. prompt-pack-first) that deserve the same criteria-based comparison as APO seeds. Suggestion: apply the same 7-criteria scoring to secondary-market products so the 'formidable substitute' claim is evidence-based."}, {"target": "Missing enterprise-grade APO seeds", "severity": "high", "finding": "Several established process-orchestration platforms are absent from the must-research list: (1) Dify.ai — visual workflow builder with multi-agent orchestration, gated pipelines, and cross-session state; satisfies ≥4 inclusion criteria. (2) Fixie.ai — agent orchestration platform with deterministic routing and plugin packaging. (3) LangGraph Platform / LangSmith — the LangChain ecosystem ships actual SDLC-process enforcement via LangGraph's human-in-the-loop and LangSmith's evaluation gates. Even though LangGraph is listed as 'generic_agent_framework,' the LangSmith evaluation layer satisfies deterministic quality gates and quality/release enforcement. Suggestion: add Dify.ai and LangSmith to must-research; evaluate against inclusion criteria rather than excluding by product-line ancestry."}, {"target": "No scoring methodology defined", "severity": "high", "finding": "The inclusion criteria specify ≥3 of 7 to pass, but there is no rubric for HOW each criterion is evaluated (binary, Likert, weighted). Without a documented scoring methodology, comparisons are opaque and unverifiable. Different evaluators could score the same product differently. Suggestion: define a 0-3 scale per criterion with anchor examples, and include a scored matrix as a figure/chart."}, {"target": "Tertiary market depth insufficient", "severity": "medium", "finding": "Factory.ai, Devin, Augment Cosmos, and Tembo are listed but there's no evidence of product-specific research into their actual process-orchestration layers. Factory.ai's 'Factory OS' is a test/CI orchestration platform that may satisfy deterministic quality gates and multi-phase lifecycle coverage — but this needs source-backed investigation. Without it, the tertiary analysis risks being name-only. Suggestion: conduct product-level research for each tertiary seed before charting."}], "gaps": [{"area": "Market sizing and segmentation data", "description": "No TAM/SAM/SOM estimates exist for any of the three markets. The procurement audience needs market size context to evaluate investment relevance. Even rough ranges (e.g., 'APO TAM estimated at $X00M by 2027 based on Y reports') would anchor the landscape.", "suggested_action": "Research analyst reports (Gartner, Forrester) or VC funding data to estimate market size ranges per segment. If no public estimates exist, derive from adjacent markets (agent orchestration platforms, DevOps toolchains)."}, {"area": "Pricing and commercial tier comparison", "description": "The analysis has no pricing data. For a procurement-targeted landscape, pricing tiers (free, pro, enterprise, self-hosted) are table stakes. Missing pricing makes the 'substitute set' analysis incomplete — a free OSS pack may be a better substitute than a $50/seat SaaS even if functionally weaker.", "suggested_action": "Research and add a pricing dimension to the comparison matrix: open-source (free), freemium, per-seat SaaS, self-hosted enterprise. Annotate where pricing is undisclosed."}, {"area": "Host runtime integration matrix", "description": "Each APO candidate's compatibility with host runtimes (Claude Code, Codex, Cursor, Copilot) is not systematically mapped. Integration breadth is a key differentiator for APO. Silver Bullet's multi-host support is a strength that needs competitive context.", "suggested_action": "Create a host-integration matrix showing which runtimes each APO/plugin supports, with notes on integration depth (hook layer, MCP server, plugin API, shell wrapper)."}, {"area": "Technical depth and architecture assessment", "description": "No assessment of code quality, extensibility architecture, performance characteristics, or security posture. These matter for enterprise procurement (vendor risk, maintainability, security audit).", "suggested_action": "Add an architecture quality dimension to the comparison: packaging format, dependency footprint, test coverage indicators, release cadence, security audit posture."}, {"area": "Community health and traction metrics", "description": "GitHub stars, contributor counts, commit frequency, issue response times, and community activity levels are absent. These are standard signals in landscape analysis for OSS and OSS-adjacent products.", "suggested_action": "Research and add community health metrics (stars, contributors, commits/month, release lag) for each candidate. Use consistent data sources and timestamps."}, {"area": "Use-case-to-product fit mapping", "description": "The landscape lacks a 'best fit for scenario' analysis. Differ   #content h2 { font-size: 1.5rem; font-weight: 500; border-bottom: 1px solid var(--sb-border-soft); padding-bottom: 8px;
                margin: 36px 0 14px; color: var(--sb-primary); line-height: 1.25; letter-spacing: -0.01em;
                scroll-margin-top: calc(var(--sb-topbar-h) + 108px); }
  #content h3 { font-size: 1.25rem; font-weight: 500; margin: 28px 0 10px; color: var(--sb-primary-mid); line-height: 1.3;
                scroll-margin-top: calc(var(--sb-topbar-h) + 108px); }
  #content h4 { font-size: 1.0625rem; font-weight: 500; margin: 18px 0 8px; color: var(--sb-primary-mid); line-height: 1.35; }
  #content p { margin: 0 0 12px; font-size: 1rem; font-weight: 300; }
  #content ul, #content ol { margin: 0 0 12px 24px; }
  #content li { margin: 4px 0; font-weight: 300; }
  #content th { border: none; }
  #content td { border: none; font-weight: 300; }
  #content code { background: var(--sb-surface-hover); padding: 2px 6px; border-radius: 4px;
                  font-family: 'SF Mono', Consolas, monospace; font-size: 0.875em; }
  #content pre { background: var(--sb-sidebar-bg); color: var(--sb-sidebar-ink); padding: 16px; border-radius: 8px;
                 overflow-x: auto; margin: 12px 0; }
  #content pre code { background: none; color: inherit; padding: 0; }
  #content blockquote { border-left: 4px solid var(--sb-primary-mid); padding: 8px 16px;
                        background: var(--sb-accent-soft); margin: 12px 0; color: var(--sb-ink); }
  #content strong { font-weight: 500; }
  #content em { font-style: italic; }
  #content hr { border: none; border-top: 1px solid var(--sb-border-muted); margin: 32px 0; }
  /* Info cards — Shortlist Profiles & Future Outlook */
  .info-card { border:1px solid var(--sb-border); border-radius:10px; margin:10px 0; overflow:hidden; }
  .info-card-header { display:flex; align-items:center; justify-content:space-between; padding:11px 16px; background:var(--sb-surface-muted); cursor:pointer; font-weight:500; font-size:1.0625rem; color:var(--sb-ink); user-select:none; }
  .info-card-header:hover { background:var(--sb-accent-soft); }
  .info-card-toggle { color:var(--sb-muted-light); flex-shrink:0; padding-left:10px; line-height:1; display:inline-flex; align-items:center; }
  .info-card-body { display:none; padding:12px 18px 16px; font-size:14px; font-weight:300; }
  .info-card-body.open { display:block; }
  #stats { font-size: 11px; color: var(--sb-muted); margin-top: 8px; padding-top: 8px;
           border-top: 1px solid var(--sb-sidebar-hover); }
  .chart-frame { background: var(--sb-surface); border: 1px solid var(--sb-border); border-radius: 10px;
                 padding: 28px 32px; margin: 20px 0 28px; box-shadow: 0 2px 8px var(--sb-shadow);
                 opacity:0; transform:translateY(22px); transition:opacity .55s ease, transform .55s ease;
                 will-change: opacity, transform; min-width: 0; width: 100%; max-width: 100%; }
  .chart-frame.in-view { opacity:1; transform:translateY(0); }
  .chart-canvas-wrap {
    position: relative; width: 100%; min-width: 0; max-width: 100%;
    height: 480px; overflow: hidden;
  }
  .chart-canvas-wrap--vc { height: 440px; }
  .chart-canvas-wrap canvas { display: block; width: 100% !important; max-width: 100%; }
  .chart-title { font-size: 0.6875rem; font-weight: 500; text-transform: uppercase;
                 letter-spacing: .8px; color: var(--sb-muted); margin-bottom: 6px; }
  .chart-subtitle { font-size: 12px; color: var(--sb-muted-light); margin-bottom: 20px; }
  .chart-source-table { margin-top: 20px; }
  .chart-source-table summary { font-size: 12px; color: var(--sb-primary-mid); cursor: pointer; }
  .chart-source-table table { margin-top: 8px; }
  .wave-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; }
  .wave-legend span { display: flex; align-items: center; gap: 5px; }
  .wave-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
  .vc-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; }
  .vc-legend span { display: flex; align-items: center; gap: 5px; }
  .vc-legend i { display: inline-block; width: 28px; height: 3px; border-radius: 2px; }
  .vc-legend .dashed { border-top: 2px dashed currentColor; background: transparent; height: 0; }

  /* Solution Nav */
  #solutionNav {
    position: fixed; top: var(--sb-safe-top); left: var(--sb-sidebar-w); right: 0; z-index: 10000;
    background: var(--sb-sidebar-bg);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--sb-sidebar-hover);
    padding: 6px 14px;
    display: flex; flex-direction: column; gap: 4px;
    min-width: 0; overflow: hidden;
  }
  .topbar-chrome {
    display: flex; align-items: center; gap: 8px;
    width: 100%; min-height: 36px; flex-shrink: 0;
  }
  .topbar-chrome__spacer { flex: 1; min-width: 8px; }
  .topbar-filter-bar {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    min-width: 0; max-width: min(62vw, 720px);
  }
  .topbar-filter-bar .vf-label {
    font-size: 10px; font-weight: 500; letter-spacing: 0.6px;
    color: var(--sb-sidebar-muted); text-transform: uppercase; flex-shrink: 0;
  }
  /* Solution nav collapse — all viewports */
  #solutionNav.snav-collapsed .snav-body { display: none; }
  #solutionNav:not(.snav-collapsed) { box-shadow: 0 4px 16px var(--sb-shadow); }
  /* Desktop sidebar collapse */
  body.sb-sidebar-collapsed { --sb-sidebar-w: 0px; }
  body.sb-sidebar-collapsed #sidebar {
    width: 0;
    padding: 0;
    overflow: hidden;
    border: none;
    pointer-events: none;
  }
  body.sb-sidebar-collapsed #sidebar #toc,
  body.sb-sidebar-collapsed #sidebar #stats,
  body.sb-sidebar-collapsed #sidebar .sidebar-head {
    display: none;
  }
  #sidebarToggle {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--sb-border);
    background: var(--sb-surface); color: var(--sb-ink); cursor: pointer;
    box-shadow: 0 2px 8px var(--sb-shadow); flex-shrink: 0;
    position: static;
    z-index: 10061;
    pointer-events: auto;
  }
  #sidebarToggle:hover { background: var(--sb-surface-hover); border-color: var(--sb-primary-mid); color: var(--sb-primary-mid); }
  #snavToggle {
    font-size: 11px; font-weight: 500; letter-spacing: .4px;
    padding: 5px 12px; border-radius: 14px; border: 1px solid rgba(148,163,184,0.45);
    background: var(--sb-snav-chip-bg); color: var(--sb-sidebar-ink); cursor: pointer;
    flex-shrink: 0;
  }
  .snav-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .snav-row {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    overflow-x: auto; scrollbar-width: none;
    padding: 1px 0;
  }
  .snav-row::-webkit-scrollbar { display: none; }
  .snav-label {
    font-size: 9.5px; font-weight: 500; color: var(--sb-sidebar-ink); letter-spacing: 1px;
    min-width: 90px; flex-shrink: 0; text-transform: uppercase;
  }
  .snav-btn {
    font-size: 10.5px; padding: 4px 11px; border-radius: 14px;
    border: none; outline: none; background: var(--sb-snav-chip-bg);
    color: var(--sb-sidebar-ink); cursor: pointer; white-space: nowrap;
    transition: all .2s ease; flex-shrink: 0;
  }
  .snav-btn:hover, .snav-btn:focus, .snav-btn:focus-visible {
    border: none; outline: none; background: var(--sb-snav-chip-hover);
    color: var(--sb-sidebar-link-active);
  }
  .snav-btn.active {
    background: var(--sb-primary-mid);
    border: none; outline: none; color: #fff; font-weight: 500;
  }

  /* Reading Progress Bar */
  #readProgress { position:fixed; top:var(--sb-topbar-h); left:var(--sb-sidebar-w); right:0; height:3px; width:auto; background:transparent; z-index:9999; pointer-events:none; }
  #readProgressBar { position:absolute; top:0; left:0; height:3px; width:0%; background:var(--sb-primary-mid); transition:width .1s linear; }

  /* Sticky Breadcrumb */
  #breadcrumb { position:fixed; top:calc(var(--sb-topbar-h) + 1px); left:var(--sb-sidebar-w); right:0; height:32px; background:var(--sb-breadcrumb-bg); backdrop-filter:blur(8px); z-index:9998; display:flex; align-items:center; padding:0 28px; font-size:12px; letter-spacing:0.3px; color:var(--sb-muted); border-bottom:1px solid var(--sb-border-muted); box-shadow:0 1px 3px var(--sb-shadow); min-width:0; overflow:hidden; }
  #bcSection, #bcSub { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #bcSection { flex: 0 1 auto; max-width: 58%; }
  #bcSub { flex: 1 1 auto; max-width: 42%; }

  /* Theme switcher — inside collapsed top bar */
  #themeToggle {
    position: static;
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--sb-border); background: var(--sb-surface);
    color: var(--sb-ink); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px var(--sb-shadow); flex-shrink: 0;
    transition: background .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease;
  }
  #themeToggle:hover {
    background: var(--sb-surface-hover); border-color: var(--sb-primary-mid);
    color: var(--sb-primary-mid); box-shadow: 0 4px 14px var(--sb-shadow-strong);
  }
  #themeToggle .lucide-icon { width: 18px; height: 18px; }
  .topbar-export-cluster {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    margin-left: auto;
    margin-right: 6px;
  }
  .topbar-export-cluster .export-btn,
  .topbar-export-cluster #compareBtn {
    min-height: 36px;
    padding: 6px 10px;
    font-size: 11px;
    border-radius: 16px;
  }
  .topbar-export-cluster .export-btn .btn-icon,
  .topbar-export-cluster #compareBtn .btn-icon { width: 13px; height: 13px; }

  /* Section Colour Coding — enterprise blues/slates */
  .sec-color-0 h2, h2.sec-color-0 { border-left:4px solid var(--sb-primary); padding-left:10px; }
  .sec-color-1 h2, h2.sec-color-1 { border-left:4px solid var(--sb-primary-mid); padding-left:10px; }
  .sec-color-2 h2, h2.sec-color-2 { border-left:4px solid var(--sb-primary-light); padding-left:10px; }
  .sec-color-3 h2, h2.sec-color-3 { border-left:4px solid #5b7fa6; padding-left:10px; }
  .sec-color-4 h2, h2.sec-color-4 { border-left:4px solid var(--sb-muted); padding-left:10px; }
  .sec-color-5 h2, h2.sec-color-5 { border-left:4px solid var(--sb-cons); padding-left:10px; }
  .sec-color-6 h2, h2.sec-color-6 { border-left:4px solid var(--sb-ink-light); padding-left:10px; }
  .sec-color-7 h2, h2.sec-color-7 { border-left:4px solid var(--sb-muted-light); padding-left:10px; }
  a.sec-color-0 { border-left:3px solid var(--sb-primary); padding-left:6px; }
  a.sec-color-1 { border-left:3px solid var(--sb-primary-mid); padding-left:6px; }
  a.sec-color-2 { border-left:3px solid var(--sb-primary-light); padding-left:6px; }
  a.sec-color-3 { border-left:3px solid #5b7fa6; padding-left:6px; }
  a.sec-color-4 { border-left:3px solid var(--sb-muted); padding-left:6px; }
  a.sec-color-5 { border-left:3px solid var(--sb-cons); padding-left:6px; }
  a.sec-color-6 { border-left:3px solid var(--sb-ink-light); padding-left:6px; }
  a.sec-color-7 { border-left:3px solid var(--sb-muted-light); padding-left:6px; }
  #content h2[class*="sec-color"] { background:linear-gradient(90deg,var(--sb-surface-muted),transparent); padding:12px 14px 8px; border-radius:0 6px 6px 0; }

  /* Collapsible Sub-sections */
  #content h3.collapsible { cursor:pointer; user-select:none; display:flex; align-items:flex-start; gap:6px; }
  #content h3.collapsible .collapse-chevron { color:var(--sb-muted); flex-shrink:0; margin-top:2px; }
  .collapsible-body { overflow:hidden; transition:max-height .3s ease; }

  /* Inline Callout Boxes */
  .callout { border-left:4px solid; border-radius:0 6px 6px 0; padding:10px 16px; margin:14px 0; font-size:14px; }
  .callout strong:first-child { display:block; font-size:11px; letter-spacing:.5px; text-transform:uppercase; margin-bottom:4px; }
  .callout-insight { background:var(--sb-accent-soft); border-color:var(--sb-primary-mid); }
  .callout-signal  { background:var(--sb-surface-hover); border-color:var(--sb-muted); }
  .callout-risk    { background:var(--sb-page); border-color:var(--sb-cons); }
  .callout-stat    { background:var(--sb-accent-soft); border-color:var(--sb-primary); }
  .callout-default { background:var(--sb-surface-muted); border-color:var(--sb-muted); }

  /* Trend Cards */
  .trend-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:8px 0 16px; }
  .trend-card { background:var(--sb-surface-muted); border:1px solid var(--sb-border); border-radius:10px; padding:16px 14px; }
  .trend-card:hover { border-color:var(--sb-primary-mid); background:var(--sb-accent-soft); transition:all .2s; }
  .tc-icon { margin-bottom:8px; display:flex; align-items:center; color:var(--sb-primary-mid); }
  .tc-icon .lucide-icon { width:22px; height:22px; }
  .tc-title { font-size:1.0625rem; font-weight:500; color:var(--sb-ink); margin-bottom:6px; }
  .tc-body { font-size:12px; color:var(--sb-muted); line-height:1.5; font-weight:300; }

  /* Vendor Profile Cards */
  .vendor-card { border:1px solid var(--sb-border); border-radius:10px; margin:16px 0; overflow:hidden; }
  .vc-header { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--sb-surface-muted); cursor:pointer; }
  .vc-avatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500; color:#fff; flex-shrink:0; background:var(--sb-primary-mid); }
  .vc-name { font-size:1.25rem; font-weight:500; flex:1; color:var(--sb-primary-mid); line-height:1.3; }
  .vc-compare { display:inline-flex; align-items:center; flex-shrink:0; cursor:pointer; margin:0; padding:4px; }
  .vc-compare input { width:16px; height:16px; accent-color:var(--sb-primary-mid); cursor:pointer; margin:0; }
  .vendor-card.is-compare-selected { border-color:var(--sb-primary-mid); box-shadow:0 0 0 1px var(--sb-primary-mid); }
  .vendor-card.is-compare-selected .vc-header { background:var(--sb-accent-soft); }
  .vendor-card { scroll-margin-top: calc(var(--sb-topbar-h) + 108px); }
  .vc-toggle { color:var(--sb-muted-light); padding:4px 10px; display:inline-flex; align-items:center; line-height:1; }
  .vc-toggle .lucide-icon { width:18px; height:18px; }
  .vc-tags { display:flex; gap:6px; flex-wrap:wrap; padding:8px 16px 0; }
  .vc-tag { font-size:10px; padding:2px 8px; border-radius:12px; background:var(--sb-accent-soft); color:var(--sb-primary-mid); font-weight:500; }
  .vc-body { padding:0 16px 16px; }
  .vc-body.vc-collapsed { display:none; }
  .vendor-card:hover { border-color:var(--sb-primary-mid); box-shadow:0 2px 8px var(--sb-shadow); transition:all .2s ease; }

  /* Filterable Vendor View */
  .vfbtn { font-size: 11px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--sb-border); background: var(--sb-surface); cursor: pointer; color: var(--sb-ink); white-space: nowrap; }
  .vfbtn.active { background: var(--sb-primary-mid); color: #fff; border-color: var(--sb-primary-mid); }
  .vfbtn:hover:not(.active):not(:disabled) { background: var(--sb-surface-muted); }
  .vfbtn.is-hidden { display: none !important; }
  .vfbtn:disabled, .vfbtn.is-empty {
    opacity: 0.45; cursor: not-allowed; text-decoration: line-through;
  }
  .matrix-fill-gap {
    margin: 12px 0 18px; padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--sb-border); background: var(--sb-surface-muted);
    color: var(--sb-ink); font-size: 13px; line-height: 1.45;
  }
  .matrix-fill-gap strong { color: var(--sb-ink); }
  .vc-name a, .vc-name-link {
    color: var(--sb-link);
    text-decoration: none;
    transition: color .15s ease;
  }
  .vc-name a:hover, .vc-name-link:hover { color: var(--sb-link-hover); }
  .snav-btn.is-filtered-out { display: none !important; }
  a.snav-btn { text-decoration: none; display: inline-block; }
  .vendor-card.is-filtered-out { display: none !important; }

  /* Vendor Name Links */
  .vname-link {
    cursor: pointer;
    text-decoration: none;
    color: var(--sb-link);
    transition: color .15s ease;
  }
  .vname-link:hover {
    color: var(--sb-link-hover);
  }

  /* Content hyperlinks — markdown, tables, compare matrix */
  #content a:not(.snav-btn),
  #compareResultsBody a,
  .chart-source-table a {
    color: var(--sb-link);
    text-decoration: none;
    transition: color .15s ease;
  }
  #content a:not(.snav-btn):hover,
  #compareResultsBody a:hover,
  .chart-source-table a:hover,
  #content a:not(.snav-btn):focus-visible,
  #compareResultsBody a:focus-visible {
    color: var(--sb-link-hover);
  }
  #content a:not(.snav-btn):visited:not(:hover),
  #compareResultsBody a:visited:not(:hover) {
    color: var(--sb-link-visited);
  }
  #content a:not(.snav-btn):focus-visible,
  #compareResultsBody a:focus-visible {
    outline: 2px solid var(--sb-link);
    outline-offset: 2px;
    border-radius: 2px;
  }

  /* Export action buttons */
  #exportBar {
    position: fixed;
    bottom: calc(24px + var(--sb-safe-bottom));
    right: calc(24px + env(safe-area-inset-right, 0px));
    z-index: 1003;
    display: flex; align-items: center; gap: 10px;
  }
  #exportBar.export-bar--flow {
    position: static;
    left: auto;
    right: auto;
    margin: 40px auto 24px;
    width: fit-content;
    max-width: calc(100% - 24px);
    justify-content: center;
    flex-wrap: wrap;
    z-index: 20;
  }
  .export-btn {
    color: var(--sb-btn-ink); background: var(--sb-btn-bg);
    border: 1px solid var(--sb-border); padding: 10px 18px; border-radius: 20px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    box-shadow: 0 2px 8px var(--sb-shadow);
    display: flex; align-items: center; gap: 6px;
    transition: all .2s ease; white-space: nowrap;
  }
  .export-btn:hover { transform: translateY(-1px); background: var(--sb-btn-hover); box-shadow: 0 4px 14px var(--sb-shadow-strong); }
  .export-btn:active { transform: translateY(0); }
  .export-btn .btn-icon { width:15px; height:15px; }
  .lucide-icon { width:16px; height:16px; stroke-width:2; }
  .lucide-icon svg { width:100%; height:100%; }
  .lucide-icon.is-spinning svg { animation: lucide-spin 1s linear infinite; }
  @keyframes lucide-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  #sidebarToggle .lucide-icon { width:18px; height:18px; }
  #snavToggle { display:inline-flex; align-items:center; gap:6px; }
  #snavToggle .snav-chevron { width:14px; height:14px; }
  .icon-btn { background:none; border:none; cursor:pointer; color:var(--sb-muted); display:inline-flex; align-items:center; padding:4px; }
  .icon-btn .lucide-icon { width:18px; height:18px; }
  #compareBtn { display:flex; align-items:center; gap:6px; color:var(--sb-btn-ink); background:var(--sb-btn-bg); border:1px solid var(--sb-border); padding:10px 18px; border-radius:20px; cursor:pointer; font-size:13px; font-weight:500; box-shadow:0 2px 8px var(--sb-shadow); transition:all .2s ease; white-space:nowrap; }
  #compareBtn:hover { background:var(--sb-btn-hover); box-shadow:0 4px 14px var(--sb-shadow-strong); transform:translateY(-1px); }

  /* Toast notification */
  .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--sb-ink); color:var(--sb-sidebar-ink); padding:8px 16px; border-radius:8px; font-size:13px; z-index:10001; opacity:1; transition:opacity .5s; pointer-events:none; }
  .toast.fade { opacity:0; }

  /* Vendor Comparison Drawer */
  #compareBadge { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; background:var(--sb-primary); border-radius:50%; font-size:10px; margin-left:6px; color:#fff; }
  .compare-drawer {
    position: fixed;
    bottom: calc(72px + var(--sb-safe-bottom));
    right: calc(24px + env(safe-area-inset-right, 0px));
    width: 560px; max-height: 70vh;
    overflow-y: auto; overflow-x: hidden;
    background: var(--sb-surface); border: 1px solid var(--sb-border);
    border-radius: 12px; padding: 20px;
    z-index: 1002;
    box-shadow: 0 8px 24px var(--sb-shadow-strong);
    display: none;
  }
  .compare-drawer.open { display: block; }
  #compareTableWrap { font-size: 12px; color: var(--sb-muted); }
  .compare-results-section {
    margin-top: 48px; padding-top: 28px;
    border-top: 2px solid var(--sb-border-soft);
    scroll-margin-top: calc(var(--sb-topbar-h) + 108px);
  }
  .compare-results-section h2 { margin-top: 0; }
  #compareResultsBody .table-scroll-wrap { margin: 12px 0 0; }
  #compareResultsBody table { min-width: 480px; font-size: 12px; }
  .compare-empty { color: var(--sb-muted); font-size: 14px; margin: 8px 0 0; }
  .cmp-remove { cursor: pointer; color: var(--sb-muted); font-size: 12px;
    display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; }
  .chart-canvas-wrap canvas { cursor: pointer; }
  .quadrant-compare-layer {
    position: absolute; inset: 0; pointer-events: none; z-index: 4;
