  function _isLinkableVendorName(name) {
    const label = String(name || '').trim();
    if (!label) return false;
    if (GENERIC_LINK_BLOCKED.has(label.toLowerCase())) return false;
    if (label === label.toUpperCase() && label.length <= 4 && !['BMAD', 'GSD'].includes(label)) {
      return false;
    }
    return true;
  }

  function _refreshVendorSets() {
    // Active market chart buckets drive filters so Commercial/OSS/Leaders match
    // the plotted membership for the market currently injected into MQ/GMQ/Wave.
    // Fall back to PRIMARY only when the active chart has empty buckets.
    const activeBuckets = (typeof VENDOR_BUCKETS === 'object' && VENDOR_BUCKETS)
      ? VENDOR_BUCKETS
      : null;
    const primaryBuckets = (typeof PRIMARY_CHART_DATA === 'object' && PRIMARY_CHART_DATA)
      ? PRIMARY_CHART_DATA.vendor_buckets
      : null;
    const activeHasLists = !!(activeBuckets && (
      (activeBuckets.commercial && activeBuckets.commercial.length) ||
      (activeBuckets.oss && activeBuckets.oss.length)
    ));
    const buckets = activeHasLists
      ? activeBuckets
      : ((primaryBuckets && typeof primaryBuckets === 'object') ? primaryBuckets : (activeBuckets || {}));
    // Union commercial/oss across all markets so multi-market cores (e.g. SB in
    // APO ∩ plugins) remain filterable when the sidebar spans the full report.
    const unionCommercial = new Set(buckets.commercial || []);
    const unionOss = new Set(buckets.oss || []);
    if (typeof MARKET_CHARTS === 'object' && MARKET_CHARTS) {
      Object.values(MARKET_CHARTS).forEach(ch => {
        const vb = ch && ch.vendor_buckets;
        if (!vb) return;
        (vb.commercial || []).forEach(l => unionCommercial.add(l));
        (vb.oss || []).forEach(l => unionOss.add(l));
      });
    }
    COMMERCIAL_LABELS = unionCommercial;
    OSS_LABELS = unionOss;
    // Leaders/Challengers stay market-chart-specific (active MQ authority).
    LEADER_LABELS = new Set(buckets.leaders || GMQ_DATA.filter(d => d.q === 'Leaders').map(d => d.label));
    CHALLENGER_LABELS = new Set(buckets.challengers || GMQ_DATA.filter(d => d.q === 'Challengers').map(d => d.label));
    ALL_VENDORS = new Set([
      ...(LINK_PAIRS || []).map(([name]) => name),
      ...Object.keys(VENDOR_URLS || {}),
      ...Object.keys(typeof HOMEPAGE_VENDOR_URLS === 'object' ? HOMEPAGE_VENDOR_URLS : {}),
      ...MQ_DATA.map(d => d.label),
      ...GMQ_DATA.map(d => d.label),
      ...WAVE_DATA.map(d => d.label),
      ...VC_COMMERCIAL.map(s => s.label),
      ...VC_OSS.map(s => s.label),
      ...COMMERCIAL_LABELS,
      ...OSS_LABELS,
    ].filter(_isLinkableVendorName));
  }

  function _vendorUrl(label) {
    if (!label) return '';
    if (typeof HOMEPAGE_VENDOR_URLS === 'object' && HOMEPAGE_VENDOR_URLS[label]) return HOMEPAGE_VENDOR_URLS[label];
    if (typeof VENDOR_URLS === 'object' && VENDOR_URLS[label]) return VENDOR_URLS[label];
    const hit = (LINK_PAIRS || []).find(([name]) => name === label);
    return hit ? hit[1] : '';
  }

  function _homepageFromHeading(h3, displayName) {
    const anchors = [...(h3.querySelectorAll('a[href^="http"]') || [])];
    if (!anchors.length) return '';
    const want = String(displayName || '').trim();
    const exact = anchors.find(a => (a.textContent || '').trim() === want);
    if (exact) return exact.href;
    const fuzzy = anchors.find(a => {
      const t = (a.textContent || '').trim();
      return t && want && (want.includes(t) || t.includes(want));
    });
    if (fuzzy) return fuzzy.href;
    return anchors[anchors.length - 1].href || '';
  }

  function _escAttr(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;');
  }

  function _normalizeVendorLabel(name) {
    return String(name || '').replace(/^\d+\.\s*/, '').replace(/\s*\([^)]*\)\s*$/, '').trim();

  function _vendorMatchesFilter(label, filter) {
    const norm = _normalizeVendorLabel(label);
    if (!filter || filter === 'all') return true;
    if (filter === 'commercial') return COMMERCIAL_LABELS.has(norm) || COMMERCIAL_LABELS.has(label);
    if (filter === 'oss') return OSS_LABELS.has(norm) || OSS_LABELS.has(label);
    if (filter === 'leader') return LEADER_LABELS.has(norm) || LEADER_LABELS.has(label);
    if (filter === 'challenger') return CHALLENGER_LABELS.has(norm) || CHALLENGER_LABELS.has(label);
    return true;
  }

  function removeExtraneousHRs() {

  // ── #4 transformCallouts ─────────────────────────────────────────────────────
  function transformCallouts() {
    document.querySelectorAll('#content blockquote').forEach(bq => {
      const strong = bq.querySelector('strong');
      const typeText = strong ? strong.textContent.toLowerCase().trim() : '';
      let type = 'default';
      if (typeText.startsWith('key insight'))    type = 'insight';
      else if (typeText.startsWith('market signal')) type = 'signal';
      else if (typeText.startsWith('risk'))       type = 'risk';
      else if (typeText.startsWith('stat'))       type = 'stat';
      const div = document.createElement('div');
      div.className = 'callout callout-' + type;
      div.innerHTML = bq.innerHTML;
      bq.parentNode.replaceChild(div, bq);
    });

  // ── #5 buildTrendCards ───────────────────────────────────────────────────────
  function buildTrendCards() {
    const trendH2 = Array.from(document.querySelectorAll('#content h2'))
      .find(h => /trend/i.test(h.textContent));
    if (!trendH2) return;

    const strip = document.createElement('div');
    strip.className = 'trend-strip';
    strip.setAttribute('role', 'list');

    // Collect all nodes between this H2 and next H2 — to replace them later
    const nodesToReplace = [];
    let sib = trendH2.nextElementSibling;

    // Strategy: collect H3 headings as trend titles + following body paragraphs
    // Falls back to OL/UL list items if no H3s are found
    const trendItems = [];  // { title, body }
    let currentTitle = null, currentBodyParts = [];

    while (sib && sib.tagName !== 'H2') {
      nodesToReplace.push(sib);
      if (sib.tagName === 'H3') {
        // Save previous trend
        if (currentTitle !== null) {
          trendItems.push({ title: currentTitle, body: currentBodyParts.join(' ').trim() });
        }
        // Strip "Trend N: " prefix if present
        currentTitle = sib.textContent.trim().replace(/^Trend\s+\d+:\s*/i, '');
        currentBodyParts = [];
      } else if (currentTitle !== null && ['P','UL','OL'].includes(sib.tagName)) {
        currentBodyParts.push(sib.textContent.trim());
      } else if (sib.tagName === 'LI') {
        // Fallback: plain list
        const strong = sib.querySelector('strong');
        if (strong) {
          if (currentTitle !== null) trendItems.push({ title: currentTitle, body: currentBodyParts.join(' ').trim() });
          currentTitle = strong.textContent.trim();
          currentBodyParts = [sib.textContent.replace(strong.textContent, '').replace(/^[:\s–—]+/, '').trim()];
        }
      }
      sib = sib.nextElementSibling;
    }
    if (currentTitle !== null) {
      trendItems.push({ title: currentTitle, body: currentBodyParts.join(' ').trim() });
    }

    // Fallback: try OL/UL directly after H2 if no H3-based items found
    if (trendItems.length === 0) {
      const list = nodesToReplace.find(n => ['OL','UL'].includes(n.tagName));
      if (list) {
        list.querySelectorAll(':scope > li').forEach(li => {
          const strong = li.querySelector('strong');
          if (strong) {
            const clone = li.cloneNode(true);
            clone.querySelectorAll('strong').forEach(s => s.remove());
            trendItems.push({ title: strong.textContent.trim(), body: clone.textContent.replace(/^[:\s–—]+/, '').trim() });
          } else {
            const text = li.textContent.trim();
            const ci = text.indexOf(':');
            trendItems.push(ci > 0
              ? { title: text.slice(0, ci).trim(), body: text.slice(ci + 1).trim() }
              : { title: text.slice(0, 60).trim(), body: text.slice(60).trim() });
          }
        });
      }
    }

    if (trendItems.length === 0) return;

    trendItems.forEach(({ title, body }, idx) => {
      const card = document.createElement('div');
      card.className = 'trend-card';
      card.setAttribute('role', 'listitem');
      // Truncate body to ~120 chars for card readability
      const shortBody = body.length > 130 ? body.slice(0, 127) + '…' : body;
      card.innerHTML =
        `<div class="tc-icon">${lucideIconHtml(TREND_ICONS[idx % TREND_ICONS.length], 'lucide-icon')}</div>` +
        `<div class="tc-title">${title}</div>` +
        `<div class="tc-body">${shortBody}</div>`;
      strip.appendChild(card);
    });

    // Replace all collected nodes with the strip
    const parent = trendH2.parentNode;
    nodesToReplace.forEach(n => n.remove());
    trendH2.after(strip);
  }

  // ── #11 buildInfoCards — Shortlist Profiles & Future Outlook ─────────────────
  function buildInfoCards() {
    const SECTION_PATTERNS = [
      /Buying Guidance|Shortlist/i,
      /Future Outlook|Emerging Disrupt/i
    ];
    SECTION_PATTERNS.forEach(pattern => {
      const h2 = Array.from(document.querySelectorAll('#content h2')).find(h => pattern.test(h.textContent));
      if (!h2) return;

      // Collect H3s and their body nodes between this H2 and next H2
      const items = [];
      let sib = h2.nextElementSibling;
      let currentH3 = null;
      let currentNodes = [];

      while (sib && sib.tagName !== 'H2') {
        if (sib.tagName === 'H3') {
          if (currentH3) items.push({ h3: currentH3, nodes: currentNodes });
          currentH3 = sib;
          currentNodes = [];
        } else if (currentH3) {
          currentNodes.push(sib);
        }
        sib = sib.nextElementSibling;
      }
      if (currentH3) items.push({ h3: currentH3, nodes: currentNodes });
      if (items.length === 0) return;

      // Build cards in a container, replace existing H3+content
      const container = document.createDocumentFragment();
      items.forEach(({ h3, nodes }) => {
        // Strip leading "N. " from title
        const title = h3.textContent.trim().replace(/^\d+\.\s*/, '');

        const card = document.createElement('div');
        card.className = 'info-card';

        const hdr = document.createElement('div');
        hdr.className = 'info-card-header';
        hdr.innerHTML = `<span style="flex:1">${title}</span><span class="info-card-toggle">${lucideIconHtml('chevron-down', 'lucide-icon')}</span>`;

        const body = document.createElement('div');
        body.className = 'info-card-body'; // collapsed by default
        // Remove any trailing HRs
        const cleanNodes = nodes.filter(n => n.tagName !== 'HR');
        cleanNodes.forEach(n => body.appendChild(n));

        hdr.addEventListener('click', () => {
          const isOpen = body.classList.toggle('open');
          setToggleChevron(hdr.querySelector('.info-card-toggle'), isOpen);
        });

        card.appendChild(hdr);
        card.appendChild(body);
        container.appendChild(card);

        h3.remove();
      });

      // Insert container where first H3 was (after H2)
      h2.after(container);

      // Remove any stray <hr> elements directly under this section
      // (markdown --- separators that land between H2 and next H2)
      let el = h2.nextElementSibling;
      const nextH2 = h2.nextElementSibling ? (function findNext(node){
        while (node) { if (node.tagName === 'H2') return node; node = node.nextElementSibling; }
        return null;
      })(h2.nextElementSibling) : null;
      let scan = h2.nextElementSibling;
      while (scan && scan !== nextH2) {
        const nxt = scan.nextElementSibling;
        if (scan.tagName === 'HR') scan.remove();
        scan = nxt;
      }
    });
  }

    /Startup-weighted matrix[^.]*\.\s*/gi,

    /Matrix\s*[—–-][^.]*\.\s*/gi,

    /participates in the agentic[^.]*\.\s*/gi,

    /live multi-AI DR envelopes[^.]*\.\s*/gi,
  ];

  function sanitizeOverviewText(text) {
    let cleaned = String(text || '');
    _OVERVIEW_DUMP_PATTERNS.forEach(pat => { cleaned = cleaned.replace(pat, ''); });
    cleaned = cleaned.replace(/\s{2,}/g, ' ').trim();
    if (!cleaned || cleaned.length < 40) return '';
    if (/participates in the|capability profile derived|triangulat|comparison matrix signals/i.test(cleaned)) {
      return '';
    }
    return cleaned;
  }

  function sanitizeOverviewInBody(body, fallbackName) {
    const nodes = [
      ...body.querySelectorAll('p'),
      ...body.querySelectorAll('li'),
    ];
    nodes.forEach(el => {
      const strong = el.querySelector('strong');
      if (!strong || !/^overview$/i.test(strong.textContent.trim())) return;
      const raw = el.textContent.replace(/^overview\s*:?\s*/i, '').trim();
      const cleaned = sanitizeOverviewText(raw);
      if (cleaned && cleaned !== raw) {
        el.innerHTML = '<strong>Overview</strong>: ' + cleaned;
      } else if (!cleaned) {
        const name = fallbackName || 'This solution';
        el.innerHTML = '<strong>Overview</strong>: ' + name +
          ' is a product in the agentic SDLC orchestration landscape.';
      }
    });
  }

  function buildVendorCards() {
    let vendorIdx = 0;
    document.querySelectorAll('#content h2').forEach(h2 => {
      if (!/Commercial|Open[\s\-]Source|OSS/i.test(h2.textContent)) return;

      const vendorH3s = [];
      let sib = h2.nextElementSibling;
      while (sib && sib.tagName !== 'H2') {
        if (sib.tagName === 'H3') vendorH3s.push(sib);
        sib = sib.nextElementSibling;
      }

      vendorH3s.forEach(h3 => {
        const rawName = h3.textContent.replace(/^[▸▾]\s*/, '').trim();
        // Strip leading "N. " and trailing "(type info)" for display
        const displayName = rawName.replace(/^\d+\.\s*/, '').replace(/\s*\(.*\)\s*$/, '').trim();
        const color = getAvatarPalette()[vendorIdx % 8];
        const initial = displayName.charAt(0).toUpperCase();
        vendorIdx++;

        const contentNodes = [];
        let n = h3.nextSibling;
        while (n) {
          if (n.tagName === 'H2' || n.tagName === 'H3') break;
          contentNodes.push(n);
          n = n.nextSibling;
        }

        // Tags: from <strong> in FIRST <p>, max 4, max 25 chars
        // Filter out structural labels
        const STRUCTURAL_LABELS = new Set(['overview', 'major pros', 'major cons', 'key differentiator', 'best for', 'pricing']);
        const firstP = contentNodes.find(nd => nd.tagName === 'P');
        const tags = [];
        if (firstP) {
          firstP.querySelectorAll('strong').forEach(s => {
            const txt = s.textContent.trim();
            const stripped = txt.toLowerCase().replace(/[:\s]+$/, '');
            if (txt && txt.length <= 25 && tags.length < 4 && !STRUCTURAL_LABELS.has(stripped)) tags.push(txt);
          });
        }

        const card = document.createElement('div');
        card.className = 'vendor-card';
        card.dataset.vendor = rawName;
        const cardSlug = _lookupSlugFromCharts(displayName) || _slugify(displayName);
        card.dataset.slug = cardSlug;
        // Resolve market before H3 is moved into the card (needs preceding H2).
        const marketId = _resolveMarketIdFromNode(h3);
        if (marketId) card.dataset.market = marketId;
        card.id = _vendorCardDomId(cardSlug, marketId);

        const header = document.createElement('div');
        header.className = 'vc-header';
        const vendorUrl = _vendorUrl(displayName) || _vendorUrl(rawName) || _homepageFromHeading(h3, displayName);
        const nameHtml = vendorUrl
          ? `<a class="vc-name-link" href="${_escAttr(vendorUrl)}" target="_blank" rel="noopener noreferrer">${displayName}</a>`
          : displayName;
        header.innerHTML =
          `<label class="vc-compare" title="Add to Compare"><input type="checkbox" class="vc-compare-cb" data-vendor="${displayName.replace(/"/g, '&quot;')}" aria-label="Compare ${displayName.replace(/"/g, '')}"></label>` +
          `<div class="vc-avatar" style="background:${color}">${initial}</div>` +
          `<div class="vc-name">${nameHtml}</div>` +
          `<span class="vc-toggle is-closed">${lucideIconHtml('chevron-down', 'lucide-icon')}</span>`;

        const tagsDiv = document.createElement('div');
        tagsDiv.className = 'vc-tags';
        tags.forEach(t => {
          const pill = document.createElement('span');
          pill.className = 'vc-tag';
          pill.textContent = t;
          tagsDiv.appendChild(pill);
        });

        const body = document.createElement('div');
        body.className = 'vc-body vc-collapsed';
        contentNodes.forEach(nd => { if (nd.tagName !== 'HR') body.appendChild(nd); });
        sanitizeOverviewInBody(body, displayName);

        card.appendChild(header);
        if (tags.length > 0) card.appendChild(tagsDiv);
        card.appendChild(body);

        const compareLabel = header.querySelector('.vc-compare');
        const compareCb = header.querySelector('.vc-compare-cb');
        if (compareLabel) {
          compareLabel.addEventListener('click', (e) => e.stopPropagation());
        }
        if (compareCb) {
          compareCb.addEventListener('click', (e) => e.stopPropagation());
          compareCb.addEventListener('change', (e) => {
            e.stopPropagation();
            const vendor = compareCb.dataset.vendor;
            if (compareCb.checked) {
              if (!_compareSet.has(vendor)) _toggleCompare(vendor);
              if (!_compareSet.has(vendor)) compareCb.checked = false;
            } else if (_compareSet.has(vendor)) {
              _toggleCompare(vendor);
            }
          });
        }
        header.querySelectorAll('.vc-name-link').forEach(a => {
          a.addEventListener('click', (e) => e.stopPropagation());
        });

        header.addEventListener('click', () => {
          const isCollapsed = body.classList.toggle('vc-collapsed');
          const toggle = header.querySelector('.vc-toggle');
          if (toggle) {
            setToggleChevron(toggle, !isCollapsed);
            toggle.classList.toggle('is-closed', isCollapsed);
            toggle.classList.toggle('is-open', !isCollapsed);
          }
        });

        if (h3.parentNode) {
          h3.parentNode.insertBefore(card, h3);
          card.insertBefore(h3, card.firstChild);
          h3.style.display = 'none';
        }
      });
    });
  }

  // ── #7b layoutProsCons ──────────────────────────────────────────────────────
  function layoutProsCons() {
    document.querySelectorAll('.vc-body').forEach(body => {
      // Find "Major Pros" and "Major Cons" sections
      const allEls = Array.from(body.children);
      let prosLabel = null, prosList = null, consLabel = null, consList = null;

      for (let i = 0; i < allEls.length; i++) {
        const el = allEls[i];
        const text = el.textContent || '';
        if (/Major Pros/i.test(text)) {
          prosLabel = el;
          // Find the next UL
          for (let j = i + 1; j < allEls.length; j++) {
            if (allEls[j].tagName === 'UL') { prosList = allEls[j]; break; }
            if (allEls[j].tagName === 'H2' || allEls[j].tagName === 'H3') break;
          }
        }
        if (/Major Cons/i.test(text)) {
          consLabel = el;
          for (let j = i + 1; j < allEls.length; j++) {
            if (allEls[j].tagName === 'UL') { consList = allEls[j]; break; }
            if (allEls[j].tagName === 'H2' || allEls[j].tagName === 'H3') break;
          }
        }
      }

      if (prosLabel && prosList && consLabel && consList) {
        const grid = document.createElement('div');
        grid.className = 'pros-cons-grid';

        const prosCol = document.createElement('div');
        prosCol.className = 'pros-col';
        prosCol.appendChild(prosLabel);
        prosCol.appendChild(prosList);

        const consCol = document.createElement('div');
        consCol.className = 'cons-col';
        consCol.appendChild(consLabel);
        consCol.appendChild(consList);

        grid.appendChild(prosCol);
        grid.appendChild(consCol);

        // Insert grid where prosLabel was
        // Find a good insertion point — insert before the next remaining element after the removed ones
        // Since we removed the elements, just append the grid in a logical spot
        // Find the first element after where cons list was
        const remaining = Array.from(body.children);
        // Find position: insert after overview content, before key differentiator
        let insertBefore = null;
        for (const el of remaining) {
          const t = el.textContent || '';
          if (/Key Differentiator|Best For|Pricing/i.test(t)) { insertBefore = el; break; }
        }
        if (insertBefore) {
          body.insertBefore(grid, insertBefore);
        } else {
          body.appendChild(grid);
        }
      }
    });
  }

  // ── #9 setupCollapsibles ─────────────────────────────────────────────────────
  function setupCollapsibles() {
    document.querySelectorAll('#content h3').forEach(h3 => {
      if (/(3A|3B|3C|Primary 2.2|Wave|Value Curve)/i.test(h3.textContent)) return;
      if (h3.classList.contains('collapsible')) return; // already processed
      if (h3.classList.contains('source-reliability-caption')) return; // table caption, not accordion
      if (h3.closest('.vendor-card')) return; // skip H3s inside vendor cards

      const bodyNodes = [];
      let sib = h3.nextSibling;
      while (sib) {
        if (sib.tagName === 'H2' || sib.tagName === 'H3') break;
        bodyNodes.push(sib);
        sib = sib.nextSibling;
      }
      if (bodyNodes.length === 0) return;

      const bodyDiv = document.createElement('div');
      bodyDiv.className = 'collapsible-body';
      if (h3.parentNode) h3.parentNode.insertBefore(bodyDiv, bodyNodes[0]);
      bodyNodes.forEach(nd => bodyDiv.appendChild(nd));
      bodyDiv.style.maxHeight = bodyDiv.scrollHeight + 'px';

      h3.classList.add('collapsible');
      h3.setAttribute('role', 'button');
      h3.setAttribute('tabindex', '0');
      h3.setAttribute('aria-expanded', 'true');
      const chevron = document.createElement('span');
      chevron.className = 'collapse-chevron';
      chevron.innerHTML = lucideIconHtml('chevron-up', 'lucide-icon');
      h3.insertBefore(chevron, h3.firstChild);

      function toggleCollapsible() {
        const isOpen = h3.getAttribute('aria-expanded') === 'true';
        if (isOpen) {
          bodyDiv.style.maxHeight = '0';
          h3.classList.add('is-closed');
          h3.setAttribute('aria-expanded', 'false');
          setToggleChevron(chevron, false);
        } else {
          bodyDiv.style.maxHeight = bodyDiv.scrollHeight + 'px';
          h3.classList.remove('is-closed');
          h3.setAttribute('aria-expanded', 'true');
          setToggleChevron(chevron, true);
        }
      }

      h3.addEventListener('click', toggleCollapsible);
      h3.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCollapsible(); }
      });
    });
  }

  // ── NEW buildSolutionNav ─────────────────────────────────────────────────────
  function buildSolutionNav() {
    const navEl = document.getElementById('solutionNav');
    if (!navEl) return;

    const commRow = document.getElementById('snavCommercial');
    const ossRow  = document.getElementById('snavOSS');
    if (!commRow || !ossRow) return;

    // Remove existing buttons (keep label span)
    commRow.querySelectorAll('.snav-btn').forEach(b => b.remove());
    ossRow.querySelectorAll('.snav-btn').forEach(b => b.remove());

    // Collect vendor occurrences from DOM sections (multi-market keeps each market).
    function collectVendorEntries(sectionTest) {
      const entries = [];
      const seen = new Set();
      for (const h2 of document.querySelectorAll('#content h2')) {
        if (!sectionTest(h2.textContent)) continue;
        const marketId = _resolveMarketIdFromNode(h2);
        let sib = h2.nextElementSibling;
        while (sib && sib.tagName !== 'H2') {
          if (sib.tagName === 'H3') {
            const raw = sib.textContent.replace(/^[▸▾]\s*/, '').trim();
            const display = raw.replace(/^\d+\.\s*/, '').replace(/\s*\(.*\)\s*$/, '').trim();
            const key = display.toLowerCase() + '::' + (marketId || '');
            if (raw && !seen.has(key)) {
              seen.add(key);
              entries.push({ raw, display, marketId });
            }
          }
          sib = sib.nextElementSibling;
        }
      }
      return entries;
    }

    const commEntries = collectVendorEntries(t => /commercial/i.test(t));
    const ossEntries  = collectVendorEntries(t => /open[\s\-]source|oss/i.test(t));

    function addPills(row, entries) {
      const nameCounts = {};
      entries.forEach(e => {
        const k = e.display.toLowerCase();
        nameCounts[k] = (nameCounts[k] || 0) + 1;
      });
      entries.forEach(entry => {
        const { raw, display, marketId } = entry;
        const multi = nameCounts[display.toLowerCase()] > 1;
        const slug = _lookupSlugFromCharts(display) || _slugify(display);
        const cardId = _vendorCardDomId(slug, marketId);
        const vendorUrl = _vendorUrl(display) || _vendorUrl(raw);
        // Multi-market duplicates: in-page anchors so both cards are reachable via snav.
        // Unique vendors with a homepage: keep external link behavior.
        const useInPage = multi || !vendorUrl;
        const el = document.createElement(useInPage || vendorUrl ? 'a' : 'button');
        el.className = 'snav-btn';
        el.dataset.vendor = raw;
        if (marketId) el.dataset.market = marketId;
        el.dataset.slug = slug;
        el.textContent = multi && marketId
          ? `${display} · ${_marketShortLabel(marketId)}`
          : display;
        if (useInPage) {
          el.href = '#' + cardId;
          el.title = multi && marketId
            ? `Jump to ${display} (${_marketShortLabel(marketId)})`
            : `Jump to ${display}`;
          el.addEventListener('click', (e) => {
            e.preventDefault();
            if (typeof window._scrollToVendorCard === 'function') {
              window._scrollToVendorCard(slug, marketId);
            } else {
              _scrollToVendorCard(slug, marketId);
            }
          });
        } else {
          el.href = vendorUrl;
          el.target = '_blank';
          el.rel = 'noopener noreferrer';
          el.title = `Open ${display} website (new tab)`;
          // Primary click opens homepage in a new tab; do not preventDefault.
        }
        row.appendChild(el);
      });
    }

    addPills(commRow, commEntries);
    addPills(ossRow, ossEntries);

    // Adjust positions dynamically based on actual nav height
    syncTopChrome();

    // IntersectionObserver to track active vendor card
    if (_snavObs) _snavObs.disconnect();
    _snavObs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const name = e.target.dataset.vendor;
          const market = e.target.dataset.market || '';
          document.querySelectorAll('.snav-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll(`.snav-btn[data-vendor="${CSS.escape(name)}"]`).forEach(b => {
            if (!market || (b.dataset.market || '') === market) b.classList.add('active');
          });
        }
      });
    }, { threshold: 0.3 });
    document.querySelectorAll('.vendor-card').forEach(c => _snavObs.observe(c));
  }

  // ── #8 insertVendorFilterBar (top chrome — report-wide) ─────────────────────
  function insertVendorFilterBar() {
    const bar = document.getElementById('vendorFilterBar');
    if (!bar) return;

    const challengerCount = (typeof CHALLENGER_LABELS !== 'undefined' && CHALLENGER_LABELS)
      ? CHALLENGER_LABELS.size : 0;
    const challengerDisabled = !challengerCount;
    const challengerClass = challengerDisabled ? 'vfbtn is-empty' : 'vfbtn';
    const challengerExtra = challengerDisabled
      ? ' disabled title="No Challengers in current market chart data"'
      : '';

    bar.innerHTML =
      `<span class="vf-label">Filter</span>` +
      `<button class="vfbtn active" type="button" data-filter="all">All Vendors</button>` +
      `<button class="vfbtn" type="button" data-filter="commercial">Commercial</button>` +
      `<button class="vfbtn" type="button" data-filter="oss">OSS</button>` +
      `<button class="vfbtn" type="button" data-filter="leader">Leaders</button>` +
      `<button class="${challengerClass}" type="button" data-filter="challenger"${challengerExtra}>Challengers</button>`;

    bar.querySelectorAll('.vfbtn').forEach(btn => {
      btn.addEventListener('click', () => {

        bar.querySelectorAll('.vfbtn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        _applyVendorFilter(btn.dataset.filter);
      });
    });

    const active = bar.querySelector('.vfbtn.active');
    _applyVendorFilter(active ? active.dataset.filter : 'all');
    syncTopChrome();
  }

  function annotateCriticalFillGaps() {
    const existing = document.getElementById('matrixFillGapBanner');
    if (existing) existing.remove();
    const report = window.__SB_REPORT__;
    const rows = report && report.comparison && Array.isArray(report.comparison.rows)
      ? report.comparison.rows : [];
    const gaps = [];
    for (const row of rows) {
      if (!row || row.type !== 'feature' || row.priority !== 'Critical') continue;
      const sols = row.solutions || {};
      const keys = Object.keys(sols);
      if (!keys.length) continue;
      const filled = keys.filter(k => String(sols[k] || '').trim()).length;
      if (filled === 0) {
        gaps.push(`${row.name} (0/${keys.length})`);
      }
    }
    if (!gaps.length) return;
    const banner = document.createElement('div');
    banner.id = 'matrixFillGapBanner';
    banner.className = 'matrix-fill-gap';
    banner.setAttribute('role', 'note');
    banner.innerHTML =
      `<strong>Critical matrix gaps (missing research evidence):</strong> ` +
      `${gaps.join('; ')}. Empty cells render as — and must not be read as feature support.`;
    const content = document.getElementById('content');
    if (content && content.firstChild) {
      content.insertBefore(banner, content.firstChild);
    } else if (content) {
      content.appendChild(banner);
    }
  }

  function _setScatterPointVisibility(chart, filter) {
    if (!chart || !chart.data || !chart.data.datasets) return;
    chart.data.datasets.forEach((ds, dsIdx) => {
      const meta = chart.getDatasetMeta(dsIdx);
      const key = chart.canvas.id + '_' + dsIdx;
      if (!_origChartColors.has(key)) {
        _origChartColors.set(key, { bg: ds.backgroundColor, border: ds.borderColor });
      }
      const orig = _origChartColors.get(key);
      const labels = ds.data.map(pt => pt.label || ds.label);
      const matches = labels.map(l => _vendorMatchesFilter(l, filter));
      const bgArr = Array.isArray(orig.bg) ? orig.bg : labels.map(() => orig.bg);
      const bdArr = Array.isArray(orig.border) ? orig.border : labels.map(() => orig.border);
      ds.backgroundColor = labels.map((l, i) => matches[i] ? bgArr[i] : (String(bgArr[i] || '#94a3b8').slice(0, 7) + '22'));
      ds.borderColor = labels.map((l, i) => matches[i] ? bdArr[i] : (String(bdArr[i] || '#94a3b8').slice(0, 7) + '22'));
      if (meta.data) {
        meta.data.forEach((el, i) => { if (el) el.hidden = !matches[i]; });
      }
      if (chart._labelLayout) {
        chart._labelLayout.forEach(L => {
          if (L.text) L.visible = _vendorMatchesFilter(L.text, filter);
        });
      }
    });
    chart.update('none');
  }

  function _applyVendorFilter(filter) {
    window._currentVendorFilter = filter;

    document.querySelectorAll('.vendor-card').forEach(card => {
      const raw = card.dataset.vendor || '';
      const display = _normalizeVendorLabel(raw);
      const show = _vendorMatchesFilter(display, filter) || _vendorMatchesFilter(raw, filter);
      card.classList.toggle('is-filtered-out', !show);
    });

    document.querySelectorAll('.snav-btn').forEach(btn => {
      const raw = btn.dataset.vendor || btn.textContent || '';
      const display = _normalizeVendorLabel(raw);
      const show = _vendorMatchesFilter(display, filter) || _vendorMatchesFilter(raw, filter);
      btn.classList.toggle('is-filtered-out', !show);
    });

    _setScatterPointVisibility(window._mqChart, filter);
    _setScatterPointVisibility(window._gmqChart, filter);
    _setScatterPointVisibility(window._waveChart, filter);

    if (window._vcChart) {
      const chart = window._vcChart;
      chart.data.datasets.forEach((ds, dsIdx) => {
        const key = chart.canvas.id + '_' + dsIdx;
        if (!_origChartColors.has(key)) {
          _origChartColors.set(key, { bg: ds.backgroundColor, border: ds.borderColor });
        }
        const orig = _origChartColors.get(key);
        const match = _vendorMatchesFilter(ds.label, filter);
        const meta = chart.getDatasetMeta(dsIdx);
        meta.hidden = !match;
        if (!match) {
          ds.borderColor = typeof orig.border === 'string' ? orig.border.slice(0, 7) + '22' : 'rgba(200,200,200,0.15)';
        } else {
          ds.borderColor = orig.border;
        }
      });
      if (chart._labelLayout) {
        chart._labelLayout.forEach(L => {
          if (L.text) L.visible = _vendorMatchesFilter(L.text, filter);
        });
      }
      chart.update('none');
    }
  }

      h2.classList.add('source-reliability-section');

  // ── #7 wrapVendorNameLinks + comparison drawer ────────────────────────────────
  function wrapVendorNameLinks() {
    const roots = [
      document.getElementById('content'),
      document.getElementById('matrixPanelBody'),
      document.getElementById('solutionNav'),
      document.getElementById('compareResultsBody'),
    ].filter(Boolean);
    if (!roots.length) return;

    const names = [...ALL_VENDORS].sort((a, b) => b.length - a.length);
    for (const content of roots) {
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        let el = node.parentElement;
        while (el && el !== content) {
          if (['A','CODE','PRE','SCRIPT','STYLE','H1','H2','H3'].includes(el.tagName))
            return NodeFilter.FILTER_REJECT;
          if (el.classList && el.classList.contains('vname-link'))
            return NodeFilter.FILTER_REJECT;
          el = el.parentElement;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });

    const nodes = [];
    let nd;
    while ((nd = walker.nextNode())) nodes.push(nd);

    for (const tn of nodes) {
      let result = tn.textContent;
      let replaced = false;
      for (const name of names) {
        if (!_isLinkableVendorName(name)) continue;
        const url = _vendorUrl(name);
        if (!url) continue;
        const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(`\\b${escaped}\\b`, 'g');
        if (re.test(result)) {
          result = result.replace(
            new RegExp(`\\b${escaped}\\b`, 'g'),
            `<a class="vname-link" href="${url}" target="_blank" rel="noopener noreferrer">${name}</a>`
          );
          replaced = true;
        }
      }
      if (replaced) {
        const sp = document.createElement('span');
        sp.innerHTML = result;
        tn.parentNode.replaceChild(sp, tn);
      }
    }
    }
  }

  function _showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => {
      t.classList.add('fade');
      setTimeout(() => t.remove(), 600);
    }, 2000);
  }

  function _syncCompareUi(vendor) {
    const selected = _compareSet.has(vendor);
    document.querySelectorAll(`.vc-compare-cb[data-vendor="${CSS.escape(vendor)}"]`)
      .forEach(el => { el.checked = selected; });
    document.querySelectorAll(`.vendor-card`).forEach(card => {
      const raw = card.dataset.vendor || '';
      const display = _normalizeVendorLabel(raw);
      if (display === vendor || raw === vendor) {
        card.classList.toggle('is-compare-selected', selected);
      }
    });
  }

  function _toggleCompare(vendor) {
    if (!vendor) return;
    if (_compareSet.has(vendor)) {
      _compareSet.delete(vendor);
    } else {
      if (_compareSet.size >= COMPARE_MAX) {
        _showToast(`Max ${COMPARE_MAX} vendors for comparison`);
        return;
      }
      _compareSet.add(vendor);
    }
    _syncCompareUi(vendor);
    _updateCompareBadge();
    _renderCompareTable();
  }

  function _updateCompareBadge() {
    const badge = document.getElementById('compareBadge');
    if (!badge) return;
    if (_compareSet.size > 0) {
      badge.textContent = _compareSet.size;
      badge.style.display = 'inline-flex';
    } else {
      badge.style.display = 'none';
    }
  }

  function _renderCompareTable() {
    _ensureCompareSection();
    const body = document.getElementById('compareResultsBody');
    const drawer = document.getElementById('compareTableWrap');
    if (!body) return;

    if (_compareSet.size < 2) {
      body.innerHTML = '<p class="compare-empty">Select at least 2 solutions using the checkboxes on vendor cards to compare them here.</p>';
      if (drawer) {
        drawer.textContent = _compareSet.size === 1
          ? '1 selected — pick one more to compare.'
          : 'Select solutions on vendor cards (max ' + COMPARE_MAX + ').';
      }
      return;
    }

    const vendors = [..._compareSet];
    const slugs = vendors.map(v => _resolveVendorSlug(v));
    const cmp = (window.__SB_REPORT__ && window.__SB_REPORT__.comparison) || {};
    const rows = (cmp.rows || []).filter(r => r && r.type === 'feature');
    const scoreCells = slugs.map(s => {
      const score = _formatCompareScore(s);
      return `<td style="padding:6px 8px;border:1px solid var(--sb-border);text-align:center;font-weight:500;background:var(--sb-accent-soft);">${score}</td>`;
    }).join('');
    const scoreRow = `<tr class="cmp-score-row"><td style="padding:6px 8px;border:1px solid var(--sb-border);font-weight:500;">Weighted score</td>` +
      (rows.length ? `<td style="padding:6px 8px;border:1px solid var(--sb-border);text-align:center;">—</td>` : '') +
      `${scoreCells}</tr>`;

    const removeLinks = vendors.map(v =>
      `<span class="cmp-remove" data-vendor="${v.replace(/"/g, '&quot;')}">${lucideIconHtml('x', 'lucide-icon')} ${v}</span>`
    ).join('');

    let tableHtml = '';
    if (rows.length) {
      const headerCols = vendors.map(v => {
        const score = _formatCompareScore(v);
        return `<th style="padding:6px 8px;background:var(--sb-surface-muted);border:1px solid var(--sb-border);text-align:center;">${v}<span class="cmp-col-score">Score ${score}</span></th>`;
      }).join('');
      const bodyRows = rows.map(row => {
        const cells = slugs.map(slug => {
          const val = ((row.solutions || {})[slug] || '').trim() || '—';
          const tick = val === '✔' || val === '✓';
          return `<td style="padding:6px 8px;border:1px solid var(--sb-border);text-align:center;${tick ? 'font-weight:500;' : ''}">${val}</td>`;
        }).join('');
        return `<tr><td style="padding:6px 8px;border:1px solid var(--sb-border);font-weight:500;">${row.name || ''}</td>` +
          `<td style="padding:6px 8px;border:1px solid var(--sb-border);text-align:center;">${row.priority || '—'}</td>${cells}</tr>`;
      }).join('');
      tableHtml =
        `<div class="table-scroll-wrap"><table style="width:100%;border-collapse:collapse;">` +
        `<thead><tr><th style="text-align:left;padding:6px 8px;background:var(--sb-surface-muted);border:1px solid var(--sb-border);">Feature</th>` +
        `<th style="text-align:left;padding:6px 8px;background:var(--sb-surface-muted);border:1px solid var(--sb-border);">Priority</th>${headerCols}</tr></thead>` +
        `<tbody>${scoreRow}${bodyRows}</tbody></table></div>`;
    } else {
      const allVc = [...VC_COMMERCIAL, ...VC_OSS];
      const lookup = {};
      allVc.forEach(v => { lookup[v.label] = v.data; });
      VC_OSS.forEach(v => { lookup[v.label.replace(' (OSS)','')] = v.data; });
      const headerCols = vendors.map(v => {
        const score = _formatCompareScore(v);
        return `<th style="padding:6px 8px;background:var(--sb-surface-muted);border:1px solid var(--sb-border);text-align:center;">${v}<span class="cmp-col-score">Score ${score}</span></th>`;
      }).join('');
      const bodyRows = VC_KCFS.map((kcf, i) => {
        const cells = vendors.map(v => {
          const data = lookup[v];
          const score = data ? data[i] : null;
          const bg = score !== null ? (SCORE_BG[score] || 'var(--sb-surface-muted)') : 'var(--sb-surface-muted)';
          return `<td style="padding:6px 8px;border:1px solid var(--sb-border);text-align:center;background:${bg};">${score !== null ? score : '—'}</td>`;
        }).join('');
        return `<tr><td style="padding:6px 8px;border:1px solid var(--sb-border);font-weight:500;">${kcf}</td>${cells}</tr>`;
      }).join('');
      tableHtml =
        `<div class="table-scroll-wrap"><table style="width:100%;border-collapse:collapse;">` +
        `<thead><tr><th style="text-align:left;padding:6px 8px;background:var(--sb-surface-muted);border:1px solid var(--sb-border);">KCF</th>${headerCols}</tr></thead>` +
        `<tbody>${scoreRow}${bodyRows}</tbody></table></div>`;
    }

    body.innerHTML = `<div style="margin-bottom:10px;">${removeLinks}</div>${tableHtml}`;
    body.querySelectorAll('.cmp-remove').forEach(el => {
      el.addEventListener('click', () => _toggleCompare(el.dataset.vendor));
    });
    refreshLucideIcons(body);

    if (drawer) {
      drawer.textContent = vendors.length + ' selected — scroll to comparison below or use Compare.';
    }
  }

  function _comparisonRankingsMap() {
    const cmp = (window.__SB_REPORT__ && window.__SB_REPORT__.comparison) || {};
    const map = new Map();
    (cmp.rankings || []).forEach(r => {
      if (!r || !r.solution) return;
      const score = r.score != null ? r.score : (r.total_score != null ? r.total_score : null);
      map.set(r.solution, { score, rank: r.rank, solution: r.solution });
    });
    return map;
  }

  function _formatCompareScore(vendorOrSlug) {
    const slug = _resolveVendorSlug(vendorOrSlug);
    const map = _comparisonRankingsMap();
    const hit = map.get(slug) || map.get(vendorOrSlug);
    if (hit && hit.score != null) return String(hit.score);
    return '—';
  }

  function _compareQuadrantVendors(labels) {
    const unique = [...new Set((labels || []).filter(Boolean))];
    if (unique.length < 2) {
      _showToast(unique.length === 0
        ? 'No solutions in this quadrant'
        : 'Need at least 2 solutions in this quadrant to compare');
      return;
    }
    let added = 0;
    for (const v of unique) {
      if (_compareSet.size >= COMPARE_MAX) {
        if (!added) _showToast(`Max ${COMPARE_MAX} vendors for comparison`);
        break;
      }
      if (!_compareSet.has(v)) {
        _compareSet.add(v);
        _syncCompareUi(v);
        added++;
      }
    }
    _updateCompareBadge();
    _renderCompareTable();
    _scrollToCompareSection();
    const drawer = document.getElementById('compareDrawer');
    if (drawer && _compareSet.size >= 2) drawer.classList.add('open');
  }

  function _attachQuadrantCompareLayer(chart, config) {
    if (!chart || !chart.canvas || !config) return;
    const wrap = chart.canvas.closest('.chart-canvas-wrap');
    if (!wrap || wrap.dataset.quadrantCompareWired) return;
    wrap.dataset.quadrantCompareWired = '1';

    const layer = document.createElement('div');
    layer.className = 'quadrant-compare-layer';
    layer.setAttribute('aria-hidden', 'true');
    const btnWrap = document.createElement('div');
    btnWrap.className = 'quadrant-compare-btn-wrap';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'quadrant-compare-btn';
    btn.textContent = 'Compare';
    btn.setAttribute('aria-label', 'Compare solutions in quadrant');
    btnWrap.appendChild(btn);
    layer.appendChild(btnWrap);
    wrap.appendChild(layer);

    let activeRegion = null;
    let pointerOnBtn = false;

    function regionsForChart() {
      const ca = chart.chartArea;
      if (!ca || !ca.width) return [];
      const mx = ca.left + ca.width * 0.5;
      const my = ca.top + ca.height * 0.5;
      return (config.getRegions(mx, my, ca.left, ca.right, ca.top, ca.bottom) || [])
        .map(r => ({ ...r, key: r.key || String(r.label || '').replace(/\b\w/g, c => c.toUpperCase()) }));
    }

    function vendorsForRegion(region) {
      if (!region) return [];
      if (typeof config.getVendors === 'function') return config.getVendors(region);
      return (config.getChartData() || []).filter(d => d && d.q === region.key).map(d => d.label).filter(Boolean);
    }

    function positionBtn(region) {
      const canvas = chart.canvas;
      const pad = 6;
      const btnW = btn.offsetWidth || 68;
      const btnH = btn.offsetHeight || 22;
      btnWrap.style.left = Math.max(0, canvas.offsetLeft + region.x2 - btnW - pad) + 'px';
      btnWrap.style.top = Math.max(0, canvas.offsetTop + region.y2 - btnH - pad) + 'px';
    }

    function showRegion(region) {
      activeRegion = region;
      const vendors = vendorsForRegion(region);
      btn.disabled = vendors.length < 2;
      btn.title = vendors.length < 2
        ? `Need 2+ solutions (${vendors.length} here)`
        : `Compare ${vendors.length} solutions in ${region.key || region.label}`;
      positionBtn(region);
      btnWrap.classList.add('is-visible');
      layer.setAttribute('aria-hidden', 'false');
    }

    function hideRegion() {
      if (pointerOnBtn || btnWrap.matches(':focus-within')) return;
      activeRegion = null;
      btnWrap.classList.remove('is-visible');
      layer.setAttribute('aria-hidden', 'true');
    }

    function onPointerMove(nativeEvent) {
      const pos = _chartPointerPos(chart, nativeEvent);
      const ca = chart.chartArea;
      if (!ca || pos.x < ca.left || pos.x > ca.right || pos.y < ca.top || pos.y > ca.bottom) {
        hideRegion();
        return;
      }
      let hit = null;
      if (typeof config.hitTest === 'function') {
        hit = config.hitTest(chart, pos.x, pos.y);
      } else {
        hit = _hitTestQuadrantRegions(regionsForChart(), pos.x, pos.y);
      }
      if (hit) showRegion(hit);
      else hideRegion();
    }

    btn.addEventListener('mouseenter', () => { pointerOnBtn = true; });
    btn.addEventListener('mouseleave', () => { pointerOnBtn = false; });
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!activeRegion || btn.disabled) {
        _showToast('Need at least 2 solutions in this quadrant to compare');
        return;
      }
      _compareQuadrantVendors(vendorsForRegion(activeRegion));
    });

    chart.canvas.addEventListener('mousemove', onPointerMove);
    chart.canvas.addEventListener('mouseleave', hideRegion);
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => { if (activeRegion) positionBtn(activeRegion); }).observe(wrap);
    }
  }

  function setupQuadrantCompareOverlays() {
    if (window._mqChart) {
      _attachQuadrantCompareLayer(window._mqChart, {
        getChartData: () => MQ_DATA,
        getRegions: mqQuadrantRegions,
      });
    }
    if (window._gmqChart) {
      _attachQuadrantCompareLayer(window._gmqChart, {
        getChartData: () => GMQ_DATA,
        getRegions: GMQ_QUADRANT_REGIONS,
      });
    }
    if (window._waveChart) {
      const waveChart = window._waveChart;
      _attachQuadrantCompareLayer(waveChart, {
        getChartData: () => WAVE_DATA,
        hitTest: (chart, x, y) => _waveZoneAtPoint(chart, x, y),
        getVendors: (region) => WAVE_DATA.filter(d => _waveZoneForVendor(waveChart, d) === region.key).map(d => d.label).filter(Boolean),
        getRegions: (mx, my, left, right, top, bottom) => [
          { key: 'Contenders', x1: left, y1: bottom - (bottom - top) * 0.35, x2: left + (right - left) * 0.35, y2: bottom, label: 'CONTENDERS' },
          { key: 'Strong Performers', x1: left, y1: top, x2: right, y2: bottom, label: 'STRONG PERFORMERS' },
          { key: 'Leaders', x1: left + (right - left) * 0.45, y1: top, x2: right, y2: top + (bottom - top) * 0.55, label: 'LEADERS' },
        ],
      });
    }
  }

  // ── #11 setupChartObserver ───────────────────────────────────────────────────
  function setupChartObserver() {
    if (_chartObs) _chartObs.disconnect();
    _chartObs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('in-view');
          _chartObs.unobserve(e.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -5% 0px' });
    document.querySelectorAll('.chart-frame').forEach(el => _chartObs.observe(el));
  }

  // ── #12 setupBreadcrumbObserver (scroll-based for reliability) ──────────────
  let _bcScrollHandler = null;
  function setupBreadcrumbObserver() {
    // Remove previous handler if exists
    if (_bcScrollHandler) {
      window.removeEventListener('scroll', _bcScrollHandler, true);
      window.removeEventListener('scrolltick', _bcScrollHandler);
    }

    // Collect all visible H2/H3 from content
    const headings = Array.from(document.querySelectorAll('#content h2, #content h3'))
      .filter(h => h.offsetParent !== null); // only visible ones

    _bcScrollHandler = function() {
      const navH = document.getElementById('solutionNav')?.offsetHeight || 125;
      const threshold = navH + 40;
      let curH2 = '', curH3 = '';
      for (const h of headings) {
        const top = h.getBoundingClientRect().top;
        if (top > threshold) break;
        if (h.tagName === 'H2') {
          curH2 = h.textContent.replace(/^[▸▾]\s*/, '').trim();
          curH3 = '';
        } else if (h.tagName === 'H3') {
          curH3 = h.textContent.replace(/^[▸▾]\s*/, '').trim();
        }
      }
      if (_bcSection) _bcSection.textContent = curH2;
      if (_bcSub)     _bcSub.textContent = curH3;
      if (_bcSep)     _bcSep.style.display = curH3 ? 'inline' : 'none';
    };
    window.addEventListener('scroll', _bcScrollHandler, { passive: true });
    window.addEventListener('scrolltick', _bcScrollHandler); // fallback for sandboxed envs
    // Fire once immediately
    _bcScrollHandler();
  }

})();
</script>
