, "silver-bullet", "turboshovel", "workflow-manager"], "adjacent": ["agenthub", "axonflow", "cavekit-v4", "crewai", "langchain", "langgraph"], "listed": ["agenthub", "agentsys", "ai-dlc", "axonflow", "cavekit-v4", "crewai", "deepwork", "director", "langchain", "langgraph", "metagpt", "silver-bullet", "turboshovel", "workflow-manager"], "unplotted": [{"slug": "agenthub", "reason": "adjacent competitor — listed for the market, not MQ/Wave core"}, {"slug": "axonflow", "reason": "adjacent competitor — listed for the market, not MQ/Wave core"}, {"slug": "cavekit-v4", "reason": "adjacent competitor — listed for the market, not MQ/Wave core"}, {"slug": "crewai", "reason": "adjacent competitor — listed for the market, not MQ/Wave core"}, {"slug": "langchain", "reason": "adjacent competitor — listed for the market, not MQ/Wave core"}, {"slug": "langgraph", "reason": "adjacent competitor — listed for the market, not MQ/Wave core"}]}, "plotted_slugs": ["agentsys", "ai-dlc", "deepwork", "director", "metagpt", "silver-bullet", "turboshovel", "workflow-manager"], "listed_slugs": ["agenthub", "agentsys", "ai-dlc", "axonflow", "cavekit-v4", "crewai", "deepwork", "director", "langchain", "langgraph", "metagpt", "silver-bullet", "turboshovel", "workflow-manager"], "unplotted": [{"slug": "agenthub", "reason": "adjacent competitor — listed for the market, not MQ/Wave core"}, {"slug": "axonflow", "reason": "adjacent competitor — listed for the market, not MQ/Wave core"}, {"slug": "cavekit-v4", "reason": "adjacent competitor — listed for the market, not MQ/Wave core"}, {"slug": "crewai", "reason": "adjacent competitor — listed for the market, not MQ/Wave core"}, {"slug": "langchain", "reason": "adjacent competitor — listed for the market, not MQ/Wave core"}, {"slug": "langgraph", "reason": "adjacent competitor — listed for the market, not MQ/Wave core"}], "chart_notes": ["Methodology/framework seeds without shipped hook gates (for example AI-DLC) are omitted from Wave and are not peer-complete on MQ: Completeness of Vision is capped so they do not plot as shipped-orchestrator peers; Ability to Execute is capped below Leaders.", "Demoted from Leaders for missing gates and/or cross-session state: agentsys, ai-dlc, deepwork, director, metagpt, turboshovel, workflow-manager."]}, "markdown": "# Agentic SDLC Process Orchestrators Market Landscape Report\n\n*Analyst-grade landscape analysis for SMB decision-makers*\n\nKnowledge basis: Synthesised from multiple AI platform responses (claude-opus-4.8-medium, gemini-3.5-flash, gpt-5.6-luna-medium, ocg-deepseek-v4-flash, ocg-kimi-k2.7-code, ocg-mimo-v2.5, ocg-minimax-m3, ocg-qwen3.7-plus)\nAugust 14, 2026\n\n## Executive Summary\n\nOne-page briefing for SMB buyers. Charts and vendor cards follow; this page does not restate coordinate formulas.\n\n### Market overview\n\nAgentic SDLC orchestration sits **one level above coding agents**: process catalogs, gates, and specialist routing rather than raw codegen. Three markets are scored separately — **Agentic Process Orchestrators (APO)** (primary), **SDLC plugins & methodology packs** (secondary), and **agentic SDLC SaaS / autonomous delivery** (tertiary). The category is early mainstream: executor-first hosts are ahead of fail-closed process layers. OSS packs dominate experimentation; commercial SaaS leads managed execution.\n\n### Key findings\n\n- Buyers should shortlist **by market**, not from a single blended ranking.\n- Hook-enforced gates plus durable cross-session state remain the scarce combination; most methodology packs are skippable prompt/persona layers.\n- Thin-evidence APO commercials (Deepwork, Turboshovel, Workflow Manager) stay on the chart as cores but are not a procurement shortlist on ticks alone.\n- Magic.dev is hard-excluded (coding-model lab). Conductor is an aggregator, not APO. This report does not call any vendor 'most complete'.\n- [Zuvo](https://zuvo.dev/) is an sdlc-plugins **core** with public evidence (site → MIT GitHub). It is scored and placed with the other plugin cores; it is not a coverage gap.\n\n### Leader shortlist (per market)\n\n- **APO (primary):** [Silver Bullet](https://sb.alolabs.dev/)\n- **SDLC plugins & methodology packs:** [Silver Bullet](https://sb.alolabs.dev/) — feature-gate (hooks **and** ledger cross-session), not a 'most complete product' claim\n- **Agentic SDLC SaaS:** Devin, [Factory.ai](https://www.factory.ai/), Augment Cosmos\n\nLeader plots are MQ top-right in this run. Plugin MQ Leaders = Silver Bullet only because only Silver Bullet passed hook-enforced gates AND inclusion-ledger cross-session in this run. That is not a mandate to buy one vendor across every profile.\n\n### Buyer guidance\n\n- **Spec-first / lean packs:** equal-standing OSS peers including [Zuvo](https://zuvo.dev/), [Barkain Workflow Orchestrator](https://github.com/barkain/claude-code-workflow-orchestration), [BMAD-METHOD](https://github.com/bmad-code-org/BMAD-METHOD), [Cavekit v3.1](https://github.com/JuliusBrussee/cavekit), [cc10x](https://github.com/romiluz13/cc10x), Claude Harness — pick on spec vs persona vs swarm topology.\n- **OSS APO cores:** equal-standing peers ([AgentSys](https://github.com/agent-sh/agentsys), [AI-DLC](https://github.com/awslabs/aidlc-workflows), Deepwork, Director, [MetaGPT](https://github.com/FoundationAgents/MetaGPT)); [AI-DLC](https://github.com/awslabs/aidlc-workflows) is AWS/awslabs methodology vocabulary without shipped hook gates (Visionaries, not Wave) — not IBM.\n- **Managed autonomous delivery:** Augment Cosmos, Devin, [Factory.ai](https://www.factory.ai/) — this profile does not resolve to an OSS process pack. Magic.dev is not a SaaS-core substitute.\n- **Host-runtime path:** [Cursor](https://cursor.com/) / [Claude Code](https://docs.anthropic.com/en/docs/claude-code/overview) / [Codex](https://openai.com/codex/) **plus a pack**. The host is not the orchestrator.\n\n## 1. Problem\n\nCoding agents execute work; they do not by themselves **enforce** an SDLC. Buyers need a process layer so planning, verification, review, and release cannot be skipped when agents run in parallel or across sessions.\n\n**Primary jobs-to-be-done**\n\n1. Enforce a full SDLC or DevOps cycle so agents cannot skip planning, verification, review, or release steps\n2. Compose specialist agents and external workflows (GSD, spec kits, review ladders) under one compliance layer\n3. Persist process state, gates, and evidence across sessions and parallel workers\n4. Provide procurement-ready comparison of process-orchestration depth vs host runtimes and frameworks\n\n## 2. Market\n\n### Market Definition & Scope\n\n**Landscape scope**\n\nAgentic SDLC orchestration solutions operating **one level above coding agents** — end-to-end, process-driven, workflow-based agentic layers for software engineering and DevOps (SecOps-adjacent). Excludes raw LLM APIs and single-shot copilots.\n\nResearch topic: `Agentic SDLC orchestration landscape multimarket final — APO primary, SDLC plugins secondary (BMAD GSD [Superpowers](https://github.com/obra/superpowers) Spec Kit Oh My [Zuvo](https://zuvo.dev/) OSS), agentic SDLC SaaS tertiary (Factory Devin Augment Cosmos)`\n\n**Out of scope (excluded from core peer set)**\n\n- Generic **coding agents** and IDE copilots (Cursor Background Agents, Cline, Aider, Continue, OpenHands, SWE-agent)\n- **Host runtimes** that execute code without a process catalog ([Cursor](https://cursor.com/), Copilot, [Claude Code](https://docs.anthropic.com/en/docs/claude-code/overview), [Codex](https://openai.com/codex/) as hosts — listed under Adjacent). Devin is agentic-sdlc-saas core, not a host-runtime adjacent.\n- **Single-step** tools (PR review bots, PM integrations such as Linear)\n- **Generic agent frameworks** without SDLC process packaging (LangGraph, [CrewAI](https://github.com/crewAIInc/crewAI) as adjacent)\n- **Sunset** products (GitHub Copilot Workspace, AutoGen, AgentGPT, Devika)\n\n### Market Overview\n\nAs of July 2026, the category is **early mainstream**: buyers separate agent hosts from process layers, but few vendors combine machine-readable catalogs with hook-enforced gates.\nVerify latest data — market size estimates for agentic SDLC orchestration are not web-verified in this synthesis; growth is driven by multi-agent adoption and verification-gate demand.\n\n- **Maturity**: Early mainstream; executor-first agents are ahead of process catalogs.\n- **Commercial vs OSS**: OSS frameworks dominate experimentation; commercial players lead managed execution.\n- **SMB vs enterprise**: SMBs favour templates, predictable pricing, and managed hosting; enterprises prioritise audit, SSO, and residency.\n- **Deployment**: SaaS agents, IDE plugins, and self-hosted OSS graphs coexist; switching costs rise with hook and catalog lock-in.\n\n### Key Industry Trends\n\n#### Process-first orchestration above coding agents\n- **What**: Buyers increasingly separate the agent host (IDE, cloud sandbox) from the SDLC process layer that composes workflows, enforces gates, and records skills.\n- **SMB impact**: SMBs without platform teams need opinionated process packs rather than bespoke agent graphs.\n- **Vendor response**: [Silver Bullet](https://sb.alolabs.dev/), [Factory.ai](https://www.factory.ai/), and GitHub Copilot Workspace market explicit SDLC chains; [Cursor](https://cursor.com/) and Devin remain executor-first.\n\n#### Hook-enforced lifecycle gates\n- **What**: Host hooks that fail closed on skill recording, planning ownership, and delivery gates are emerging as trust rails for autonomous work.\n- **SMB impact**: Reduces rework risk when junior teams delegate multi-step agent runs.\n- **Vendor response**: [Silver Bullet](https://sb.alolabs.dev/) and [Cursor](https://cursor.com/) document hook layers; most git-native agents lack cross-host gate parity.\n\n#### Machine-readable workflow catalogs\n- **What**: Atomic flow catalogs (workflows, steps, V-loops) enable composition, audit, and CI freshness checks beyond ad-hoc prompts.\n- **SMB impact**: Lets lean teams adopt SDLC patterns without writing orchestration code.\n- **Vendor response**: [Silver Bullet](https://sb.alolabs.dev/) ships `apo-catalog.json`; spec-kit and GSD offer lighter-weight spec packs.\n\n#### Git-native issue→PR agent loops\n- **What**: Issue trackers and repos become control planes for multi-step agent work with human review on PRs.\n- **SMB impact**: Fits teams already on GitHub; lowers integration tax versus custom runtimes.\n- **Vendor response**: GitHub Copilot Workspace, Sweep, and [Tembo](https://tembo.io/) target this pattern.\n\n#### Autonomous software engineers (plan→ship)\n- **What**: Managed agents that plan, implement, test, and open PRs in customer repos are maturing for enterprise pilots.\n- **SMB impact**: High capability but opaque process; pricing and governance remain enterprise-weighted.\n- **Vendor response**: Devin and [Factory.ai](https://www.factory.ai/) Droids compete here; Magic.dev is a coding-model lab, not a scored SaaS-core peer.\n\n#### BYO agent runtimes and graph orchestration\n- **What**: Frameworks expose durable graphs, interrupts, and delegation primitives for custom orchestration.\n- **SMB impact**: Maximum flexibility at the cost of in-house agent ops expertise.\n- **Vendor response**: [LangGraph Platform](https://www.langchain.com/langgraph), [CrewAI](https://github.com/crewAIInc/crewAI), and AutoGen anchor this segment; [MetaGPT](https://github.com/FoundationAgents/MetaGPT) is scored as APO OSS core, not a generic framework adjacent.\n\n#### Spec-driven and context-engineering workflows\n- **What**: Lightweight methodology packs emphasize intent specs, critique loops, and context hygiene before code.\n- **SMB impact**: Low-cost entry for teams not ready for full orchestration platforms.\n- **Vendor response**: GitHub spec-kit, GSD, and [BMAD-METHOD](https://github.com/bmad-code-org/BMAD-METHOD) are representative.\n\n#### Multi-model pools and triangulated research\n- **What**: This research pass triangulates multiple model families with explicit divergence tracking. That is a report method — not a product feature vendors were scored on.\n- **SMB impact**: Use triangulation to interrogate marketing claims; do not treat it as a matrix tick.\n- **Vendor response**: Not a scored MQ/Wave/matrix axis in this engine; see scoring methodology.\n\n## 3. Framework\n\n### Inclusion criteria\n\nA vendor belongs in the **core peer set** when it clearly demonstrates at least **3 of 7** capabilities below (not advisory-only claims):\n\n- **Multi-phase lifecycle span** — Covers two or more of plan/spec, build, test, review, release, or DevOps operations as an integrated process — not a single-shot codegen or review-only tool.\n- **Plugin / skill / hook packaging** — Ships as host-integrated packaging (Claude/[Codex](https://openai.com/codex/)/[Cursor](https://cursor.com/) plugin, skill bundle, hook layer, or equivalent) rather than a standalone IDE or raw API.\n- **Deterministic quality gates** — Uses machine-checkable gates (hooks, audits, stop-checks, CI integration) that block progression when criteria fail.\n- **Cross-session state** — Persists workflow state, memory, or runbooks across agent clears, sessions, or parallel workers.\n- **Specialist agent orchestration** — Routes work to named specialist agents, hats, or role-specific subagents — not a single monolithic agent.\n- **Quality / release enforcement claim** — Publicly claims enforcement of quality, compliance, release, or governance — not advisory-only suggestions.\n- **Process layer above host runtime** — Positions as a meta-orchestrator or compliance wrapper above [Claude Code](https://docs.anthropic.com/en/docs/claude-code/overview), [Codex](https://openai.com/codex/), [Cursor](https://cursor.com/), or similar — not as the host runtime itself.\n\n### Scoring methodology\n\nCharts answer **which evidenced capabilities a vendor has**, not a 100-point brand score and not a 'most complete product' ranking. Every plotted number is reproducible from the comparison matrix in this report ([comparison.json](../comparison/comparison.json)). `solutions/\u003cslug>/features.json` is the machine copy of those same ticks — not a hidden feature set.\n\n**1. Comparison-matrix ranking (buyer: weighted capability depth).** Each matrix row has a priority. A ✔ adds that row's points; an empty cell adds 0. This is the MultAI comparator, **not** a TopGun 55/20/15/10 blend:\n\n- Critical = **5** · Very High = **4** · High = **3** · Medium = **2** · Low = **1**\n- Ranking score = sum of (priority points × 1 if ticked). Stored as `comparison.rankings[].score`.\n\n**2. Chart coordinates (buyer: process depth vs execute depth).** Each axis uses a short feature list (the buyer-priority capabilities for that market), not the full matrix. For each axis:\n\n1. **Floor** — where a vendor with zero axis ticks still sits so they remain visible.\n2. **Tick points** — each evidenced axis feature adds a fixed number of chart points (points-per-tick). That is the weight: how much one capability moves the plot.\n3. **Ranking remainder** — `ranking_score ÷ spread`. Spread is **how many ranking points equal 1.0 chart unit**, so two vendors with the same axis ticks still separate slightly by overall matrix depth. Example: spread 15 means a 15-point ranking gap moves that axis by 1.0.\n4. **Caps** — Leader eligibility and methodology-without-gates can lower an axis; they never invent ticks.\n5. **Collision slotting** — if two vendors would share an X or a Y at one decimal place, a deterministic 0.1-step walk takes the nearest free slot inside the chart bounds. Rank order of the true scores is preserved. This is collision avoidance, **not a score and not random jitter**. The engine does not apply jitter amplitudes (±0.28 / ±0.34 / ±0.36 are gone).\n\nPositioning Matrix (3A) X = process / offering depth; Y = execute / operations. Magic Quadrant (3B) X = Completeness of Vision; Y = Ability to Execute. Quadrants split at **5.5 / 5.5** (Leaders top-right).\n\n**3. Wave (3C).** Current Offering = floor 1.5 + ranking_score/10, cap 4 (matrix depth as current product). Strength of Strategy starts at 1.0, adds the weighted feature ticks below, then small SCR-text bonuses (multi-host 0.10/0.25, OSS license 0.20, marketplace/ecosystem 0.15, roadmap 0.10, bonus cap +0.55), then cap 4 — **not** `1.2 + count(Workflow, Atomic)`. Market Presence = `int(1 + ranking_score/8)`, cap 4, then cap 3 without Managed hosting. Packs that fail Leader eligibility are capped to presence ≤ 2 / offering ≤ 2.4 / strategy ≤ 2.5. Methodology-without-gates seeds are **omitted from Wave**.\n\n**Strategy feature weights (points added when the matrix ticks that feature):** Atomic flow catalog +0.55; Skill/plugin marketplace +0.40; Prebuilt SDLC templates +0.35; Free tier / OSS core +0.30; Hook-enforced gates +0.30; Automated review loops +0.30; Parent/child delegation +0.30; Managed hosting +0.25; Visual/E2E verification +0.25; IDE-native integration +0.20; Zero-infra bootstrap +0.20; CI integration +0.20; Predictable pricing +0.20; Per-seat transparency +0.15; Self-serve signup +0.15; Workflow composition +0.15; Quick onboarding +0.10.\n\n**4. Blue Ocean (3D).** Leaders only. A factor is plotted only when at least one Leader has matrix evidence. True = 5, otherwise 1. Unmanaged OSS hosting is not plotted as a flat factor when no Leader has hosting. Zero-infra bootstrap is **not** treated as Managed hosting.\n\n**Leader eligibility.** SDLC plugins need hook-enforced gates **and** inclusion-ledger cross-session pass. APO seeds without shipped hook gates cannot occupy Leaders. Plugin MQ Leaders = Silver Bullet only in this run is that feature-gate fact — not a 'most complete product' claim.\n\n**Hard-exclusion membership.** A slug on the pack hard-exclusion list (Magic.dev as `coding_agent`; A.Team as professional services) has **one** membership — excluded. It is not a core, not an MQ/Wave point, and not a comparison-matrix column. Contributing-model seed lists that re-include it are envelope quotes / model error, not membership.\n\n**Not scored.** Multi-model triangulation, brand reputation, and COI. Triangulation is a research method for this document; vendors were not graded on it. This report does not call any vendor 'most complete'.\n\nMatrix rows in this run (the ranking uses these priorities; chart axes use the short feature lists in the rubric table, not every row as an axis tick):\n\n- **Critical (5 pts per ✔)**: Workflow composition, Self-serve signup, Quick onboarding, Managed hosting, Prebuilt SDLC templates, Zero-infra bootstrap\n- **Very High (4 pts per ✔)**: Predictable pricing, Free tier / OSS core, Per-seat transparency\n- **High (3 pts per ✔)**: IDE-native integration, Skill/plugin marketplace\n- **Medium (2 pts per ✔)**: Atomic flow catalog, Parent/child agent delegation, Hook-enforced gates, Automated review loops, CI integration, Visual/E2E verification, SSO, RBAC, Audit log\n\n| Market | Chart | Axis | Buyer meaning | Axis features (1 tick each) | Floor | Points per tick | Ranking spread (pts → 1.0 chart) |\n|---|---|---|---|---|---|---|---|\n| Agentic Process Orchestrators (APO) | 3A Positioning | X | Process / offering depth | Workflow composition, Atomic flow catalog, Hook-enforced gates | 3.0 | 2.2 | 15.0 |\n| Agentic Process Orchestrators (APO) | 3A Positioning | Y | Execute / operations depth | Parent/child delegation, Managed hosting, Prebuilt SDLC templates | 3.0 | 2.0 | 18.0 |\n| Agentic Process Orchestrators (APO) | 3B Magic Quadrant | X | Completeness of Vision | Workflow composition, Atomic flow catalog, Prebuilt SDLC templates, Free tier / OSS core | 2.5 | 1.6 | 12.0 |\n| Agentic Process Orchestrators (APO) | 3B Magic Quadrant | Y | Ability to Execute | Parent/child delegation, Managed hosting, CI integration, Hook-enforced gates, IDE-native integration | 2.5 | 1.35 | 14.0 |\n| SDLC Pl g-the-agentic-sdlc-with-bmad-a-graphic-overview", "relevance": "Third-party analyst-style mapping of BMAD onto full SDLC phases; supports multi-phase lifecycle coverage scoring."}, {"title": "GitHub Spec Kit (GitHub repo)", "url": "https://github.com/github/spec-kit", "relevance": "Secondary market: MIT spec-driven harness, Specify CLI, constitution.md non-negotiable principles, 29+ agent integrations."}, {"title": "Spec-driven development with AI — GitHub Blog", "url": "https://github.blog/ai-and-ml/generative-ai/spec-driven-development-with-ai-get-started-with-a-new-open-source-toolkit/", "relevance": "Vendor-authoritative positioning of Spec Kit as process layer above host coding agents."}, {"title": "Spec Kit Documentation", "url": "https://github.github.com/spec-kit/", "relevance": "Phase commands (/specify /plan /tasks /implement), harness framing 'pushes any coding agent across your SDLC'."}, {"title": "obra/superpowers — agentic skills framework & SDLC methodology (GitHub)", "url": "https://github.com/obra/superpowers", "relevance": "Secondary market: skills-framework plugin for Claude Code; brainstorming → design → writing-plans → TDD → subagent review."}, {"title": "Superpowers Plugin — claude.com plugin directory", "url": "https://claude.com/plugins/superpowers", "relevance": "First-party distribution evidence for plugin/skill/hook packaging criterion."}, {"title": "Claude Code Superpowers: Structured AI Development Plugin — DataCamp", "url": "https://www.datacamp.com/tutorial/claude-code-superpowers", "relevance": "Independent walkthrough of enforced red-green-refactor TDD gating."}, {"title": "Ruflo / Claude Flow — ruvnet (GitHub issues + guides)", "url": "https://github.com/ruvnet/ruflo/issues/113", "relevance": "Secondary market: SPARC methodology, hive-mind queen/sub-agent topology, 87 MCP tools, Rust rewrite with persistent memory."}, {"title": "Claude Flow (Ruflo) v3.5 multi-agent orchestration guide", "url": "https://pasqualepillitteri.it/en/news/774/claude-flow-ruflo-multi-agent-orchestration-guide", "relevance": "Version currency + cross-session memory / federation claims."}, {"title": "AI-Driven Development Life Cycle — AWS DevOps Blog", "url": "https://aws.amazon.com/blogs/devops/ai-driven-development-life-cycle/", "relevance": "Primary/APO peer: AWS AI-DLC methodology — Inception/Construction/Operations bolts, human validation gates."}, {"title": "Open-Sourcing Adaptive Workflows for AI-DLC — AWS DevOps Blog", "url": "https://aws.amazon.com/blogs/devops/open-sourcing-adaptive-workflows-for-ai-driven-development-life-cycle/", "relevance": "awslabs/aidlc-workflows open-sourced Nov 2025 — makes AI-DLC an installable process pack, not just a whitepaper."}, {"title": "Conductor — run parallel coding agents on your Mac", "url": "https://www.conductor.build/", "relevance": "APO-adjacent orchestrator: git-worktree isolation, multi-agent parallelism, diff-first review UI, free (BYO API cost)."}, {"title": "microsoft/conductor — deterministic multi-agent workflow CLI", "url": "https://github.com/microsoft/conductor", "relevance": "Name-collision disambiguation: MIT YAML-defined deterministic routing, parallel groups with fail_fast/all_or_nothing modes."}, {"title": "Conductor: Deterministic orchestration for multi-agent AI workflows — Microsoft Open Source Blog", "url": "https://opensource.microsoft.com/blog/2026/05/14/conductor-deterministic-orchestration-for-multi-agent-ai-workflows/", "relevance": "Vendor statement of deterministic-gate positioning above Copilot SDK / Anthropic Agents SDK."}, {"title": "Factory 2.0: From coding agents to software factories — Factory.ai", "url": "https://factory.ai/news/software-factory", "relevance": "Tertiary market anchor: repositioning from coding agent to org-level delivery system."}, {"title": "Factory is GA: Droids for the Entire SDLC — Factory.ai", "url": "https://factory.ai/news/factory-is-ga", "relevance": "Explicit full-SDLC droid persona claim (code, knowledge, reliability droids)."}, {"title": "Factory AI raises $150M at $1.5B valuation — FullStackEvolved", "url": "https://www.fullstackevolved.com/blog/factory-ai-droids-150m-2026-04-18/", "relevance": "Funding/maturity signal for startup-weighted matrix (viability axis)."}, {"title": "Hello, Cosmos: the platform for AI-native engineering teams — Augment Code", "url": "https://www.augmentcode.com/blog/cosmos-the-platform-for-ai-native-engineering-teams", "relevance": "Tertiary market: 'operating system for agentic software development', shared memory, human steering gates."}, {"title": "Augment Code launches Cosmos — SiliconANGLE", "url": "https://siliconangle.com/2026/06/05/augment-code-launches-cosmos-bring-agentic-ai-software-development-teams/", "relevance": "Independent confirmation of launch timing and team-scale orchestration positioning."}, {"title": "With Cosmos, Augment Code wants to give AI coding teams shared memory and context — Tessl", "url": "https://tessl.io/blog/with-cosmos-augment-code-wants-to-give-ai-coding-teams-a-shared-memory-and-context/", "relevance": "Third-party read on cross-session state / triage→author→review→verify coordination."}, {"title": "Cognition (Devin) — official site", "url": "https://cognition.com/", "relevance": "Tertiary market: Devin plans, writes, tests, ships production code inside existing toolchain."}, {"title": "Cognition in talks to raise at $25B valuation — SiliconANGLE", "url": "https://siliconangle.com/2026/04/23/cognition-creator-ai-software-engineer-devin-talks-raise-hundreds-millions-25b-valuation/", "relevance": "Maturity/viability signal; $26B post-money round closed May 2026."}, {"title": "Cognizant × Cognition partnership announcement", "url": "https://investors.cognizant.com/news-and-events/news/news-details/2026/Cognizant-and-Cognition-Partner-to-Scale-Autonomous-Software-Engineering-and-Deliver-Business-Value-Across-Enterprise-Operations/default.aspx", "relevance": "Enterprise distribution evidence — raises Devin's substitution threat in regulated buyers."}, {"title": "Tembo — move engineering work to the cloud", "url": "https://www.tembo.io/", "relevance": "Tertiary market: managed orchestration over Claude Code/Cursor/Codex, human approval gate, per-agent isolated VMs, self-hosted VPC option."}, {"title": "Autonomous Software Maintenance Has Arrived — Tembo blog", "url": "https://www.tembo.io/blog/autonomous-software-maintenance-has-arrived", "relevance": "Recurring-automation and multi-repo coordinated-change claims."}, {"title": "A guide to the agentic SDLC — CodeRabbit", "url": "https://www.coderabbit.ai/guides/agentic-sdlc", "relevance": "Category framing reference for agentic-SDLC phase taxonomy (used for market definition, not as a candidate)."}, {"title": "The Agentic SDLC: rebuilt around agents — Port.io", "url": "https://www.port.io/blog/agentic-sdlc-software-lifecycle-rebuilt-around-agents", "relevance": "Independent category-definition source supporting 'process layer above host runtime' framing."}, {"title": "Agentic Software Engineering: Foundational Pillars and a Research Roadmap (arXiv 2509.06216)", "url": "https://arxiv.org/pdf/2509.06216", "relevance": "Academic grounding for enforcement/verification pillars in agentic SDLC; strengthens evidence tier for gate-based claims."}], "evidence": [{"claim": "Silver Bullet self-positions as an orchestration layer that runs inside Claude Code, Codex, or Cursor sessions rather than replacing the host runtime — satisfying process layer above host runtime and plugin/skill/hook packaging.", "source_ref": "https://sb.alolabs.dev/", "confidence": "high"}, {"claim": "Silver Bullet ships 12 layers of hook-enforced gates (SessionStart reset, PreToolUse planning gates, completion audits, stop hooks, branch-finish readiness) that block progress before PR creation or release — a deterministic quality gates claim, not advisory.", "source_ref": "https://sb.alolabs.dev/", "confidence": "high"}, {"claim": "Silver Bullet exposes 22 pre-composed workflows built from 27 reusable atomic flows with 85 flow-step V-loops and evidence schemas, covering feature, bugfix, UI, DevOps, deploy, canary and release.", "source_ref": "https://sb.alolabs.dev/", "confidence": "high"}, {"claim": "Silver Bullet uses a two-tier delivery discipline: intermediate commits require only the planning floor, while final delivery (PR/release/deploy) requires full verification evidence.", "source_ref": "https://sb.alolabs.dev/", "confidence": "high"}, {"claim": "Silver Bullet is free and open-source (Ālo Labs alpha) with no telemetry or lock-in, placing it at price parity with OSS methodology packs rather than with SaaS peers.", "source_ref": "https://sb.alolabs.dev/", "confidence": "high"}, {"claim": "BMAD-METHOD is MIT-licensed, bring-your-own-model, and had approached ~49k GitHub stars — the highest-distribution OSS substitute in the secondary market.", "source_ref": "https://github.com/bmad-code-org/bmad-method", "confidence": "medium"}, {"claim": "BMAD structures delivery around 12–21 specialist agent personas (Analyst, PM, Architect, Scrum Master, Dev, QA/Test Architect, UX) with explicit deliverables and structured handoffs — strong specialist agent orchestration score.", "source_ref": "https://codemyspec.com/blog/bmad-method-explained", "confidence": "medium"}, {"claim": "BMAD's two-phase model (agentic planning, then context-engineered implementation) produces complete specs before code, spanning plan→build→test — satisfies multi-phase lifecycle coverage.", "source_ref": "https://labs.sogeti.com/transforming-the-agentic-sdlc-with-bmad-a-graphic-overview", "confidence": "medium"}, {"claim": "BMAD installs into Claude Code and Cursor via a single command (npx bmad-method install), meeting plugin/skill/hook packaging.", "source_ref": "https://docs.bmad-method.org/", "confidence": "high"}, {"claim": "BMAD's enforcement is prompt/persona-level rather than hook-level; no machine-checkable stop-gate is documented, so it scores lower than Silver Bullet on deterministic quality gates.", "source_ref": "https://github.com/bmad-code-org/bmad-method", "confidence": "medium"}, {"claim": "GitHub Spec Kit is MIT-licensed and describes itself as an extensible, intent-driven harness that pushes any coding agent beyond code, across the SDLC — direct process layer above host runtime positioning from a first-party vendor.", "source_ref": "https://github.com/github/spec-kit", "confidence": "high"}, {"claim": "Spec Kit introduces constitution.md as a set of non-negotiable project principles enforced across phases — the closest OSS analogue to a policy layer, though enforcement is agent-interpreted rather than hook-blocked.", "source_ref": "https://developer.microsoft.com/blog/spec-driven-development-spec-kit/", "confidence": "medium"}, {"claim": "Spec Kit supports 29+ named agent integrations plus a generic adapter (Claude Code, Copilot, Gemini CLI, Cursor, Codex CLI, Windsurf, Goose, Roo Code and others) — the broadest host portability in the comparison set.", "source_ref": "https://github.github.com/spec-kit/", "confidence": "high"}, {"claim": "Spec Kit's persistent spec artifacts serve as the cross-session state mechanism (specification as source of truth) rather than a runtime state machine.", "source_ref": "https://github.blog/ai-and-ml/generative-ai/spec-driven-development-with-ai-get-started-with-a-new-open-source-toolkit/", "confidence": "medium"}, {"claim": "Superpowers (Jesse Vincent / obra) installs a composable skills framework into Claude Code covering brainstorming, design, plan-writing, TDD, systematic debugging, subagent-driven development with built-in code review, and skill authoring — multi-phase multi-phase lifecycle coverage in plugin packaging.", "source_ref": "https://github.com/obra/superpowers", "confidence": "high"}, {"claim": "Superpowers enforces a red-green-refactor discipline in which tests must fail before implementation is written, and decomposes approved plans into 2–5 minute tasks with exact file paths and verification steps.", "source_ref": "https://www.datacamp.com/tutorial/claude-code-superpowers", "confidence": "medium"}, {"claim": "Superpowers is distributed through the first-party Claude plugin directory, giving it the lowest-friction install path among secondary-market substitutes.", "source_ref": "https://claude.com/plugins/superpowers", "confidence": "high"}, {"claim": "Reported Superpowers star counts in secondary sources (~248k) are implausible for a Claude Code plugin and should be treated as unverified; use the GitHub repo as the authoritative counter before publishing any adoption figure.", "source_ref": "https://www.trevorlasn.com/blog/superpowers-claude-code-skills", "confidence": "low"}, {"claim": "Ruflo (formerly Claude Flow, by ruvnet) packages the SPARC methodology — Specification, Pseudocode, Architecture, Refinement, Completion — as a test-driven process layer over Claude Code.", "source_ref": "https://dev.to/stevengonsalvez/claude-flow-the-multi-agent-swarm-orchestrator-before-it-got-a-new-name-4kd4", "confidence": "medium"}, {"claim": "Ruflo uses a hive-mind topology (queen agent coordinating specialised sub-agents) with 4 swarm topologies and 87 MCP tools, and was rewritten in Rust with persistent memory and MCP bridging — strong specialist agent orchestration and cross-session state scores.", "source_ref": "https://github.com/ruvnet/ruflo/issues/113", "confidence": "medium"}, {"claim": "AWS AI-DLC is an open-source methodology (published July 2025; awslabs/aidlc-workflows open-sourced November 2025) structured as Inception → Construction → Operations 'bolts' with mandatory human validation at each step.", "source_ref": "https://aws.amazon.com/blogs/devops/open-sourcing-adaptive-workflows-for-ai-driven-development-life-cycle/", "confidence": "high"}, {"claim": "AI-DLC's core principle is AI-powered execution with human oversight — agents draft plans, code, tests and infrastructure while deferring critical decisions to humans, matching the APO compliance-wrapper pattern.", "source_ref": "https://aws.amazon.com/blogs/devops/ai-driven-development-life-cycle/", "confidence": "high"}, {"claim": "AWS-reported AI-DLC outcomes (6 engineers, 100k lines of production Rust in 76 days; 4.5x developer velocity at Amazon Stores) are vendor-published and uncontrolled — cite as vendor claim, not benchmark.", "source_ref": "https://aws.amazon.com/blogs/devops/ai-driven-development-life-cycle/", "confidence": "low"}, {"claim": "'Conductor' is an ambiguous name across at least four distinct products (conductor.build Mac app, microsoft/conductor CLI, ryanmac/code-conductor, Conductor OSS); solution cards must disambiguate by vendor and URL.", "source_ref": "https://rustman.org/wiki/conductor-parallel-agents/", "confidence": "high"}, {"claim": "Conductor (conductor.build) runs multiple Claude Code and Codex agents in parallel, each in its own git worktree, with a visual dashboard and diff-first review; it is free with BYO API cost and targets 3–8 parallel features per repo.", "source_ref": "https://www.conductor.build/", "confidence": "medium"}, {"claim": "microsoft/Conductor (SaaS-adjacent coding-agent aggregator, not APO) is MIT-licensed and provides deterministic YAML-defined routing with parallel groups and configurable failure modes (fail_fast, continue_on_error, all_or_nothing) over the Copilot SDK and Anthropic Agents SDK — the strongest deterministic quality gates evidence among APO peers besides Silver Bullet.", "source_ref": "https://opensource.microsoft.com/blog/2026/05/14/conductor-deterministic-orchestration-for-multi-agent-ai-workflows/", "confidence": "high"}, {"claim": "Factory.ai repositioned from coding agents to 'software factories' and reached GA with Droids spanning the entire SDLC — code, knowledge/technical-writing, and reliability (SRE incident response) personas.", "source_ref": "https://factory.ai/news/factory-is-ga", "confidence": "high"}, {"claim": "Factory's Droids handle end-to-end delivery — writing code, running tests, reviewing PRs, and pushing deployments — in production at NVIDIA, EY, Adobe, Palo Alto Networks, Adyen, Blackstone, Wipro and Comarch.", "source_ref": "https://factory.ai/news/software-factory", "confidence": "medium"}, {"claim": "Factory closed a $150M Series C at a $1.5B valuation (Khosla Ventures and Sequoia leading), following a $50M round in September 2025 — high viability, high displacement risk in enterprise segments.", "source_ref": "https://www.fullstackevolved.com/blog/factory-ai-droids-150m-2026-04-18/", "confidence": "medium"}, {"claim": "Augment Cosmos self-describes as 'the operating system for agentic software development', with agents running in the customer env or Augment cloud across the SDLC and humans steering where judgment matters.", "source_ref": "https://www.augmentcode.com/blog/cosmos-the-platform-for-ai-native-engineering-teams", "confidence": "high"}, {"claim": "Cosmos coordinates agents across triage, authoring, review and verification with shared team memory and self-improving loops, multi-model by default — direct functional overlap with APO cross-session state and specialist agent orchestration.", "source_ref": "https://tessl.io/blog/with-cosmos-augment-code-wants-to-give-ai-coding-teams-a-shared-memory-and-context/", "confidence": "medium"}, {"claim": "Cosmos entered public preview around May–June 2026 and is gated to the MAX plan at $200/developer/month or custom Enterprise pricing — a ~$2,400/dev/year floor versus $0 for Silver Bullet and the OSS packs.", "source_ref": "https://siliconangle.com/2026/06/05/augment-code-launches-cosmos-bring-agentic-ai-software-development-teams/", "confidence": "medium"}, {"claim": "Product-level naming requires listing 'Augment Cosmos' (not Augment Code, which is a hard exclusion as the parent coding-agent product) and 'Devin' (not Cognition).", "source_ref": "https://www.augmentcode.com/", "confidence": "high"}, {"claim": "Devin plans, writes, tests, ships, debugs, deploys and monitors inside sandboxed environments with shell, browser, editor and multiple sub-agents — full multi-phase lifecycle coverage but as a host runtime, not a layer above one.", "source_ref": "https://cognition.com/", "confidence": "high"}, {"claim": "Devin's July 2026 pricing spans Free, Pro $20/seat/mo, Max $200/seat/mo, Teams $80/mo base + $40/full dev seat, and custom Enterprise — the widest price ladder in the tertiary market.", "source_ref": "https://aitoolsdevpro.com/ai-tools/devin-guide/", "confidence": "low"}, {"claim": "Cognition raised over $1B at a $26B post-money valuation on 27 May 2026 (up from $10.2B eight months earlier) and partnered with Cognizant to scale autonomous software engineering into enterprise operations.", "source_ref": "https://investors.cognizant.com/news-and-events/news/news-details/2026/Cognizant-and-Cognition-Partner-to-Scale-Autonomous-Software-Engineering-and-Deliver-Business-Value-Across-Enterprise-Operations/default.aspx", "confidence": "medium"}, {"claim": "Tembo delegates work to Claude Code, Cursor and Codex across repos, triggered from Slack, Linear, GitHub and Sentry — a managed orchestration layer above host runtimes, qualifying it as a tertiary-market APO substitute despite no APO self-label.", "source_ref": "https://www.tembo.io/", "confidence": "high"}, {"claim": "Tembo enforces a human approval gate so nothing merges unreviewed, runs each agent in an isolated cloud VM preloaded with repo and dependencies, supports self-hosted VPC deployment, and claims no single-agent/model lock-in.", "source_ref": "https://www.tembo.io/", "confidence": "medium"}, {"claim": "Tembo's last disclosed round was a $14M Series A (July 2024) after pivoting from managed Postgres; it is materially under-capitalised versus Factory ($1.5B) and Cognition ($26B), making it the most fragile tertiary entrant on a startup-weighted viability axis.", "source_ref": "https://startupintros.com/orgs/tembo", "confidence": "medium"}, {"claim": "Zuvo could not be corroborated by open web search in this retrieval pass; its OSS license status is asserted by the category pack and must be verified against a primary repo/license file before the solution card asserts licensing.", "source_ref": "https://github.com/topics/sdlc-automation", "confidence": "low"}, {"claim": "The secondary market splits cleanly on enforcement mechanism: Silver Bullet and microsoft/conductor use machine-checkable blocking gates, while BMAD, Spec Kit, Superpowers and Ruflo rely on prompt-, artifact-, or persona-level discipline that an agent can in principle skip.", "source_ref": "https://sb.alolabs.dev/", "confidence": "medium"}, {"claim": "The tertiary SaaS market competes on managed infrastructure and enterprise distribution rather than on host-integrated process enforcement, so it substitutes for APO on outcome (shipped software with review gates) rather than on architecture.", "source_ref": "https://www.port.io/blog/agentic-sdlc-software-lifecycle-rebuilt-around-agents", "confidence": "medium"}, {"claim": "Academic framing of agentic software engineering identifies verification and enforcement as foundational pillars, supporting the market thesis that a gate-enforcing process layer is a durable category rather than a transient wrapper.", "source_ref": "https://arxiv.org/pdf/2509.06216", "confidence": "medium"}, {"claim": "Startup-weighted scoring favours the OSS secondary market on cost ($0 vs $200/dev/mo for Cosmos and Devin Max) and on absence of vendor lock-in, but favours the tertiary SaaS market on managed infrastructure and support burden.", "source_ref": "https://www.augmentcode.com/blog/cosmos-now-in-public-preview", "confidence": "medium"}]}, "authoritative": true, "model_routing": {"requested_model_id": "claude-opus-4-8-medium", "effective_model_id": "claude-opus-4-8-medium"}}, {"schema_id": "dr-phase-contribution-envelope-v1", "version": "1.0.0", "run_id": "run-57f38dfa25d83cc50d224e283d4 lls, hook-based deterministic gates, cross-session state via context-mode/agentmemory, plugin packaging for Claude/Codex/Cursor, and explicit multi-market positioning (APO primary, SDLC plugins secondary, agentic SDLC SaaS tertiary).", "source_ref": "Silver Bullet — Official Site; Silver Bullet GitHub Repository", "confidence": "high"}, {"claim": "Silver Bullet ships as host-integrated packaging (Claude plugin, Codex plugin, Cursor plugin) with hooks/, skills/, templates/ — satisfying plugin/skill/hook packaging criterion at the deepest level of any APO.", "source_ref": "Silver Bullet GitHub Repository", "confidence": "high"}, {"claim": "Silver Bullet enforces deterministic quality gates via hooks (pre-commit, post-task, completion-audit, artifact-reviewers) that block progression when criteria fail — satisfying deterministic quality gates criterion.", "source_ref": "Silver Bullet GitHub Repository; Silver Bullet — Official Site", "confidence": "high"}, {"claim": "Silver Bullet persists cross-session state via context-mode knowledge base (FTS5/BM25), agentmemory (long-term memory with project scoping), and .planning/ workflow state — satisfying cross-session state criterion.", "source_ref": "Silver Bullet GitHub Repository", "confidence": "high"}]}, "authoritative": true, "model_routing": {"requested_model_id": "gemini-3.5-flash", "effective_model_id": "gemini-3.5-flash"}}, {"schema_id": "dr-phase-contribution-envelope-v1", "version": "1.0.0", "run_id": "run-57f38dfa25d83cc50d224e283d4692f3", "work_item_id": "work-cad979016eeaa7748f3670e17def28db", "phase_id": "DR-RETRIEVE", "logical_model_id": "gpt-5.6-luna-medium", "attempt_id": "attempt-7009c301-2a38-49c2-992b-e5aa2d96f53c", "model_family_id": "gpt", "payload": {"raw_text": "--- Code-intel preflight (Graphify / agentmemory / RTK / Context Mode) ---\nCode-intel preflight OK.\nReading additional input from stdin...\nOpenAI Codex v0.145.0-alpha.18\n--------\nworkdir: /Users/shafqat/.cursor/worktrees/repo/r41j\nmodel: gpt-5.6-luna\nprovider: openai\napproval: never\nsandbox: danger-full-access\nreasoning effort: medium\nreasoning summaries: none\nsession id: 019f7acb-434b-7e30-8408-d93533558a80\n--------\nuser\nYou are a Silver Bullet DR multi-AI worker (gpt-5.6-luna-medium).\n\nDR-RETRIEVE phase: gather authoritative sources and evidence for the research query. Return JSON only with keys: sources (array of {title, url, relevance}), evidence (array of {claim, source_ref, confidence}).\n\nResearch query: Research topic: Agentic SDLC orchestration landscape multimarket final — APO primary, SDLC plugins secondary (BMAD GSD Superpowers Spec Kit Oh My Zuvo OSS), agentic SDLC SaaS tertiary (Factory Devin Augment Cosmos)\nResearch type: solution-landscape\nUnderstand Silver Bullet (repo + site at https://sb.alolabs.dev/).\nMulti-market landscape — chart + solution cards **per market**:\n  1. **Primary (APO):** Agentic Process Orchestrators — compliance wrappers above host runtimes.\n  2. **Secondary (SDLC plugins):** OSS methodology packs (BMAD, GSD, Superpowers, GitHub Spec Kit, Oh My plugins, Zuvo as OSS, SuperClaude, Ruflo) — formidable SB substitutes even if adjacent to APO.\n  3. **Tertiary (agentic SDLC SaaS):** Factory/Factory.ai, Devin, Augment Cosmos, Tembo — analyst-grade substitutes even when vendors do not self-label APO.\nAPO targeting must NOT exclude secondary-market OSS/plugin substitutes from solution cards or charts.\nZuvo license is OSS (not commercial). Apply factory↔factory-ai aliases from category pack.\nFew products self-label APO; map Cosmos/Factory/Devin-class vendors as landscape peers per market definition.\nProduce startup-weighted comparison matrix entries and evidence-backed claims.\n\n[CATEGORY_PACK]\n## Category market contract — Agentic SDLC Process Orchestrators\n\n**Definition:** Systems that add repeatable workflows, cross-session state, deterministic quality gates, specialist agents, and enforcement above the host coding-agent runtime — not generic AI coding assistants, foundation-model labs, or single-step SDLC tools. Closest comps orchestrate full or multi-phase software delivery and DevOps cycles as composable, host-integrated process layers (plugins, skills, hooks).\n\n**Jobs to be done:**\n- Enforce a full SDLC or DevOps cycle so agents cannot skip planning, verification, review, or release steps\n- Compose specialist agents and external workflows (GSD, spec kits, review ladders) under one compliance layer\n- Persist process state, gates, and evidence across sessions and parallel workers\n- Provide procurement-ready comparison of process-orchestration depth vs host runtimes and frameworks\n\n**Inclusion criteria (candidate must pass ≥3 of 7):**\n  - **multi-phase lifecycle coverage** (Multi-phase lifecycle span): Covers two or more of plan/spec, build, test, review, release, or DevOps operations as an integrated process — not a single-shot codegen or review-only tool.\n  - **plugin/skill/hook packaging** (Plugin / skill / hook packaging): Ships as host-integrated packaging (Claude/Codex/Cursor plugin, skill bundle, hook layer, or equivalent) rather than a standalone IDE or raw API.\n  - **deterministic quality gates** (Deterministic quality gates): Uses machine-checkable gates (hooks, audits, stop-checks, CI integration) that block progression when criteria fail.\n  - **cross-session state** (Cross-session state): Persists workflow state, memory, or runbooks across agent clears, sessions, or parallel workers.\n  - **specialist agent orchestration** (Specialist agent orchestration): Routes work to named specialist agents, hats, or role-specific subagents — not a single monolithic agent.\n  - **quality/release enforcement** (Quality / release enforcement claim): Publicly claims enforcement of quality, compliance, release, or governance — not advisory-only suggestions.\n  - **process layer above host runtime** (Process layer above host runtime): Positions as a meta-orchestrator or compliance wrapper above Claude Code, Codex, Cursor, or similar — not as the host runtime itself.\n\n**Exclusion classes (never Top-N / MQ / Wave / matrix — Adjacent or Excluded only):**\n  - `coding_agent` — Generic AI coding agent: IDE copilots, autocomplete agents, and autonomous SWE bots whose primary job is writing code — not enforcing a full process lattice.\n  - `host_runtime` — Host runtime: The underlying agent host (Cursor, Claude Code, Codex CLI, Copilot) when evaluated as the runtime itself — adjacent only, not a process-orchestrator peer.\n  - `single_sdlc_step` — Single SDLC step tool: Point solutions for one step only: code review bots, test generators, security scanners, design tools without workflow orchestration.\n  - `generic_agent_framework` — Generic agent framework: Reusable multi-agent libraries (LangGraph, CrewAI, MetaGPT) without a shipped, enforced SDLC process product.\n  - `project_management` — Project management: Issue trackers and PM SaaS (Linear, Jira-style) without agentic process enforcement.\n  - `foundation_model_lab` — Foundation model lab: Model providers and research labs — not process-orchestration products.\n  - `sunset` — Sunset / discontinued: Products officially discontinued or abandoned; never list in Top-N, charts, or matrix.\n\n**Must-research core seeds:** Silver Bullet, AI-DLC, AgentSys, SDLC, Deepwork, Workflow Manager, Turboshovel, Cavekit v3.1, Barkain Workflow Orchestrator, Conductor, cc10x, Director, Claude Harness, Claude Code Expert, AgentHub, ATeam\n\n**Multi-market landscape (chart + solution cards per market):**\n- **Agentic Process Orchestrators (APO)** (`apo`, primary): Silver Bullet, AI-DLC, AgentSys, SDLC, Deepwork, Workflow Manager, Turboshovel, Cavekit v3.1, Barkain Workflow Orchestrator, cc10x, Director, Claude Harness, Claude Code Expert, AgentHub, ATeam\n  - **SDLC Plugins & Methodology Packs** (`sdlc-plugins`, secondary): Zuvo, GSD (Get Shit Done), Superpowers, BMAD-METHOD, GitHub Spec Kit, SuperClaude, Ruflo / Claude Flow, Oh My Pi (OMP)\n  - **Agentic SDLC SaaS & Autonomous Delivery** (`agentic-sdlc-saas`, tertiary): Factory.ai, Devin, Augment Cosmos, Tembo, Cursor, Claude Code, Codex, GitHub Copilot, Magic.dev, Cognition Scout\n\n**Adjacent-only seeds (short Adjacent section if enabled):** LangGraph, CrewAI, MetaGPT, LangChain, AxonFlow, Cavekit v4\n\n**Hard exclusions (never list as in-scope):** Cursor Background Agents, Sweep, Windsurf, Amazon Q Developer, Sourcegraph Cody, Poolside, CodeRabbit, JetBrains AI Assistant, GitHub Copilot Enterprise, OpenHands, Cline, Continue, Aider, SWE-agent, Open Interpreter, Magic.dev, Linear, Cognition, Augment Code\n\n**Sunset / discontinued (never list):** GitHub Copilot Workspace, AutoGen, AgentGPT, Devika\n\n**Core count bounds:** 8–24 in-scope solutions total (commercial + OSS).\n\n**Naming rules:** Use product-level names (e.g. Augment Cosmos not Augment Code; Devin not Cognition+Devin). Apply parent/child dedupe from pack aliases.\n\n\nRespond with a single JSON object matching the phase schema. No markdown wrapper unless fenced. Be concise but substantive.\nwarning: `--dangerously-bypass-hook-trust` is enabled. Enabled hooks may run without review for this invocation.\nwarning: `--dangerously-bypass-hook-trust` is enabled. Enabled hooks may run without review for this invocation.\nhook: SessionStart\nhook: SessionStart\nhook: SessionStart\nhook: SessionStart\nhook: SessionStart\nhook: SessionStart\nhook: SessionStart\nhook: SessionStart\nhook: SessionStart Failed\nhook: SessionStart Completed\nhook: SessionStart Completed\nhook: SessionStart Completed\nhook: SessionStart Completed\nhook: SessionStart Completed\nhook: SessionStart Completed\nhook: SessionStart Completed\nhook: UserPromptSubmit\nhook: UserPromptSubmit\nhook: UserPromptSubmit\nhook: UserPromptSubmit\nhook: UserPromptSubmit\nhook: UserPromptSubmit\nhook: UserPromptSubmi"}, "authoritative": true, "model_routing": {"requested_model_id": "gpt-5.6-luna-medium", "effective_model_ agent orchestration plus quality/release enforcement.", "confidence": 0.66, "supporting_sources": ["Factory.ai product documentation"]}, {"text": "Zuvo should be classified as OSS-licensed within the secondary market, not commercial; misclassifying it as commercial overstates the paid-substitute density of the SDLC-plugins market.", "confidence": 0.7, "supporting_sources": ["Category pack licensing directive", "Zuvo repository"]}, {"text": "The primary APO market is structurally immature: most named seeds (Turboshovel, Cavekit v3.1, Barkain Workflow Orchestrator, cc10x, Director, AgentHub, ATeam, Claude Harness) are single-maintainer OSS packs without pricing, SLAs, or enterprise governance, meaning competition is on process depth and host-compatibility rather than commercial moat.", "confidence": 0.65, "supporting_sources": ["https://github.com/topics/claude-code-plugin", "https://github.com/anomalyco/cc10x"]}, {"text": "AI-DLC is a methodology/framework rather than a shipped host-integrated product; it should appear in the APO market chart as a low-packaging, high-lifecycle-span outlier that shapes buyer vocabulary without being directly substitutable.", "confidence": 0.63, "supporting_sources": ["https://github.com/awslabs/aidlc-workflows"]}, {"text": "Conductor occupies a SaaS-adjacent niche — parallel-worker orchestration and workspace isolation for coding agents — and is not an APO peer to gate-enforcement orchestrators like Silver Bullet.", "confidence": 0.6, "supporting_sources": ["https://conductor.build/"]}, {"text": "For a startup-weighted comparison matrix, the highest-weight dimensions are adoption friction (install-to-first-gate time), host portability (Claude Code / Codex / Cursor coverage), and gate determinism; enterprise procurement dimensions (SOC2, SSO, audit export) are low-weight in primary and secondary markets but decisive in the tertiary market.", "confidence": 0.64, "supporting_sources": ["Category pack jobs-to-be-done", "Cross-market synthesis"]}, {"text": "Cross-session state persistence is the most under-served inclusion criterion across the secondary market: most methodology packs rely on markdown artifacts re-read per session rather than an enforced state machine keyed to branch or worktree identity.", "confidence": 0.58, "supporting_sources": ["https://github.com/anomalyco/silver-bullet/blob/main/silver-bullet.md", "https://github.com/topics/claude-code-plugin"]}], "cross_checks": [{"claim": "Silver Bullet ships host-integrated packaging (plugin/skill/hook) rather than a standalone runtime", "status": "corroborated", "notes": "Site, silver-bullet.md, AGENTS.md, and the plugins/skill-source tree independently attest to hook manifests and skill bundles. Passes plugin/skill/hook packaging and process layer above host runtime."}, {"claim": "Silver Bullet enforces deterministic gates that block progression", "status": "corroborated", "notes": "Two-tier enforcement (intermediate commit vs final delivery) with stop-check and completion-audit is documented in-repo. Caveat: an audited SB OVERRIDE escape hatch exists, so enforcement is strict-but-bypassable-with-log — matrix should score 'deterministic with audited override' not 'absolute'."}, {"claim": "Zuvo is OSS-licensed", "status": "asserted-pending-verification", "notes": "Directive from category pack treated as authoritative for this run; DR-VERIFY should confirm against the repository LICENSE file before publication. Flag as pack-asserted if unconfirmed."}, {"claim": "Factory and Factory.ai are the same entity", "status": "resolved-alias", "notes": "Pack alias applied; single solution card under product name Factory.ai. No double-counting in tertiary market count."}, {"claim": "Augment Cosmos is in-scope while Augment Code is hard-excluded", "status": "corroborated", "notes": "Naming rule requires product-level granularity: Cosmos (the agentic delivery product) is the listed entity; the parent company/IDE-assistant product remains excluded. Consistent with Devin-not-Cognition treatment."}, {"claim": "Devin qualifies as a landscape peer despite not self-labeling APO", "status": "corroborated-with-caveat", "notes": "Passes multi-phase lifecycle coverage, cross-session state, specialist agent orchestration, quality/release enforcement (≥3 of 7). Fails process layer above host runtime — it is the runtime. Retain in tertiary market only; do not rank against APO primaries on the same axis without market labeling."}, {"claim": "Cursor, Claude Code, Codex, and GitHub Copilot appear in the tertiary market list yet also match the host_runtime exclusion class", "status": "conflict", "notes": "Direct tension between the tertiary market roster and the host_runtime exclusion class. Recommended resolution: render them as context/anchor points on the tertiary chart with an explicit 'host runtime — reference only' marker, and exclude them from Top-N ranking, MQ quadrant placement, and the scored comparison matrix. Must be resolved before DR-SYNTHESIZE."}, {"claim": "Magic.dev belongs in the tertiary market", "status": "conflict", "notes": "Magic.dev appears in the tertiary roster AND in the hard-exclusions list. Hard exclusion should win by precedence. Recommend dropping Magic.dev from all cards and charts; likewise Cognition Scout conflicts with the 'Cognition' hard exclusion unless treated as a distinct product name (Scout) — flag for DR-VERIFY."}, {"claim": "Silver Bullet repository is hosted at github.com/anomalyco/silver-bullet", "status": "conflict", "notes": "Retrieval sources cite anomalyco/silver-bullet; the working environment and prior project context reference alo-exp/silver-bullet and sb.alolabs.dev. Likely an org rename, a mirror, or a retrieval hallucination. DR-VERIFY must resolve the canonical repo URL before any citation is published — all four primary-anchor GitHub URLs inherit this risk."}, {"claim": "The in-scope core count lands within the 8–24 bound", "status": "corroborated", "notes": "After removing rs — compliance wrappers above host runtimes.\n  2. **Secondary (SDLC plugins):** OSS methodology packs (BMAD, GSD, Superpowers, GitHub Spec Kit, Oh My plugins, Zuvo as OSS, SuperClaude, Ruflo) — formidable SB substitutes even if adjacent to APO.\n  3. **Tertiary (agentic SDLC SaaS):** Factory/Factory.ai, Devin, Augment Cosmos, Tembo — analyst-grade substitutes even when vendors do not self-label APO.\nAPO targeting must NOT exclude secondary-market OSS/plugin substitutes from solution cards or charts.\nZuvo license is OSS (not commercial). Apply factory↔factory-ai aliases from category pack.\nFew products self-label APO; map Cosmos/Factory/Devin-class vendors as landscape peers per market definition.\nProduce startup-weighted comparison matrix entries and evidence-backed claims.\n\n[CATEGORY_PACK]\n## Category market contract — Agentic SDLC Process Orchestrators\n\n**Definition:** Systems that add repeatable workflows, cross-session state, deterministic quality gates, specialist agents, and enforcement above the host coding-agent runtime — not generic AI coding assistants, foundation-model labs, or single-step SDLC tools. Closest comps orchestrate full or multi-phase software delivery and DevOps cycles as composable, host-integrated process layers (plugins, skills, hooks).\n\n**Jobs to be done:**\n- Enforce a full SDLC or DevOps cycle so agents cannot skip planning, verification, review, or release steps\n- Compose specialist agents and external workflows (GSD, spec kits, review ladders) under one compliance layer\n- Persist process state, gates, and evidence across sessions and parallel workers\n- Provide procurement-ready comparison of process-orchestration depth vs host runtimes and frameworks\n\n**Inclusion criteria (candidate must pass ≥3 of 7):**\n  - **multi-phase lifecycle coverage** (Multi-phase lifecycle span): Covers two or more of plan/spec, build, test, review, release, or DevOps operations as an integrated process — not a single-shot codegen or review
