keeps sessions alive server-side; strong for remote/multi-device.", "score": 8.6}, {"rank": 3, "name": "Pi Desktop", "slug": "pi-desktop", "license": "oss", "rationale": "Richest all-in-one Electron GUI including Windows builds and council planning.", "score": 8.1}, {"rank": 4, "name": "Pi Code Gui", "slug": "pi-code-gui", "license": "oss", "rationale": "Best in-editor VS Code experience with native bridge tools.", "score": 7.4}, {"rank": 5, "name": "OpenClaw", "slug": "openclaw", "license": "oss", "rationale": "Pi-runtime-based personal assistant with apps/nodes; messaging-first rather than dedicated coding GUI.", "score": 6.2}]}, "solutions_requested": null, "landscape_excerpt": "# Landscape Report — Pi coding agent GUI shells (2026-07-10)\n\n## Market snapshot\n\nThe Pi ecosystem (`@earendil-works/pi-coding-agent`, [pi.dev](https://pi.dev)) ships a terminal-first agent. Third-party **GUI shells** wrap that runtime instead of forking the agent loop. As of July 2026 we identified **14 candidates**; five OSS projects meet scope and maintenance gates for deep SCR evaluation.\n\n## Segments\n\n| Segment | Representative projects | Primary value |\n|---------|-------------------------|---------------|\n| Native desktop (Electron) | pi-gui, Pi Desktop | Daily driver GUI with threads, terminal, diffs |\n| Web control plane | PI WEB | Persistent server-side sessions + remote supervision |\n| IDE extension | Pi Code Gui, vscode-pi (not shortlisted) | In-editor chat + bridge tools |\n| Personal assistant / nodes | OpenClaw | Multi-channel messaging and companion apps |\n\n## Shortlist rationale\n\n1. **pi-gui** — Most mature dedicated Pi desktop shell; SDK driver package; worktrees + orchestration.\n2. **PI WEB** — Best when sessions must outlive the browser and span devices.\n3. **Pi Desktop** — Richest packaged desktop feature set including Windows builds and council planning.\n4. **Pi Code Gui** — Best VS Code-native experience with SDK `customTools` bridge.\n5. **OpenClaw** — Included as Pi-runtime-adjacent OSS assistant; weaker fit for dedicated coding GUI.\n\n## Evaluated but not shortlisted\n\n- **vscode-pi** — RPC companion to global `pi` binary; lighter GUI than Pi Code Gui [S010].\n- **Pi Studio (Tauri)** — Bundled runtime via PiManager; less Pi-package-native [S011].\n- **agegr/pi-web** — Local-first alternate web UI; smaller community vs jmfederico/pi-web [S012].\n\n## Recommendation direction\n\nDefault **macOS/Linux desktop**: **pi-gui**. Add **PI WEB** when remote supervision or session persistence is primary. Use **Pi Desktop** for **Windows** desktop packaging. Use **Pi Code Gui** when staying inside VS Code. Treat **OpenClaw** as assistant infrastructure, not a Pi coding GUI default.\n", "scrs": [{"slug": "openclaw", "title": "Openclaw", "body": "# Solution Capability Report: OpenClaw\n\n## Executive summary\n\n**OpenClaw** ([openclaw/openclaw](https://github.com/openclaw/openclaw)) is a **personal AI assistant** platform with gateway daemon, multi-channel messaging (WhatsApp, Telegram, Slack, Discord, etc.), and companion apps for macOS/iOS/Android [E011]. It shares Pi-runtime lineage in the broader agent ecosystem but optimizes for **always-on assistant** workflows rather than a dedicated Pi coding-agent IDE [E012].\n\n## Product overview\n\n- **What it is:** Gateway + channel connectors + node apps.\n- **Runtime model:** Assistant orchestration across devices and chat surfaces [E011].\n- **License:** OSS [S007].\n- **Fit:** Messaging-first personal automation; secondary fit as Pi coding GUI.\n\n## Core capabilities\n\n### Multi-channel assistant\n- Gateway daemon routes conversations across chat providers [E011].\n- Companion apps for desktop/mobile nodes [E011].\n\n### GUI surfaces\n- macOS menu bar / mobile nodes provide graphical control [E011].\n- Documentation emphasizes Windows Hub and nodes; not a code-centric IDE layout [E012].\n\n## Gaps for Pi coding GUI use case\n\n- No first-class wrap of `@earendil-works/pi-coding-agent` as primary coding loop (partial vs shortlisted Pi shells).\n- Lacks integrated repo worktrees, diff review, and session browser tailored to software delivery [E012].\n\n## Pricing & TCO signals\n\n- Self-hosted OSS; operational cost is running gateway + channel credentials.\n\n## Sources\n\n[S007] openclaw/openclaw — README and docs-by-goal sections.\n"}, {"slug": "pi-code-gui", "title": "Pi Code Gui", "body": "# Solution Capability Report: Pi Code Gui\n\n## Executive summary\n\n**Pi Code Gui** ([NimbleTronAI/pi-code-gui](https://github.com/NimbleTronAI/pi-code-gui)) is the leading **VS Code extension** that loads `@earendil-works/pi-coding-agent` at runtime and exposes editor-native bridge tools as Pi SDK `customTools` [E009]. It streams chat, thinking blocks, and tool execution inside a webview panel rather than a standalone desktop window [E010].\n\n## Product overview\n\n- **What it is:** VS Code extension with webview UI + SDK integration layer.\n- **Runtime model:** Uses official Pi coding-agent SDK in-process; registers VS Code APIs as custom tools [E009].\n- **License:** OSS (see repository) [S006].\n- **Fit:** Developers who want Pi inside the editor they already use.\n\n## Core capabilities\n\n### Pi SDK fidelity\n- Loads `@earendil-works/pi-coding-agent` SDK at runtime [E009].\n- Bridge tools map editor capabilities into Pi tool surface [E009].\n\n### IDE UX\n- Streaming assistant panel with thinking + tool call visualization [E010].\n- Stays inside VS Code workbench (no separate Electron shell).\n\n## Gaps vs desktop shells\n\n- No standalone multi-session desktop workspace or git worktree manager comparable to pi-gui [E002].\n- Terminal/diff experience depends on VS Code native views (partial vs integrated Pi desktop flows).\n\n## Pricing & TCO signals\n\n- Free OSS extension; requires VS Code + Pi SDK dependencies.\n\n## Sources\n\n[S006] NimbleTronAI/pi-code-gui — architecture and features.\n"}, {"slug": "pi-desktop", "title": "Pi Desktop", "body": "# Solution Capability Report: pi-desktop\n\n## Executive summary\n\n**Pi Desktop** ([FaqFirebase/pi-desktop](https://github.com/FaqFirebase/pi-desktop)) is a feature-rich **Electron GUI** for the Pi coding agent with chat, integrated terminal, file tree, CodeMirror editor, diff viewer, and **Windows/macOS/Linux** release builds [E007]. Apache 2.0 licensed. Optional **Multi-Agent Council Planning** brings Pi, Claude, and Codex into a read-only planning council before Pi executes [E008].\n\n## Product overview\n\n- **What it is:** All-in-one desktop IDE-like shell for Pi.\n- **License:** Apache-2.0 [S005].\n- **Homepage:** https://pi-desktop.dev/ (linked from README).\n\n## Core capabilities\n\n### Pi agent UX\n- Streaming chat with thinking blocks and tool use [E007].\n- Command palette for skills, prompt templates, built-in commands [E007].\n- Session fork/branch tree, context compaction, model switching [E007].\n- Package browser connected to pi.dev/packages [E007].\n\n### Desktop IDE features\n- Multiple workspaces, each with own Pi process [E007].\n- Review rail with permissions, approvals, changed files [E007].\n- File tree + CodeMirror 6 editor + diff viewer + file search [E007].\n- Terminal with ANSI colors [E007].\n\n### Multi-agent (optional)\n- Council planning with Pi + Claude + Codex; off by default; increases token cost [E008].\n\n### Platform\n- Release installers for Linux, macOS, and Windows (unsigned Windows builds documented) [E007].\n\n## Strengths\n\n- Broadest **cross-platform desktop** coverage in shortlist [E007].\n- Richest built-in IDE affordances (editor, packages browser, themes) [E007].\n- Unique council planning mode for high-stakes tasks [E008].\n\n## Limitations\n\n- Heavier Electron app; smaller community than pi-gui by stars/velocity [S001 vs S005].\n- Council mode adds cost/complexity; not pure Pi-only orchestration [E008].\n- Windows builds community-tested/unsigned — SmartScreen friction [E007].\n\n## Best for / Avoid if\n\n- **Best for:** Users needing Windows desktop or IDE-like Pi GUI with terminal + editor in one window.\n- **Avoid if:** You want the most Pi-native/Codex-style threading model (pi-gui) or minimal footprint.\n\n## Evidence appendix\n\n| Ref | Evidence |\n|-----|----------|\n| E007 | Feature list + Windows [S005] |\n| E008 | Council planning [S005] |\n"}, {"slug": "pi-gui", "title": "Pi Gui", "body": "# Solution Capability Report: pi-gui\n\n## Executive summary\n\n**pi-gui** ([minghinmatthewlam/pi-gui](https://github.com/minghinmatthewlam/pi-gui)) is the most mature open-source **native desktop shell** for the Pi coding agent. It wraps `@earendil-works/pi-coding-agent` through a dedicated `pi-sdk-driver` package, preserves Pi session files as source of truth, and ships Codex-style threading with git worktrees, multi-agent orchestration, terminal, and diff review [E001][E002]. MIT-licensed public beta for macOS (Apple Silicon) and Linux (AppImage) [E003].\n\n## Product overview\n\n- **What it is:** Electron desktop app (`apps/desktop`) with marketing site (`apps/website`).\n- **Runtime model:** UI shell only — agent execution stays in upstream Pi SDK; no forked agent loop [E001].\n- **License:** MIT [E003].\n- **Status (Jul 2026):** Active beta (`v0.1.0-beta.29` release line); ~580+ GitHub stars; 20 releases.\n\n## Core capabilities\n\n### Pi SDK fidelity\n- Uses `packages/pi-sdk-driver` adapter over `@earendil-works/pi-coding-agent` [E001].\n- Session management, model/auth setup, and agent execution delegated to upstream `pi` [E001].\n\n### Desktop UX\n- Threaded timeline of messages and collapsible tool calls [E002].\n- Git worktrees per thread for parallel isolated work [E002].\n- Integrated PTY terminal (`node-pty`) [E002].\n- Inline diff viewer (⌘/Ctrl+D) [E002].\n- `@` file mentions and image drag/drop in composer [E002].\n\n### Orchestration\n- Multi-agent orchestration: orchestrator thread can spin up child worker threads [E002].\n\n### Platform support\n- macOS Apple Silicon + Linux AppImage beta [E003].\n- No official Windows build documented in README (gap vs Pi Desktop).\n\n## Integrations & ecosystem\n\n- Multiple model providers via OAuth/API key in Settings [E002].\n- Skills & extensions management view for Pi ecosystem [E002].\n- Homepage install via GitHub Releases or Homebrew cask [S002].\n\n## Security & compliance\n\n- Local-first desktop; credentials follow Pi's standard `~/.pi/agent/` storage (inherited from SDK).\n- Beta software — expect permission re-confirmation on macOS after Homebrew upgrades [S002].\n\n## Pricing & TCO signals\n\n- Free OSS (MIT). User pays model API costs only.\n\n## Strengths\n\n- Best alignment with \"dedicated Pi GUI\" need: purpose-built desktop, not a generic assistant [E001][E002].\n- Strong session/worktree model for parallel agent threads [E002].\n- Active maintenance and community momentum (frequent beta releases) [S001].\n\n## Limitations\n\n- No Windows build in current beta scope [E003].\n- Electron footprint vs lighter Tauri alternatives.\n- Still prerelease — production hardening ongoing.\n\n## Best for / Avoid if\n\n- **Best for:** macOS/Linux developers wanting a Codex-style native Pi desktop with orchestration and worktrees.\n- **Avoid if:** You need Windows desktop today (consider Pi Desktop) or browser-only remote supervision (consider PI WEB).\n\n## Evidence appendix\n\n| Ref | Evidence |\n|-----|----------|\n| E001 | SDK driver architecture [S001] |\n| E002 | Feature list [S001] |\n| E003 | Beta platforms + MIT [S001][S002] |\n"}, {"slug": "pi-web", "title": "Pi Web", "body": "# Solution Capability Report: pi-web\n\n## Executive summary\n\n**PI WEB** ([jmfederico/pi-web](https://github.com/jmfederico/pi-web)) is the leading **browser-based control plane** for Pi Coding Agent. Sessions run in real server-side workspaces and stay alive after the browser disconnects, enabling laptop→phone→tablet supervision [E004][E005]. MIT-licensed; published on pi.dev as `@jmfederico/pi-web` with `pi-coding-agent` peer dependency [E006].\n\n## Product overview\n\n- **What it is:** TypeScript web UI + session daemon architecture (split-process).\n- **Runtime model:** Browser is control surface; agent runtimes live on machine/server [E004].\n- **License:** MIT [S003].\n- **Homepage:** https://pi-web.dev/ [S004].\n\n## Core capabilities\n\n### Persistence & remote dev\n- Keeps Pi sessions running in real repositories and git worktrees [E004].\n- Supervise multiple sessions in parallel [E004].\n- Register remote PI WEB runtimes as trusted machines; proxy projects/files/terminals [E005].\n\n### Pi integration\n- Peer dependency on `@earendil-works/pi-coding-agent` (>=0.74.0) [E006].\n- Installable as Pi package exposing `/pi-web` command [S009].\n\n### GUI features\n- Project/workspace management, file browser, terminals, session browser [S003].\n- Trusted browser-side plugins for workspace panels [S003].\n\n## Integrations & ecosystem\n\n- npm global install and Pi package registry [S009].\n- Remote machine mesh for dev boxes / workstations [E005].\n\n## Pricing & TCO signals\n\n- Free OSS. Requires self-hosted machine or server for remote use.\n\n## Strengths\n\n- Best multi-device and persistent-session story [E004][E005].\n- Strong fit for \"agent on server, UI in browser\" workflows [S004].\n\n## Limitations\n\n- Not a native desktop app — depends on running PI WEB server process.\n- More operational complexity than single-user Electron apps.\n- Separate from lighter local-only `agegr/pi-web` variant [S012].\n\n## Best for / Avoid if\n\n- **Best for:** Developers who want Pi sessions on a workstation/server and supervision from any browser/device.\n- **Avoid if:** You want a single-user offline-native desktop without running a web stack (choose pi-gui).\n\n## Evidence appendix\n\n| Ref | Evidence |\n|-----|----------|\n| E004 | Persistent workspaces [S003] |\n| E005 | Remote machines [S003] |\n| E006 | Peer dependency [S009] |\n"}], "decision_excerpt": "# Decision record — Pi GUI landscape (2026-07-10)\n\n**Decision:** Adopt **pi-gui** as the default OSS desktop GUI for daily Pi coding-agent work on macOS/Linux; pair with **PI WEB** when remote persistence is required and **Pi Desktop** when Windows desktop packaging is mandatory.\n\n**Status:** Proposed (research complete).\n\n**Drivers:** SDK fidelity [E001], mature threaded desktop UX [E002], MIT license [E003].\n\n**Rejected for default coding GUI:** OpenClaw (messaging-first assistant [E011][E012]).\n", "generated_by": "silver-deep-research/generate_report_spa.py"}</script>
