# SB Deep Research — phase single source of truth
# Aligns with SKILL.md DR-* steps and nested V-loop rollups.
version: "1.1.0"

phases:
  scope:
    id: DR-SCOPE
    name: Scope
    order: 1
    required_artifacts:
      - scope.md
    vloop_checks:
      - bounded question documented
      - assumptions listed
      - in/out scope defined
    repair_triggers:
      - scope too broad for mode budget

  plan:
    id: DR-PLAN
    name: Plan
    order: 2
    required_artifacts:
      - research-plan.md
    vloop_checks:
      - source classes identified
      - search strategy documented
      - mode rationale recorded
    repair_triggers:
      - missing retrieval strategy

  retrieve:
    id: DR-RETRIEVE
    name: Retrieve
    order: 3
    required_artifacts:
      - sources.jsonl
      - evidence.jsonl
    vloop_checks:
      - provider manifest recorded
      - source diversity met for mode
      - evidence spans persisted
    repair_triggers:
      - source count below mode threshold
      - evidence.jsonl empty after retrieval

  triangulate:
    id: DR-TRIANGULATE
    name: Score / Triangulate
    order: 4
    required_artifacts:
      - triangulation.md
    vloop_checks:
      - claims cross-checked across sources
      - admiralty grades recorded for key sources
      - contradictions flagged
    repair_triggers:
      - core claim single-sourced

  outline:
    id: DR-OUTLINE
    name: Outline / Refine
    order: 5
    required_artifacts:
      - outline.md
    vloop_checks:
      - findings map tied to evidence ids
      - outline reflects triangulation
    repair_triggers:
      - outline sections lack evidence refs

  synthesize:
    id: DR-SYNTHESIZE
    name: Synthesize
    order: 6
    required_artifacts:
      - research_report.md
      - claims.jsonl
    vloop_checks:
      - major claims extracted
      - draft report present
    repair_triggers:
      - claims.jsonl empty

  critique:
    id: DR-CRITIQUE
    name: Adversarial Review
    order: 7
    required_artifacts:
      - critique.md
    vloop_checks:
      - gaps and contradictions documented
      - loopback decision recorded
    repair_triggers:
      - ultradeep without critique.md

  refine:
    id: DR-REFINE
    name: Verify / Refresh
    order: 8
    required_artifacts:
      - research_report.md
    vloop_checks:
      - unsupported claims repaired or escalated
      - refresh targets addressed
    repair_triggers:
      - verify_claim_support failures

  package:
    id: DR-PACKAGE
    name: Package
    order: 9
    required_artifacts:
      - decision-record.md
      - handoff.md
      - vloop-rollup.json
    vloop_checks:
      - AF-DECIDE rollup complete
      - validation logs present
    repair_triggers:
      - validation failures after max repair loops

# Conditional artifacts by research_type (merged with base phase artifacts)
research_types:
  default:
    description: General research questions (no solution matrix)
  solution-landscape:
    description: Market survey, top-5 SCR deep dive, weighted comparison matrix
    default_mode: deep
    phase_artifacts:
      scope:
        add:
          - need_profile.json
      triangulate:
        add:
          - landscape/landscape-report.md
          - shortlist/shortlist.json
      synthesize:
        add:
          - comparison/comparison.json
          - comparison/comparison-matrix.md
      package:
        add:
          - report.html
  solution-compare:
    description: User-named N>=2 solutions; SCR each; skip market shortlist
    default_mode: deep
    phase_artifacts:
      scope:
        add:
          - need_profile.json
          - solutions_requested.json
      synthesize:
        add:
          - comparison/comparison.json
          - comparison/comparison-matrix.md
      package:
        add:
          - report.html

modes:
  quick:
    phases: [scope, retrieve, package]
    source_budget: 10
    critique_cycles: 0
    skip_phases: [plan, triangulate, outline, synthesize, critique, refine]

  standard:
    phases: [scope, plan, retrieve, triangulate, outline, synthesize, package]
    source_budget: 15
    critique_cycles: 0
    skip_phases: [critique, refine]

  deep:
    phases: [scope, plan, retrieve, triangulate, outline, synthesize, critique, refine, package]
    source_budget: 25
    critique_cycles: 2
    skip_phases: []

  ultradeep:
    phases: [scope, plan, retrieve, triangulate, outline, synthesize, critique, refine, package]
    source_budget: 30
    critique_cycles: 3
    skip_phases: []
    requires_critique_loopback: true

budgets:
  quick:
    max_sources: 10
    min_avg_credibility: 60
  standard:
    max_sources: 20
    min_avg_credibility: 60
  deep:
    max_sources: 30
    min_avg_credibility: 70
  ultradeep:
    max_sources: 40
    min_avg_credibility: 75
