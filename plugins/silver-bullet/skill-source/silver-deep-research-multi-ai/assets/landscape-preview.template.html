// ─── Theme system ─────────────────────────────────────────────────────────────
const THEME_STORAGE_KEY = 'sb-landscape-theme';

function sbCssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function sbChartTheme() {
  const seriesRaw = sbCssVar('--sb-chart-series');
  const series = seriesRaw ? seriesRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
  return {
    grid: sbCssVar('--sb-chart-grid') || '#e2e8f0',
    label: sbCssVar('--sb-chart-label') || '#64748b',
    ink: sbCssVar('--sb-ink') || '#1e293b',
    labelShadow: sbCssVar('--sb-chart-label-shadow') || 'rgba(255,255,255,0.92)',
    series: series.length ? series : getAvatarPalette(),
    quad: {
      leaders: sbCssVar('--sb-chart-quad-leaders') || '#e8f4fd',
      challengers: sbCssVar('--sb-chart-quad-challengers') || '#f0eaf8',
      visionaries: sbCssVar('--sb-chart-quad-visionaries') || '#fff3e6',
      niche: sbCssVar('--sb-chart-quad-niche') || '#f0f0f0',
    },
    zones: {
      leaders: sbCssVar('--sb-chart-zone-leaders') || 'rgba(90,150,210,0.42)',
      strong: sbCssVar('--sb-chart-zone-strong') || 'rgba(160,205,240,0.38)',
      mid: sbCssVar('--sb-chart-zone-mid') || 'rgba(215,235,250,0.58)',
      contenders: sbCssVar('--sb-chart-zone-contenders') || 'rgba(235,246,253,0.72)',
    },
    wave: {
      outer: sbCssVar('--sb-chart-wave-outer') || 'rgba(135,193,238,0.30)',
      mid: sbCssVar('--sb-chart-wave-mid') || 'rgba(195,225,248,0.44)',
      inner: sbCssVar('--sb-chart-wave-inner') || 'rgba(230,244,253,0.70)',
      stroke: sbCssVar('--sb-chart-wave-stroke') || 'rgba(75,145,200,0.38)',
      label: sbCssVar('--sb-chart-wave-label') || 'rgba(20,85,145,0.62)',
    },
    overlay: sbCssVar('--sb-chart-overlay') || 'rgba(15,23,42,0.22)',
  };
}

function sbWaveZoneFills() {
  // WAVE_ZONE_FILLS: durable marker for the rendered Forrester Wave zone palette.
  const z = sbChartTheme().zones;
  return { leaders: z.leaders, strong: z.strong, mid: z.mid, contenders: z.contenders };
}

function sbQuadrantFills() {
  const q = sbChartTheme().quad;
  return {
    'Leaders': q.leaders,
    'Challengers': q.challengers,
    'Visionaries': q.visionaries,
    'Niche Players': q.niche,
  };
}

function sbWaveQuadrantFills() {
  const z = sbWaveZoneFills();
  return {
    'Leaders': z.leaders,
    'Challengers': z.strong,
    'Visionaries': z.mid,
    'Niche Players': z.contenders,
  };
}

function themedSeriesPalette() {
  const themed = sbChartTheme().series;
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (dark) return themed;
  return (WAVE_COLORS && WAVE_COLORS.length) ? WAVE_COLORS : themed;
}

function sbQuadrantColors() {
  const s = themedSeriesPalette();
  return {
    'Leaders': s[0],
    'Challengers': s[1] || s[0],
    'Visionaries': s[2] || s[0],
    'Niche Players': s[s.length - 1] || s[0],
  };
}

function chartLabelFont(sizePx = 10) {
  return `500 ${sizePx}px "Roboto Condensed", sans-serif`;
}

function chartGridColor() {
  return sbChartTheme().grid;
}

function getAvatarPalette() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  return dark
    ? ['#4a7fb0','#6b96c4','#5b8fd4','#64748b','#475569','#3d5a80','#2f5597','#7d8fa8']
    : ['#1f3864','#2f5597','#3d6fa8','#5b7fa6','#64748b','#475569','#334155','#94a3b8'];
}

function applyChartScaleTheme(chart) {
  if (!chart?.options) return;
  const t = sbChartTheme();
  const scales = chart.options.scales || {};
  ['x', 'y', 'y1', 'y2'].forEach(axis => {
    const scale = scales[axis];
    if (!scale) return;
    if (scale.grid) scale.grid.color = t.grid;
    if (scale.title) scale.title.color = t.label;
    if (scale.ticks) scale.ticks.color = t.label;
  });
  const rScale = scales.r;
  if (rScale) {
    if (rScale.grid) rScale.grid.color = t.grid;
    if (rScale.angleLines) rScale.angleLines.color = t.grid;
    if (rScale.ticks) rScale.ticks.color = t.label;
    if (rScale.pointLabels) rScale.pointLabels.color = t.label;
  }
  chart.update('none');
}

function refreshThemeSurfaces() {
  const palette = getAvatarPalette();
  document.querySelectorAll('.vc-avatar').forEach((el, i) => {
    el.style.background = palette[i % palette.length];
  });
}

function refreshAllChartThemes() {
  if (typeof _charts !== 'undefined') {
    _charts.forEach(c => {
      applyChartScaleTheme(c);
      c.update('none');
    });
  }
}

function refreshChartLegendColors() {
  const palette = themedSeriesPalette();
  const quads = sbQuadrantColors();
  document.querySelectorAll('.chart-frame > div[style*="flex-wrap"]').forEach(row => {
    row.querySelectorAll('span').forEach(el => {
      const dot = el.querySelector('span[style*="border-radius:50%"]');
      if (!dot) return;
      const label = el.textContent.trim();
      const color = quads[label] || palette.find((_, i) => el.dataset.waveIdx == i);
      if (color) dot.style.background = color;
    });
  });
  document.querySelectorAll('[data-wave-idx]').forEach(el => {
    const idx = +el.dataset.waveIdx;
    const c = palette[idx % palette.length];
    const dot = el.querySelector('span');
    if (dot) {
      dot.style.background = c;
      dot.style.border = `2px solid ${c}88`;
    }
  });
  document.querySelectorAll('[data-vc-idx] span[style*="border-radius:50%"]').forEach((dot, i) => {
    const el = dot.closest('[data-vc-idx]');
    const idx = el ? +el.dataset.vcIdx : i;
    const series = [...VC_COMMERCIAL, ...VC_OSS];
    if (series[idx] && series[idx].color) dot.style.background = series[idx].color;
  });
}

function setTheme(theme, persist = true) {
  document.documentElement.setAttribute('data-theme', theme);
  if (persist) localStorage.setItem(THEME_STORAGE_KEY, theme);
  const btn = document.getElementById('themeToggle');
  if (btn) {
    btn.innerHTML = lucideIconHtml(theme === 'dark' ? 'sun' : 'moon', 'lucide-icon');
    btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    btn.title = theme === 'dark' ? 'Light mode' : 'Dark mode';
    refreshLucideIcons(btn);
  }
  refreshThemeSurfaces();
  if (typeof normalizeChartPalette === 'function') normalizeChartPalette();
  refreshChartLegendColors();
  refreshAllChartThemes();
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  setTheme(cur === 'dark' ? 'light' : 'dark');
}

function initTheme() {
  const stored = localStorage.getItem(THEME_STORAGE_KEY);
  const theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  setTheme(theme, false);
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  const btn = document.getElementById('themeToggle');
  if (btn) btn.addEventListener('click', toggleTheme);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      const fam = getComputedStyle(document.body).fontFamily || '';
      document.documentElement.setAttribute('data-font-family', fam);
      document.documentElement.setAttribute('data-font-ready', fam.toLowerCase().includes('roboto condensed') ? '1' : '0');
    });
  }
});

// ─── Chart data ─────────────────────────────────────────────────────────────
// Populated at runtime by bootstrapFromEmbedded → applyChartData (landscape_preview_render.py).
// No domain-specific defaults — each landscape supplies chart_data.json from synthesis.
let CHART_TITLES = {};
const MQ_DATA = [];
const MQ_COLORS = {};
const GMQ_DATA = [];
let GMQ_COLORS = {};
const WAVE_DATA = [];
let WAVE_COLORS = [];
const VC_KCFS = [];
const VC_COMMERCIAL = [];
const VC_OSS = [];

function hexAlpha(hex, alpha) {
  const h = String(hex || '#94a3b8').replace('#', '');
  if (h.length < 6) return `rgba(148,163,184,${alpha})`;
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function vendorChartColor(label) {
  const palette = themedSeriesPalette();
  const wi = WAVE_DATA.findIndex(d => d.label === label);
  if (wi >= 0) return palette[wi % palette.length];
  const labels = [...new Set([...MQ_DATA, ...GMQ_DATA, ...WAVE_DATA].map(d => d.label).filter(Boolean))];
  const i = labels.indexOf(label);
  return palette[(i >= 0 ? i : 0) % palette.length];
}

function normalizeChartPalette() {
  const quads = sbQuadrantColors();
  Object.keys(quads).forEach(k => {
    MQ_COLORS[k] = quads[k];
    GMQ_COLORS[k] = quads[k];
  });
  const palette = themedSeriesPalette();
  VC_COMMERCIAL.forEach((s, i) => { s.color = palette[i % palette.length]; });
  VC_OSS.forEach((s, i) => {
    s.color = palette[(i + VC_COMMERCIAL.length) % palette.length];
  });
}

function mqQuadrantRegions(mx, my, left, right, top, bottom) {
  const keys = Object.keys(MQ_COLORS);
  const quadFill = sbQuadrantFills();
  const GARTNER = {
    'Leaders':       { x1:mx, y1:top,  x2:right, y2:my,     lx:right-8, ly:top+14,    align:'right' },
    'Challengers':   { x1:left,y1:top, x2:mx,    y2:my,     lx:left+8,  ly:top+14,    align:'left'  },
    'Visionaries':   { x1:mx, y1:my,   x2:right, y2:bottom, lx:right-8, ly:bottom-8, align:'right' },
    'Niche Players': { x1:left,y1:my,  x2:mx,    y2:bottom, lx:left+8,  ly:bottom-8, align:'left'  },
  };
  if (keys.some(k => GARTNER[k])) {
    return keys.filter(k => GARTNER[k]).map(k => ({
      ...GARTNER[k], key: k, label: k.toUpperCase(), fill: quadFill[k] || (MQ_COLORS[k] || '#ccc') + '22',
    }));
  }
  const positions = [
    { x1:mx, y1:top,  x2:right, y2:my,     lx:right-8, ly:top+14,    align:'right' },
    { x1:left,y1:top, x2:mx,    y2:my,     lx:left+8,  ly:top+14,    align:'left'  },
    { x1:left,y1:my,  x2:mx,    y2:bottom, lx:left+8,  ly:bottom-8, align:'left'  },
    { x1:mx, y1:my,   x2:right, y2:bottom, lx:right-8, ly:bottom-8, align:'right' },
  ];
  return keys.slice(0, 4).map((k, i) => ({
    ...positions[i], key: k, label: k.toUpperCase(), fill: (MQ_COLORS[k] || '#ccc') + '22',
  }));
}

const GMQ_QUADRANT_REGIONS = (mx, my, left, right, top, bottom) => [
  { key: 'Leaders',       x1: mx,   y1: top,    x2: right, y2: my,     label: 'LEADERS' },
  { key: 'Challengers',   x1: left, y1: top,    x2: mx,    y2: my,     label: 'CHALLENGERS' },
  { key: 'Visionaries',   x1: mx,   y1: my,     x2: right, y2: bottom, label: 'VISIONARIES' },
  { key: 'Niche Players', x1: left, y1: my,     x2: mx,    y2: bottom, label: 'NICHE PLAYERS' },
];

function _chartPointerPos(chart, nativeEvent) {
  if (typeof Chart !== 'undefined' && Chart.helpers && Chart.helpers.getRelativePosition) {
    return Chart.helpers.getRelativePosition(nativeEvent, chart);
  }
  const rect = chart.canvas.getBoundingClientRect();
  return { x: nativeEvent.clientX - rect.left, y: nativeEvent.clientY - rect.top };
}

function _hitTestQuadrantRegions(regions, x, y) {
  for (const r of regions) {
    if (x >= r.x1 && x <= r.x2 && y >= r.y1 && y <= r.y2) return r;
  }
  return null;
}

function _waveZoneAtPoint(chart, x, y) {
  const ca = chart.chartArea;
  if (!ca || !ca.width) return null;
  const cx = ca.left;
  const cy = ca.bottom;
  if (x < cx || y > cy) return null;
  const dist = Math.hypot(x - cx, y - cy);
  const diag = Math.hypot(ca.width, ca.height);
  const r1 = diag * 0.37;
  const r2 = diag * 0.67;
  let key, label;
  if (dist <= r1) { key = 'Contenders'; label = 'CONTENDERS'; }
  else if (dist <= r2) { key = 'Strong Performers'; label = 'STRONG PERFORMERS'; }
  else { key = 'Leaders'; label = 'LEADERS'; }
  const pad = 8;
  return { key, label, x1: cx + pad, y1: cy - dist, x2: x, y2: cy - pad };
}

function _waveZoneForVendor(chart, d) {
  if (!chart || !chart.scales || !d) return 'Leaders';
  const px = chart.scales.x.getPixelForValue(d.strategy);
  const py = chart.scales.y.getPixelForValue(d.offering);
  const hit = _waveZoneAtPoint(chart, px, py);
  return hit ? hit.key : 'Leaders';
}

// ─── Non-overlapping point labels (scatter / bubble / line endpoints) ────────
const _LABEL_PAD = 3;
const _POINT_LABEL_PAD = 4;
const _LEADER_COLOR = () => sbChartTheme().overlay;

function _measureLabelText(ctx, text) {
  ctx.save();
  ctx.font = chartLabelFont(10);
  const m = ctx.measureText(text);
  const h = (m.actualBoundingBoxAscent || 10) + (m.actualBoundingBoxDescent || 2);
  ctx.restore();
  return { w: m.width, h };
}

function _labelRectsOverlap(a, b, pad = 2) {
  return !(a.x + a.w + pad < b.x || b.x + b.w + pad < a.x ||
           a.y + a.h + pad < b.y || b.y + b.h + pad < a.y);
}

function _pointForbiddenRect(px, py, r, pad = _POINT_LABEL_PAD) {
  const radius = (r || 9) + pad;
  return { x: px - radius, y: py - radius, w: radius * 2, h: radius * 2 };
}

function _rectOverlapsPoint(rect, px, py, r, pad = _POINT_LABEL_PAD) {
  return _labelRectsOverlap(rect, _pointForbiddenRect(px, py, r, pad), 0);
}

function _rectOverlapsAnyPoint(rect, points, pad = _POINT_LABEL_PAD) {
  for (const pt of points) {
    if (_rectOverlapsPoint(rect, pt.px, pt.py, pt.r, pad)) return true;
  }
  return false;
}

function _labelOffsetRing() {
  if (_labelOffsetRing._c) return _labelOffsetRing._c;
  const angles = [90, 270, 0, 180, 45, 135, 225, 315, 60, 120, 240, 300, 30, 150, 210, 330];
  const dists = [14, 22, 32, 44, 58, 74, 92, 112, 134];
  const out = [];
  for (const d of dists) {
    for (const ang of angles) {
      const rad = ang * Math.PI / 180;
      const dx = Math.cos(rad) * d;
      const dy = -Math.sin(rad) * d;
      let align = 'center', baseline = 'bottom';
      if (Math.abs(dx) >= Math.abs(dy) * 0.75) {
        align = dx >= 0 ? 'left' : 'right';
        baseline = 'middle';
      } else if (dy > 0) {
        baseline = 'top';
      }
      out.push({ dx, dy, align, baseline });
    }
  }
  _labelOffsetRing._c = out;
  return out;
}

function _rectInChartArea(rect, area, pad = 1) {
  return rect.x >= area.left + pad && rect.y >= area.top + pad &&
         rect.x + rect.w <= area.right - pad && rect.y + rect.h <= area.bottom - pad;
}

function _clampRectToChartArea(rect, area, pad = 1) {
  const maxW = Math.max(8, area.right - area.left - pad * 2);
  const maxH = Math.max(8, area.bottom - area.top - pad * 2);
  const w = Math.min(rect.w, maxW);
  const h = Math.min(rect.h, maxH);
  const x = Math.min(area.right - pad - w, Math.max(area.left + pad, rect.x));
  const y = Math.min(area.bottom - pad - h, Math.max(area.top + pad, rect.y));
  return { x, y, w, h };
}

function _labelBBox(px, py, w, h, off) {
  let x = px + off.dx;
  let y = py + off.dy;
  if (off.align === 'center') x -= w / 2;
  else if (off.align === 'right') x -= w;
  if (off.baseline === 'middle') y -= h / 2;
  else if (off.baseline === 'bottom') y -= h;
  return { x, y, w, h };
}

function _collectScatterLabelItems(chart, getLabel) {
  const items = [];
  chart.data.datasets.forEach((ds, dsi) => {
    const meta = chart.getDatasetMeta(dsi);
    if (!meta.visible) return;
    meta.data.forEach((elem, pi) => {
      const raw = ds.data[pi];
      if (!raw || elem.hidden) return;
      const text = getLabel(raw, ds, dsi, pi);
      if (!text) return;
      const r = elem.options?.radius ?? (typeof elem.width === 'number' ? elem.width / 2 : 9);
      items.push({
        key: `${dsi}:${pi}`,
        text,
        px: elem.x,
        py: elem.y,
        dsi,
        pi,
        color: typeof ds.borderColor === 'string' ? ds.borderColor : sbChartTheme().ink,
        r,
      });
    });
  });
  return items;
}

function _resolveLabelCollisions(chart, items, chartArea) {
  const ctx = chart.ctx;
  const placed = [];
  const layout = [];
  const sorted = [...items].sort((a, b) => a.py - b.py || a.px - b.px);
  const pointObstacles = items.map(it => ({ px: it.px, py: it.py, r: it.r }));
  const offsets = _labelOffsetRing();
  const area = {
    left: chartArea.left,
    right: chartArea.right,
    top: chartArea.top,
    bottom: chartArea.bottom,
  };

  function fromRect(rect, w, h, off) {
    let align = off.align, baseline = off.baseline;
    let labelX, labelY;
    if (align === 'center') labelX = rect.x + w / 2;
    else if (align === 'right') labelX = rect.x + w;
    else labelX = rect.x;
    if (baseline === 'middle') labelY = rect.y + h / 2;
    else if (baseline === 'bottom') labelY = rect.y + h;
    else labelY = rect.y;
    return { align, baseline, labelX, labelY };
  }

  for (const item of sorted) {
    const { w, h } = _measureLabelText(ctx, item.text);
    let best = null;
    for (let i = 0; i < offsets.length; i++) {
      const off = offsets[i];
      const rect = _clampRectToChartArea(_labelBBox(item.px, item.py, w, h, off), area);
      if (!_rectInChartArea(rect, area)) continue;
      let collides = false;
      for (const p of placed) {
        if (_labelRectsOverlap(rect, p, _LABEL_PAD)) { collides = true; break; }
      }
      if (!collides && _rectOverlapsAnyPoint(rect, pointObstacles)) collides = true;
      if (!collides) {
        best = { rect, off, collides: false };
        break;
      }
      if (!best) best = { rect, off, collides: true };
    }

    let rect = best ? best.rect : _clampRectToChartArea(
      { x: item.px - w / 2, y: item.py - h - 8, w, h }, area
    );
    if (best && best.collides) {
      const dirs = [[0,-8],[0,8],[8,0],[-8,0],[6,-6],[-6,-6],[6,6],[-6,6]];
      outer: for (let g = 0; g < 18; g++) {
        let hit = placed.some(p => _labelRectsOverlap(rect, p, _LABEL_PAD));
        if (!hit && !_rectOverlapsAnyPoint(rect, pointObstacles) && _rectInChartArea(rect, area)) break;
        for (const [dx, dy] of dirs) {
          const nxt = _clampRectToChartArea({ x: rect.x + dx, y: rect.y + dy, w: rect.w, h: rect.h }, area);
          const nHit = placed.some(p => _labelRectsOverlap(nxt, p, 1));
          if (!nHit && _rectInChartArea(nxt, area)) {
            rect = nxt;
            if (!_rectOverlapsAnyPoint(nxt, pointObstacles)) break outer;
          }
        }
        rect = _clampRectToChartArea(rect, area);
      }
    }
    rect = _clampRectToChartArea(rect, area);
    const off = best ? best.off : { dx: 0, dy: -16, align: 'center', baseline: 'bottom' };
    const pos = fromRect(rect, w, h, off);
    layout.push({
      ...item,
      w,
      h,
      visible: true,
      rect,
      labelX: pos.labelX,
      labelY: pos.labelY,
      align: pos.align,
      baseline: pos.baseline,
      leader: Math.hypot((rect.x + rect.w / 2) - item.px, (rect.y + rect.h / 2) - item.py) > 10,
    });
    placed.push(rect);
  }
  return layout;
}

function _drawResolvedLabels(chart, layout, colorFn) {
  const { ctx, chartArea } = chart;
  const hover = chart._hoverLabelKey;
  ctx.save();
  if (chartArea) {
    ctx.beginPath();
    ctx.rect(chartArea.left, chartArea.top, chartArea.right - chartArea.left, chartArea.bottom - chartArea.top);
    ctx.clip();
  }
  for (const L of layout) {
    const show = L.visible || (hover && hover === L.key);
    if (!show) continue;
    const color = colorFn ? colorFn(L) : L.color;
    if (L.leader && L.rect) {
      ctx.strokeStyle = _LEADER_COLOR();
      ctx.lineWidth = 0.75;
      ctx.beginPath();
      ctx.moveTo(L.anchorX ?? L.px, L.anchorY ?? L.py);
      ctx.lineTo(L.rect.x + L.rect.w / 2, L.rect.y + L.rect.h / 2);
      ctx.stroke();
    }
    ctx.font = chartLabelFont(10);
    ctx.fillStyle = color;
    ctx.textAlign = L.align;
    ctx.textBaseline = L.baseline;
    ctx.shadowColor = sbChartTheme().labelShadow;
    ctx.shadowBlur = 4;
    ctx.fillText(L.text, L.labelX, L.labelY);
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function vendorUrlForLabel(label) {
  if (!label) return '';
  if (typeof HOMEPAGE_VENDOR_URLS === 'object' && HOMEPAGE_VENDOR_URLS[label]) return HOMEPAGE_VENDOR_URLS[label];
  if (typeof VENDOR_URLS === 'object' && VENDOR_URLS[label]) return VENDOR_URLS[label];
  const hit = (LINK_PAIRS || []).find(([name]) => name === label);
  return hit ? hit[1] : '';
}

function _openVendorLabelUrl(label) {
  const url = vendorUrlForLabel(label);
  if (url) window.open(url, '_blank', 'noopener,noreferrer');
}

function _labelHitTest(chart, x, y) {
  if (!chart._labelLayout) return null;
  for (const L of chart._labelLayout) {
    if (L.visible === false) continue;
    const hitX = L.px ?? L.anchorX;
    const hitY = L.py ?? L.anchorY;
    if (Math.hypot(x - hitX, y - hitY) < (L.r || 12) + 8) return L;
  }
  return null;
}
function _trackLabelHover(chart, event) {
  if (!chart._labelLayout) return;
  let found = null;
  const { x, y } = event;
  const hit = _labelHitTest(chart, x, y);
  if (hit) found = hit.key;
  if (chart._hoverLabelKey !== found) {
    chart._hoverLabelKey = found;
    chart.draw();
  }
}

function createCollidingPointLabelsPlugin(getLabel, colorFn) {
  return {
    id: 'collidingPointLabels',
    afterDatasetsDraw(chart) {
      const { chartArea } = chart;
      if (!chartArea) return;
      const items = _collectScatterLabelItems(chart, getLabel);
      chart._labelLayout = _resolveLabelCollisions(chart, items, chartArea);
      _drawResolvedLabels(chart, chart._labelLayout, colorFn);
    },
    afterEvent(chart, args) {
      const ev = args.event;
      if (ev.type === 'click' && args.inChartArea) {
        const hit = _labelHitTest(chart, ev.x, ev.y);
        if (hit && hit.text) _openVendorLabelUrl(hit.text);
      }
      if (args.inChartArea) _trackLabelHover(chart, ev);
      else if (chart._hoverLabelKey) {
        chart._hoverLabelKey = null;
        chart.draw();
      }
    },
  };
}

function _resolveVerticalLabelCollisions(chart, items, chartArea) {
  const ctx = chart.ctx;
  const sorted = [...items].sort((a, b) => a.py - b.py);
  const placed = [];
  const layout = [];
  const pointObstacles = items.map(it => ({
    px: it.anchorX ?? it.px,
    py: it.anchorY ?? it.py,
    r: it.r,
  }));
  for (const item of sorted) {
    const { w, h } = _measureLabelText(ctx, item.text);
    let y = item.py - h / 2;
    const x = item.px;
    const rect = () => ({ x, y, w, h });
    let guard = 0;
    while (guard++ < 40) {
      let hit = false;
      for (const p of placed) {
        if (_labelRectsOverlap(rect(), p, _LABEL_PAD)) {
          y = p.y + p.h + _LABEL_PAD;
          hit = true;
          break;
        }
      }
      if (!hit && _rectOverlapsAnyPoint(rect(), pointObstacles)) {
        y += h / 2 + _POINT_LABEL_PAD + 8;
        hit = true;
      }
      if (!hit) break;
    }
    const r = { x, y, w, h };
    if (y + h > chartArea.bottom + 2) y = chartArea.bottom - h;
    if (y < chartArea.top - 2) y = chartArea.top;
    r.y = y;
    placed.push(r);
    layout.push({
      ...item,
      w,
      h,
      visible: true,
      rect: r,
      labelX: x,
      labelY: y + h / 2,
      align: 'left',
      baseline: 'middle',
      leader: true,
      px: item.anchorX ?? item.px,
      py: item.anchorY ?? item.py,
    });
  }
  return layout;
}

function createLineEndpointLabelsPlugin() {
  return {
    id: 'lineEndpointLabels',
    afterDatasetsDraw(chart) {
      const { chartArea } = chart;
      if (!chartArea) return;
      const xScale = chart.scales.x;
      const yScale = chart.scales.y;
      const labels = chart.data.labels || [];
      if (!labels.length) return;
      const lastIdx = labels.length - 1;
      const items = [];
      chart.data.datasets.forEach((ds, dsi) => {
        const meta = chart.getDatasetMeta(dsi);
        if (meta.hidden) return;
        const val = ds.data[lastIdx];
        if (val == null || Number.isNaN(val)) return;
        const anchorX = xScale.getPixelForValue(lastIdx);
        const anchorY = yScale.getPixelForValue(val);
        items.push({
          key: `vc:${dsi}`,
          text: ds.label,
          px: anchorX + 8,
          py: anchorY,
          anchorX,
          anchorY,
          dsi,
          color: typeof ds.borderColor === 'string' ? ds.borderColor : sbChartTheme().ink,
          r: 4,
        });
      });
      const labelArea = {
        left: chartArea.left,
        right: chartArea.right + 96,
        top: chartArea.top - 8,
        bottom: chartArea.bottom + 8,
      };
      chart._labelLayout = _resolveLabelCollisions(chart, items, labelArea);
      _drawResolvedLabels(chart, chart._labelLayout, L => L.color);
    },
    afterEvent(chart, args) {
      const ev = args.event;
      if (ev.type === 'click' && args.inChartArea) {
        const hit = _labelHitTest(chart, ev.x, ev.y);
        if (hit && hit.text) _openVendorLabelUrl(hit.text);
      }
      if (args.inChartArea) _trackLabelHover(chart, ev);
      else if (chart._hoverLabelKey) {
        chart._hoverLabelKey = null;
        chart.draw();
      }
    },
  };
}

// ─── Chart registry to destroy on reload ───────────────────────────────────
const _charts = [];
let _chartSeq = 0;
function nextChartCanvasId(prefix) {
  _chartSeq += 1;
  return `${prefix}-${_chartSeq}`;
}
function destroyCharts() {
  _charts.forEach(c => c.destroy());
  _charts.length = 0;
  _chartSeq = 0;
}

function resizeAllCharts() {
  _charts.forEach(c => { try { c.resize(); } catch (_) { /* chart torn down */ } });
}

function whenChartParentReady(canvas, fn) {
  const wrap = canvas.closest('.chart-canvas-wrap') || canvas.parentElement;
  const attempt = () => {
    const w = wrap ? wrap.clientWidth : 0;
    if (w < 48) { requestAnimationFrame(attempt); return; }
    fn();
    requestAnimationFrame(() => resizeAllCharts());
  };
  requestAnimationFrame(attempt);
}

let _chartResizeObs = null;
function setupChartResizeObserver() {
  if (_chartResizeObs) _chartResizeObs.disconnect();
  if (typeof ResizeObserver === 'undefined') {
    window.addEventListener('resize', resizeAllCharts, { passive: true });
    return;
  }
  _chartResizeObs = new ResizeObserver(() => resizeAllCharts());
  document.querySelectorAll('.chart-canvas-wrap, #main').forEach(el => _chartResizeObs.observe(el));
  window.addEventListener('resize', resizeAllCharts, { passive: true });
}

function syncExportBarClearance() {
  const bar = document.getElementById('exportBar');
  const main = document.getElementById('main');
  if (!bar || !main) return;
  requestAnimationFrame(() => {
    const inFlow = bar.classList.contains('export-bar--flow');
    if (inFlow) {
      document.documentElement.style.setProperty('--sb-export-bar-clearance', '24px');
      main.style.paddingBottom = '40px';
      return;
    }
    const barH = bar.offsetHeight;
    const barRect = bar.getBoundingClientRect();
    const bottomGap = Math.max(0, window.innerHeight - barRect.bottom);
    const clearance = Math.ceil(barH + bottomGap + 20);
    document.documentElement.style.setProperty('--sb-export-bar-clearance', clearance + 'px');
    const minPad = window.innerWidth <= 480 ? 152 : (window.innerWidth <= 768 ? 124 : 72);
    const padBottom = Math.max(clearance + 40, minPad);
    main.style.paddingBottom = padBottom + 'px';
  });
}

function layoutExportBarForViewport() {
  const bar = document.getElementById('exportBar');
  const main = document.getElementById('main');
  const topbar = document.querySelector('.topbar-chrome');
  if (!bar || !main) return;
  const narrow = window.matchMedia('(max-width: 900px)').matches;
  if (narrow) {
    if (bar.parentElement !== main) main.appendChild(bar);
    bar.classList.add('export-bar--flow');
    if (topbar && !document.getElementById('topbarExportCluster')) {
      const cluster = document.createElement('div');
      cluster.id = 'topbarExportCluster';
      cluster.className = 'topbar-export-cluster';
      ['copyGdocsBtn', 'pdfExportBtn', 'compareBtn'].forEach((id) => {
        const btn = document.getElementById(id);
        if (btn) cluster.appendChild(btn);
      });
      topbar.insertBefore(cluster, document.getElementById('themeToggle'));
    }
    bar.style.display = 'none';
  } else {
    if (bar.parentElement !== document.body) document.body.appendChild(bar);
    bar.classList.remove('export-bar--flow');
    bar.style.display = 'flex';
    const cluster = document.getElementById('topbarExportCluster');
    if (cluster) {
      ['copyGdocsBtn', 'pdfExportBtn', 'compareBtn'].forEach((id) => {
        const btn = document.getElementById(id);
        if (btn) bar.appendChild(btn);
      });
      cluster.remove();
    }
  }
  syncExportBarClearance();
}

function syncTopChrome() {
  const navEl = document.getElementById('solutionNav');
  const main = document.getElementById('main');
  const bc = document.getElementById('breadcrumb');
  const rp = document.getElementById('readProgress');
  if (!navEl || !main) return;
  requestAnimationFrame(() => {
    const h = navEl.offsetHeight;
    const bcH = bc ? bc.offsetHeight : 0;
    const chromeBottom = h + bcH;
    document.documentElement.style.setProperty('--sb-sticky-thead-top', chromeBottom + 'px');
    if (bc) bc.style.top = h + 'px';
    if (rp) rp.style.top = Math.max(0, h - 1) + 'px';
    main.style.paddingTop = (h + 40) + 'px';
    syncExportBarClearance();
    if (typeof resizeAllCharts === 'function') resizeAllCharts();
  });
}

function setupNarrowLayoutToggles() {
  const mq = window.matchMedia('(max-width: 900px)');
  const sidebarBtn = document.getElementById('sidebarToggle');
  const snavBtn = document.getElementById('snavToggle');
  const snav = document.getElementById('solutionNav');
  const SIDEBAR_STORAGE_KEY = 'sb-landscape-sidebar';

  const updateSidebarIcon = () => {
    if (!sidebarBtn) return;
    const narrow = mq.matches;
    const open = narrow
      ? document.body.classList.contains('sb-sidebar-open')
      : !document.body.classList.contains('sb-sidebar-collapsed');
    sidebarBtn.innerHTML = lucideIconHtml(open ? 'panel-left-close' : 'panel-left', 'lucide-icon');
    sidebarBtn.setAttribute('aria-label', open ? 'Hide contents' : 'Show contents');
    refreshLucideIcons(sidebarBtn);
  };

  const syncNarrowMode = () => {
    const narrow = mq.matches;
    if (narrow) {
      document.body.classList.remove('sb-sidebar-collapsed');
    } else {
      document.body.classList.remove('sb-sidebar-open');
      if (localStorage.getItem(SIDEBAR_STORAGE_KEY) === '1') {
        document.body.classList.add('sb-sidebar-collapsed');
      }
    }
    if (snav && narrow && !snav.dataset.userToggled) {
      snav.classList.add('snav-collapsed');
      if (snavBtn) snavBtn.setAttribute('aria-expanded', 'false');
    }
    updateSidebarIcon();
    syncTopChrome();
  };
  syncNarrowMode();
  if (mq.addEventListener) mq.addEventListener('change', syncNarrowMode);
  else mq.addListener(syncNarrowMode);

  if (sidebarBtn) {
    sidebarBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const narrow = mq.matches;
      if (narrow) {
        document.body.classList.toggle('sb-sidebar-open');
      } else {
        const collapsed = document.body.classList.toggle('sb-sidebar-collapsed');
        localStorage.setItem(SIDEBAR_STORAGE_KEY, collapsed ? '1' : '0');
      }
      updateSidebarIcon();
      syncTopChrome();
    });
  }
  document.addEventListener('click', e => {
    if (!mq.matches || !document.body.classList.contains('sb-sidebar-open')) return;
    const sb = document.getElementById('sidebar');
    if (e.target === sidebarBtn || sb?.contains(e.target)) return;
    document.body.classList.remove('sb-sidebar-open');
    updateSidebarIcon();
    syncTopChrome();
  });

  if (snavBtn && snav) {
    snavBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const collapsed = snav.classList.toggle('snav-collapsed');
      snav.dataset.userToggled = '1';
      snavBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      const chev = snavBtn.querySelector('.snav-chevron');
      if (chev) {
        chev.setAttribute('data-lucide', collapsed ? 'chevron-down' : 'chevron-up');
        refreshLucideIcons(snavBtn);
      }
      syncTopChrome();
    });
  }
}

// ─── Hyperlinks ──────────────────────────────────────────────────────────────
// Populated from embedded chart_data.link_pairs at runtime (no domain-specific defaults).
let LINK_PAIRS = [];
function linkify() {
  const sorted = [...LINK_PAIRS].sort((a, b) => b[0].length - a[0].length);
  const lu = new Map(sorted.map(([t, u]) => [t, u]));
  const pat = sorted.map(([t]) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
  const re = new RegExp(`\\b(${pat})\\b`, 'g');
  const content = document.getElementById('content');
  const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      let el = node.parentElement;
      while (el && el !== content) {
        if (['A','CODE','PRE','SCRIPT','STYLE','H1','H2','H3','H4'].includes(el.tagName))
          return NodeFilter.FILTER_REJECT;
        el = el.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  for (const tn of nodes) {
    const txt = tn.textContent;
    re.lastIndex = 0;
    if (!re.test(txt)) continue;
    re.lastIndex = 0;
    const html = txt.replace(re, m => {
      const url = lu.get(m);
      return url
        ? `<a class="vname-link" href="${url}" target="_blank" rel="noopener noreferrer">${m}</a>`
        : m;
    });
    if (html !== txt) {
      const sp = document.createElement('span');
      sp.innerHTML = html;
      tn.parentNode.replaceChild(sp, tn);
    }
  }
}

function _trimUrlTrail(raw) {
  let url = String(raw || '');
  let trail = '';
  while (url && /[.,;:!?]$/.test(url)) {
    trail = url.slice(-1) + trail;
    url = url.slice(0, -1);
  }
  while (url.endsWith(')') && (url.split('(').length - 1) < (url.split(')').length - 1)) {
    trail = ')' + trail;
    url = url.slice(0, -1);
  }
  return [url, trail];
}

/** Wrap leftover bare http(s) URLs in text nodes (including CODE). Skip existing <a>. */
function linkifyBareHttpUrls(root) {
  const content = root && root.querySelectorAll ? root : document.getElementById('content');
  if (!content) return;
  const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      let el = node.parentElement;
      while (el && el !== content) {
        if (['A', 'SCRIPT', 'STYLE'].includes(el.tagName)) return NodeFilter.FILTER_REJECT;
        el = el.parentElement;
      }
      return /https?:\/\//i.test(node.textContent || '') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  const re = /https?:\/\/[^\s<>"'`\\]+/gi;
  for (const tn of nodes) {
    const txt = tn.textContent || '';
    re.lastIndex = 0;
    if (!re.test(txt)) continue;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0;
    let m;
    while ((m = re.exec(txt))) {
      if (m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
      const [url, trail] = _trimUrlTrail(m[0]);
      if (/^https?:\/\//i.test(url)) {
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = url;
        frag.appendChild(a);
        if (trail) frag.appendChild(document.createTextNode(trail));
      } else {
        frag.appendChild(document.createTextNode(m[0]));
      }
      last = m.index + m[0].length;
    }
    if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
    tn.parentNode.replaceChild(frag, tn);
  }
}


// ─── Chart → vendor card navigation ─────────────────────────────────────────
let VENDOR_SLUG_MAP = {};

function _chartNormLabel(name) {
  return String(name || '').replace(/^\d+\.\s*/, '').replace(/\s*\([^)]*\)\s*$/, '').trim();
}

function _slugify(label) {
  return String(label || '').toLowerCase()
    .replace(/\s*\([^)]*\)\s*/g, '')
    .replace(/[^\w\s-]/g, '')
    .trim()
    .replace(/[\s_]+/g, '-');
}

/** Market-scoped DOM id: vendor-{slug}--{marketId} when market known, else vendor-{slug}. */
function _vendorCardDomId(slug, marketId) {
  const s = String(slug || '').trim();
  if (!s) return '';
  const mid = String(marketId || '').trim();
  return mid ? ('vendor-' + s + '--' + mid) : ('vendor-' + s);
}

function _marketIdFromHeadingText(text) {
  const t = String(text || '').toLowerCase();
  const charts = (typeof MARKET_CHARTS === 'object' && MARKET_CHARTS) ? MARKET_CHARTS : {};
  for (const [mid, chart] of Object.entries(charts)) {
    const dn = String((chart && chart.market_display_name) || '').toLowerCase();
    if (dn && t.includes(dn)) return String(mid);
    const role = String((chart && chart.market_role) || '');
    if (role && t.includes(role + ' market')) return String(mid);
  }
  return '';
}

function _findPrecedingH2(el) {
  let n = el;
  while (n) {
    if (n.tagName === 'H2') return n;
    n = n.previousElementSibling;
  }
  return null;
}

function _resolveMarketIdFromNode(node) {
  if (!node) return '';
  if (node.dataset && node.dataset.market) return String(node.dataset.market);
  if (node.tagName === 'H2' || node.tagName === 'H1') {
    return _marketIdFromHeadingText(node.textContent);
  }
  // Prefer the heading's own text (3.2.1 Plugins — Positioning Matrix) over a
  // generic parent H2 such as "3. Competitive Positioning — Analyst Frameworks".
  const fromSelf = _marketIdFromHeadingText(node.textContent);
  if (fromSelf) return fromSelf;
  const h2 = _findPrecedingH2(node);
  if (h2) {
    const fromH2 = _marketIdFromHeadingText(h2.textContent);
    if (fromH2) return fromH2;
  }
  let n = node;
  while (n) {
    const mid = _marketIdFromHeadingText(n.textContent);
    if (mid) return mid;
    n = n.previousElementSibling;
  }
  return '';
}

function _cloneChartRecord(d) {
  if (!d || typeof d !== 'object') return d;
  const out = Object.assign({}, d);
  if (Array.isArray(d.data)) out.data = d.data.slice();
  return out;
}

function _cloneChartRecords(arr) {
  return (Array.isArray(arr) ? arr : []).map(_cloneChartRecord);
}

/** Snapshot per-market chart arrays at inject time. whenChartParentReady is rAF-deferred
 *  and injectCharts restores PRIMARY (APO) globals before those callbacks run. */
function _marketChartSource(anchor) {
  const mid = _resolveMarketIdFromNode(anchor) || '';
  const charts = (typeof MARKET_CHARTS === 'object' && MARKET_CHARTS) ? MARKET_CHARTS : {};
  const src = (mid && charts[mid]) ? charts[mid] : null;
  const titles = Object.assign({}, (src && src.titles) || CHART_TITLES || {});
  return {
    marketId: mid,
    titles,
    mq_data: _cloneChartRecords((src && src.mq_data) || MQ_DATA),
    gmq_data: _cloneChartRecords((src && src.gmq_data) || (src && src.mq_data) || GMQ_DATA),
    wave_data: _cloneChartRecords((src && src.wave_data) || WAVE_DATA),
    vc_kcfs: ((src && src.vc_kcfs) || VC_KCFS || []).slice(),
    vc_commercial: _cloneChartRecords((src && src.vc_commercial) || VC_COMMERCIAL),
    vc_oss: _cloneChartRecords((src && src.vc_oss) || VC_OSS),
    vendor_buckets: (src && src.vendor_buckets) || VENDOR_BUCKETS || {},
  };
}

function _seriesColorFromPayload(label, payload) {
  const palette = themedSeriesPalette();
  const wave = (payload && payload.wave_data) || [];
  const wi = wave.findIndex(d => d && d.label === label);
  if (wi >= 0) return palette[wi % palette.length];
  const labels = [...new Set([
    ...((payload && payload.mq_data) || []),
    ...((payload && payload.gmq_data) || []),
    ...wave,
  ].map(d => d && d.label).filter(Boolean))];
  const i = labels.indexOf(label);
  return palette[(i >= 0 ? i : 0) % palette.length];
}

function _marketShortLabel(marketId) {
  const mid = String(marketId || '');
  if (mid === 'apo') return 'APO';
  if (mid === 'sdlc-plugins') return 'Plugins';
  if (mid === 'agentic-sdlc-saas') return 'SaaS';
  const chart = (typeof MARKET_CHARTS === 'object' && MARKET_CHARTS) ? MARKET_CHARTS[mid] : null;
  const dn = chart && chart.market_display_name;
  if (dn) {
    const paren = String(dn).match(/\(([^)]+)\)/);
    if (paren) return paren[1];
    return String(dn).split(/\s+/).slice(0, 2).join(' ');
  }
  return mid;
}

function _lookupSlugFromCharts(label) {
  const norm = _chartNormLabel(label);
  for (const d of [...MQ_DATA, ...GMQ_DATA, ...WAVE_DATA]) {
    if (!d) continue;
    const dl = _chartNormLabel(d.label);
    if (d.label === label || dl === norm || d.slug === label) return d.slug || _slugify(dl);
  }
  for (const s of [...VC_COMMERCIAL, ...VC_OSS]) {
    if (!s) continue;
    const sl = _chartNormLabel(s.label);
    if (s.label === label || sl === norm || s.slug === label) return s.slug || _slugify(sl);
  }
  // Prefer per-market chart points when global arrays were swapped.
  if (typeof MARKET_CHARTS === 'object' && MARKET_CHARTS) {
    for (const chart of Object.values(MARKET_CHARTS)) {
      if (!chart) continue;
      for (const d of [...(chart.mq_data || []), ...(chart.gmq_data || []), ...(chart.wave_data || [])]) {
        if (!d) continue;
        const dl = _chartNormLabel(d.label);
        if (d.label === label || dl === norm || d.slug === label) return d.slug || _slugify(dl);
      }
    }
  }
  return _slugify(norm || label);
}

function _buildVendorSlugMap() {
  VENDOR_SLUG_MAP = {};
  const reg = (slug, label) => {
    const s = slug || (label ? _slugify(label) : '');
    if (!s) return;
    VENDOR_SLUG_MAP[s] = s;
    if (label) {
      VENDOR_SLUG_MAP[label] = s;
      VENDOR_SLUG_MAP[_chartNormLabel(label)] = s;
    }
  };
  [...MQ_DATA, ...GMQ_DATA, ...WAVE_DATA].forEach(d => reg(d.slug, d.label));
  [...VC_COMMERCIAL, ...VC_OSS].forEach(v => reg(v.slug, v.label));
  if (typeof MARKET_CHARTS === 'object' && MARKET_CHARTS) {
    Object.values(MARKET_CHARTS).forEach(chart => {
      if (!chart) return;
      [...(chart.mq_data || []), ...(chart.gmq_data || []), ...(chart.wave_data || [])]
        .forEach(d => reg(d && d.slug, d && d.label));
      [...(chart.vc_commercial || []), ...(chart.vc_oss || [])]
        .forEach(v => reg(v && v.slug, v && v.label));
    });
  }
  (LINK_PAIRS || []).forEach(([name]) => reg(_slugify(name), name));
  const cmp = window.__SB_REPORT__ && window.__SB_REPORT__.comparison;
  if (cmp && cmp.rankings) cmp.rankings.forEach(r => reg(r.solution, r.solution));
  document.querySelectorAll('.vendor-card').forEach(card => {
    const raw = card.dataset.vendor || '';
    const display = _chartNormLabel(raw);
    const slug = card.dataset.slug || _lookupSlugFromCharts(display);
    reg(slug, display);
    reg(slug, raw);
  });
}

function _resolveVendorSlug(labelOrSlug) {
  if (!labelOrSlug) return '';
  const key = String(labelOrSlug);
  // Allow hash-style "slug--market" or full "vendor-slug--market".
  const bare = key.replace(/^#?vendor-/, '');
  const m = bare.match(/^(.*?)--([a-z0-9-]+)$/i);
  if (m && VENDOR_SLUG_MAP[m[1]]) return VENDOR_SLUG_MAP[m[1]];
  if (m) return m[1];
  if (VENDOR_SLUG_MAP[key]) return VENDOR_SLUG_MAP[key];
  const norm = _chartNormLabel(key);
  if (VENDOR_SLUG_MAP[norm]) return VENDOR_SLUG_MAP[norm];
  return _lookupSlugFromCharts(key);
}

function _cardsForSlug(slug) {
  if (!slug) return [];
  return [...document.querySelectorAll('.vendor-card')].filter(c => {
    if (c.dataset.slug === slug) return true;
    const id = c.id || '';
    return id === ('vendor-' + slug) || id.startsWith('vendor-' + slug + '--');
  });
}

function _scrollToVendorCard(labelOrSlug, marketId) {
  let mid = marketId != null ? String(marketId || '') : '';
  let rawKey = String(labelOrSlug || '');
  const bare = rawKey.replace(/^#?vendor-/, '');
  const scoped = bare.match(/^(.*?)--([a-z0-9-]+)$/i);
  if (scoped && !mid) {
    mid = scoped[2];
    rawKey = scoped[1];
  }
  const slug = _resolveVendorSlug(rawKey);
  let card = null;
  if (slug && mid) card = document.getElementById(_vendorCardDomId(slug, mid));
  if (!card && slug) card = document.getElementById('vendor-' + slug);
  if (!card && slug) {
    const cards = _cardsForSlug(slug);
    if (mid) card = cards.find(c => c.dataset.market === mid) || null;
    if (!card) card = cards[0] || null;
  }
  if (!card) {
    const norm = _chartNormLabel(labelOrSlug);
    document.querySelectorAll('.vendor-card').forEach(c => {
      const d = _chartNormLabel(c.dataset.vendor || '');
      if (d === norm || c.dataset.vendor === labelOrSlug) {
        if (!mid || c.dataset.market === mid) card = c;
      }
    });
  }
  if (!card) return false;
  const body = card.querySelector('.vc-body');
  const header = card.querySelector('.vc-header');
  if (body && body.classList.contains('vc-collapsed')) {
    body.classList.remove('vc-collapsed');
    const toggle = header && header.querySelector('.vc-toggle');
    if (toggle) {
      setToggleChevron(toggle, true);
      toggle.classList.remove('is-closed');
      toggle.classList.add('is-open');
    }
  }
  const navH = (document.getElementById('solutionNav') || {}).offsetHeight || 125;
  const bcH = (document.getElementById('breadcrumb') || {}).offsetHeight || 0;
  const top = card.getBoundingClientRect().top + window.scrollY - navH - bcH - 12;
  window.scrollTo({ top, behavior: 'smooth' });
  card.classList.add('is-chart-target');
  setTimeout(() => card.classList.remove('is-chart-target'), 2000);
  const hash = '#' + (card.id || _vendorCardDomId(slug, card.dataset.market || mid));
  if (window.location.hash !== hash) {
    try { history.replaceState(null, '', hash); } catch (e) {}
  }
  return true;
}

function attachChartVendorNav(chart, labelFn, marketId) {
  if (!chart || !chart.options) return;
  const pick = labelFn || ((raw, ds) => (raw && (raw.label || raw.slug)) || (ds && ds.label));
  const mid = marketId != null ? String(marketId || '') : '';
  chart.options.onClick = (_evt, elements) => {
    if (!elements || !elements.length) return;
    const el = elements[0];
    const ds = chart.data.datasets[el.datasetIndex];
    const raw = ds && ds.data && ds.data[el.index];
    const label = pick(raw, ds, el);
    if (label) _scrollToVendorCard(label, mid || (chart.canvas && chart.canvas.closest('.chart-frame') || {}).dataset?.market);
  };
  const prevHover = chart.options.onHover;
  chart.options.onHover = (evt, elements) => {
    if (evt && evt.native && evt.native.target) {
      evt.native.target.style.cursor = elements && elements.length ? 'pointer' : 'default';
    }
    if (typeof prevHover === 'function') prevHover(evt, elements);
  };
}

function _wireLegendVendorNav(el, label) {
  if (!el || !label) return;
  el.setAttribute('tabindex', '0');
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', 'View ' + label + ' solution card');
  const mid = () => {
    const frame = el.closest && el.closest('.chart-frame');
    return (frame && frame.dataset.market) || '';
  };
  el.addEventListener('click', () => _scrollToVendorCard(label, mid()));
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); _scrollToVendorCard(label, mid()); }
  });
}

  const datasets = waveData.map((d, i) => ({

    data: [{ x: d.strategy, y: d.offering, r: bubbleR[d.presence] }],
    backgroundColor: palette[i % palette.length] + '66',
    borderColor:     palette[i % palette.length],

  }));

  const ctx = waveCanvas.getContext('2d');
  const c = new Chart(ctx, {

    data: { datasets },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      // Extra top padding so zone labels render above the chart area
      layout: { padding: { top: 38, right: 20, bottom: 10, left: 10 } },
      scales: {
        x: {
          min: 0.5, max: 4.9,
          title: { display: true, text: 'Strength of Strategy  (1=Emerging → 4=Strong)',
                   font: { size: 11 }, color: sbChartTheme().label },
          grid: { color: chartGridColor() },
          ticks: {
            stepSize: 1,
            color: sbChartTheme().label,
            callback: v => (['','Emerging','Moderate','Good','Strong'][v] || ''),
          },
        },
        y: {
          min: 0.5, max: 4.9,
          title: { display: true, text: 'Strength of Offering  (1=Emerging → 4=Strong)',
                   font: { size: 11 }, color: sbChartTheme().label },
          grid: { color: chartGridColor() },
          ticks: {
            stepSize: 1,
            color: sbChartTheme().label,
            callback: v => (['','Emerging','Moderate','Good','Strong'][v] || ''),
          },
        },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.dataset.label} · Strategy:${ctx.raw.x} Offering:${ctx.raw.y}`,
          }
        },
        datalabels: { display: false },
      },
    },
    plugins: [{
      id: 'waveArcZones',
      // Concentric arc zones centred at bottom-left corner, like a real Forrester Wave
      beforeDraw(chart) {
        const { ctx, chartArea: { left, top, bottom, width, height } } = chart;
        ctx.save();
        ctx.beginPath();
        ctx.rect(left, top, width, height);
        ctx.clip();

        const cx = left, cy = bottom;             // arc origin = bottom-left of plot area
        const diag = Math.hypot(width, height);
        const r1 = diag * 0.37;                   // Contenders / Strong Performers boundary
        const r2 = diag * 0.67;                   // Strong Performers / Leaders boundary

        const wave = sbChartTheme().wave;

        // Fill entire area = Leaders (deepest blue, upper-right quadrant)
        ctx.fillStyle = wave.outer;
        ctx.fillRect(left, top, width, height);

        // Overpaint up to r2 = Strong Performers + Contenders (medium blue)
        ctx.fillStyle = wave.mid;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r2, -Math.PI / 2, 0);    // sweep from straight-up to straight-right
        ctx.closePath();
        ctx.fill();

        // Overpaint up to r1 = Contenders only (near-white)
        ctx.fillStyle = wave.inner;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r1, -Math.PI / 2, 0);
        ctx.closePath();
        ctx.fill();

        // Arc boundary lines
        ctx.strokeStyle = wave.stroke;
        ctx.lineWidth = 1;
        ctx.setLineDash([]);
        for (const r of [r1, r2]) {
          ctx.beginPath();
          ctx.arc(cx, cy, r, -Math.PI / 2, 0);
          ctx.stroke();
        }
        ctx.restore();
      },
      // Zone labels rendered above the chart area (inside the top padding)
      afterDraw(chart) {
        const { ctx, chartArea: { left, top, width } } = chart;
        ctx.save();
        ctx.font = chartLabelFont(10);
        ctx.fillStyle = sbChartTheme().wave.label;
        ctx.textAlign = 'center';

        ctx.fillText('STRONG PERFORMERS', left + width * 0.50, top - 16);
        ctx.fillText('LEADERS',           left + width * 0.86, top - 16);
        ctx.restore();
      }
    },
    createCollidingPointLabelsPlugin(
      (_v, ds) => ds.label,
      (L) => palette[L.dsi] || L.color
    )]
  });
  _charts.push(c);
  attachChartVendorNav(c, (_raw, ds) => ds && ds.label, wrap.dataset.market || _chartMarketId);
  window._waveChart = c;

  // ── Wave legend hover ──────────────────────────────────────────────────────
  let _waveHovIdx = -1;
  function applyWaveHover(idx) {
    if (idx === _waveHovIdx) return;
    _waveHovIdx = idx;
    c.data.datasets.forEach((ds, i) => {
      const color = palette[i % palette.length];
      if (idx === -1) {
        ds.backgroundColor = color + '66';
        ds.borderColor     = color;
        ds.borderWidth     = 2;
      } else if (i === idx) {
        ds.backgroundColor = color + 'cc';
        ds.borderColor     = color;
        ds.borderWidth     = 3.5;
      } else {
        ds.backgroundColor = color + '18';
        ds.borderColor     = color + '44';
        ds.borderWidth     = 1;
      }
    });
    c.update('none');
    wrap.querySelectorAll('[data-wave-idx]').forEach(el => {
      const i = +el.dataset.waveIdx;
      el.style.opacity    = (idx === -1 || i === idx) ? '1' : '0.3';
      el.style.fontWeight = (idx !== -1 && i === idx) ? '500' : '400';
    });

  wrap.querySelectorAll('[data-wave-idx]').forEach(el => {
    const idx = +el.dataset.waveIdx;
    const lbl = (waveData[idx] && waveData[idx].label) || '';
    _wireLegendVendorNav(el, lbl);
    el.addEventListener('mouseenter', () => applyWaveHover(idx));
    el.addEventListener('mouseleave', () => applyWaveHover(-1));
  });
  });
}

// ─── 3C: Blue Ocean Value Curve ─────────────────────────────────────────────
function injectValueCurve(anchorH3) {
  const payload = _marketChartSource(anchorH3);
  const titles = payload.titles || {};
  const vcKcfs = payload.vc_kcfs;
  const palette = themedSeriesPalette();
  const leaderLabels = new Set(
    ((payload.vendor_buckets && payload.vendor_buckets.leaders) || [])
      .concat(payload.gmq_data.filter(d => d.q === 'Leaders').map(d => d.label))
      .concat(payload.mq_data.filter(d => d.q === 'Leaders').map(d => d.label))
      .filter(Boolean)
  );
  const isLeader = (label) => {
    if (!label) return false;
    if (leaderLabels.has(label)) return true;
    const norm = String(label).replace(/\s*\([^)]*\)\s*$/, '').trim();
    if (leaderLabels.has(norm)) return true;
    for (const L of leaderLabels) {
      const Ln = String(L).replace(/\s*\([^)]*\)\s*$/, '').trim();
      if (Ln === norm || label.includes(Ln) || L.includes(norm)) return true;
    }
    return false;
  };
  const leaderSeries = [...payload.vc_commercial, ...payload.vc_oss].filter(s => isLeader(s.label));
  const allSeries = (leaderSeries.length ? leaderSeries : [...payload.vc_commercial, ...payload.vc_oss].slice(0, 6))
    .map((s, i) => Object.assign({}, s, { color: s.color || palette[i % palette.length] }));

  const mkSwatch = s =>
    `<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${s.color}"></span>`;
  const mkItem = (s, idx) =>
    `<span data-vc-idx="${idx}" style="display:flex;align-items:center;gap:5px;font-size:11.5px;
           cursor:pointer;padding:3px 7px;border-radius:5px;transition:opacity .15s,background .15s;">${mkSwatch(s)}${s.label}</span>`;
  const legendHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:4px;">
      <span style="font-size:10px;font-weight:500;color:var(--sb-muted);letter-spacing:.6px;">MQ LEADERS</span>
      ${allSeries.map((s, i) => mkItem(s, i)).join('') || '<span style="font-size:12px;color:var(--sb-muted);">No Leaders in Magic Quadrant</span>'}
    </div>`;

  const wrap = document.createElement('div');
  wrap.className = 'chart-frame';
  const _chartMarketId = payload.marketId;
  if (_chartMarketId) wrap.dataset.market = _chartMarketId;
  wrap.innerHTML = `
    <div class="chart-title">${titles.vc || '3D · Blue Ocean Value Curve (Leaders Radar)'}</div>
    <div class="chart-subtitle">
      Magic Quadrant Leaders only · Scale 1–5 across ${vcKcfs.length || 'N'} Key Competitive Factors
    </div>
    <div class="chart-canvas-wrap chart-canvas-wrap--vc"><canvas id="${nextChartCanvasId('vcChart')}"></canvas></div>
    <div style="margin-top:14px;">${legendHTML}</div>`;

  const tbl = findNextTable(anchorH3);
  if (tbl) tbl.style.display = 'none';
  anchorH3.after(wrap);

  const vcCanvas = wrap.querySelector('canvas');
  whenChartParentReady(vcCanvas, () => {
  const ctx = vcCanvas.getContext('2d');
  const datasets = allSeries.map(s => ({
    label: s.label,
    data: s.data,
    borderColor: s.color,
    backgroundColor: hexAlpha(s.color, 0.12),
    borderWidth: 2,
    pointRadius: 3,
    pointHoverRadius: 5,
    pointBackgroundColor: s.color,
    fill: true,
  }));

  const LEVEL = ['','Weak','Fair','Good','Strong','Best'];
  const c = new Chart(ctx, {
    type: 'radar',
    data: { labels: vcKcfs, datasets },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 8, right: 8, left: 8, bottom: 8 } },
      scales: {
        r: {
          min: 0,
          max: 5,
          beginAtZero: true,
          ticks: {
            stepSize: 1,
            backdropColor: 'transparent',
            font: { size: 10 },
            callback: v => LEVEL[v] ?? '',
            color: sbChartTheme().label,
          },
          grid: { color: chartGridColor() },
          angleLines: { color: chartGridColor() },
          pointLabels: {
            font: { size: 11, family: '"Roboto Condensed", sans-serif' },
            color: sbChartTheme().label,
          },
        },
      },
      plugins: {
        legend: { display: false },
        datalabels: { display: false },
        tooltip: { enabled: false },
      },
      interaction: { mode: 'nearest', intersect: false },
    },
    plugins: [{
      id: 'vcWaveBackground',
      beforeDraw(chart) {
        const { ctx, chartArea } = chart;
        if (!chartArea || !chartArea.width || !chartArea.height) return;
        const { left, top, width, height } = chartArea;
        ctx.save();
        ctx.beginPath();
        ctx.rect(left, top, width, height);
        ctx.clip();
        const zones = sbWaveZoneFills();
        ctx.fillStyle = zones.contenders;
        ctx.fillRect(left, top, width, height);
        const cx = left + width / 2;
        const cy = top + height / 2;
        const r = Math.min(width, height) * 0.48;
        ctx.fillStyle = zones.strong;
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.72, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = zones.leaders;
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.42, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      },
    }]
  });
  _charts.push(c);
  attachChartVendorNav(c, (_raw, ds) => ds && ds.label, wrap.dataset.market || _chartMarketId);
  window._vcChart = c;
  let _hovIdx = -1;

  function applyVcHover(idx) {
    if (idx === _hovIdx) return;
    _hovIdx = idx;
    c.data.datasets.forEach((ds, i) => {
      const hex = allSeries[i].color;
      if (idx === -1) {
        ds.borderColor = hex;
        ds.backgroundColor = hexAlpha(hex, 0.12);
        ds.borderWidth = 2;
        ds.pointRadius = 3;
      } else if (i === idx) {
        ds.borderColor = hex;
        ds.backgroundColor = hexAlpha(hex, 0.28);
        ds.borderWidth = 3;
        ds.pointRadius = 5;
      } else {
        ds.borderColor = hexAlpha(hex, 0.18);
        ds.backgroundColor = hexAlpha(hex, 0.04);
        ds.borderWidth = 1;
        ds.pointRadius = 2;
      }
    });
    c.update('none');
    wrap.querySelectorAll('[data-vc-idx]').forEach(el => {
      const i = +el.dataset.vcIdx;
      el.style.opacity    = (idx === -1 || i === idx) ? '1' : '0.3';
      el.style.fontWeight = (idx !== -1 && i === idx) ? '500' : '400';
    });
  }

  wrap.querySelectorAll('[data-vc-idx]').forEach(el => {
    const idx = +el.dataset.vcIdx;
    const lbl = (allSeries[idx] && allSeries[idx].label) || '';
    _wireLegendVendorNav(el, lbl);
    el.addEventListener('mouseenter', () => applyVcHover(idx));
    el.addEventListener('mouseleave', () => applyVcHover(-1));
  });
  });
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function findNextTable(el) {
  let n = el.nextElementSibling;
  while (n && n.tagName !== 'TABLE' && !['H2','H1'].includes(n.tagName)) {
    if (n.tagName === 'TABLE') return n;
    if (n.querySelector('table')) return n.querySelector('table');
    n = n.nextElementSibling;
  }
  return n && n.tagName === 'TABLE' ? n : null;
}

function injectCharts() {
  destroyCharts();
  document.querySelectorAll('#content h3, #content h4').forEach(h => {
    const t = h.textContent.trim();
    if (/\b3D\b/.test(t) || t.includes('Value Curve') || t.includes('Blue Ocean')) {
      applyMarketChartFromHeading(h);
      injectValueCurve(h);
    } else if (/\b3C\b/.test(t) || t.includes('Wave-Style') || t.includes('Wave Assessment')) {
      applyMarketChartFromHeading(h);
      injectWave(h);
    } else if (/\b3B\b/.test(t) || t.includes('Magic Quadrant')) {
      applyMarketChartFromHeading(h);
      injectGMQ(h);
    } else if (/\b3A\b/.test(t) || t.includes('Positioning Matrix') || t.includes('Primary 2×2') || t.includes('2x2')) {
      applyMarketChartFromHeading(h);
      inject2x2(h);
    }
  });
  // Restore primary market as the filter/membership baseline. Chart injects snapshot
  // per-market arrays via _marketChartSource before whenChartParentReady (rAF).
  if (PRIMARY_CHART_DATA && Object.keys(PRIMARY_CHART_DATA).length) {
    applyChartData(PRIMARY_CHART_DATA);
  }
  setupChartResizeObserver();
  requestAnimationFrame(() => resizeAllCharts());
}

// ─── Main load ───────────────────────────────────────────────────────────────
async function loadFile(path) {
  destroyCharts();
  document.getElementById('content').innerHTML = '<p style="color:var(--sb-muted);padding:40px 0;">Loading…</p>';
  document.getElementById('toc').innerHTML = '';
  try {
    const r = await fetch('/' + path);
    const md = await r.text();
    document.getElementById('content').innerHTML = marked.parse(md);
    ensureExternalLinksNewTab(document.getElementById('content'));
    buildTOC();
    document.getElementById('stats').textContent =
      `${(md.length/1000).toFixed(1)}K chars · ${md.split('\n').length} lines`;
    window.scrollTo(0, 0);
    // Inject charts (consolidated report only), then linkify all files
    if (path.includes('Consolidated Intelligence Report') || path.includes('Market Landscape Report')) {
      setTimeout(() => {
        injectCharts();
        linkify();
        linkifyBareHttpUrls(document.getElementById('content'));
        ensureExternalLinksNewTab(document.getElementById('content'));
        setTimeout(() => postRender(), 0);
      }, 0);
    } else {
      setTimeout(() => { linkify(); linkifyBareHttpUrls(document.getElementById('content')); ensureExternalLinksNewTab(document.getElementById('content')); setTimeout(() => postRender(), 0); }, 0);
    }
  } catch(e) {
    document.getElementById('content').innerHTML = `<pre style="color:red">${e}</pre>`;
  }
}

function buildTOC() {
  const toc = document.getElementById('toc');
  toc.innerHTML = '';
  document.querySelectorAll('#content h1, #content h2, #content h3').forEach((h, i) => {
    const id = 'h-' + i; h.id = id;
    const li = document.createElement('li');
    const a  = document.createElement('a');
    a.href = '#' + id;
    a.textContent = (h.tagName==='H1' ? '● ' : h.tagName==='H2' ? '  ○ ' : '    · ') + h.textContent;
    a.style.fontSize = h.tagName==='H1' ? '13px' : h.tagName==='H2' ? '12px' : '11px';
    a.onclick = () => { document.querySelectorAll('#sidebar a').forEach(x=>x.classList.remove('active')); a.classList.add('active'); };
    li.appendChild(a); toc.appendChild(li);
  });
}

// ─── #6 Progress bar + scroll polling fallback ──────────────────────────────
let _progressBar = null;
let _lastScrollY = -1;
function _onScrollTick() {
  const y = document.documentElement.scrollTop;
  if (y === _lastScrollY) return;
  _lastScrollY = y;
  // Update progress bar
  if (_progressBar) {
    const s = document.documentElement;
    const pct = s.scrollHeight - s.clientHeight > 0
      ? (s.scrollTop / (s.scrollHeight - s.clientHeight)) * 100 : 0;
    _progressBar.style.width = pct + '%';
  }
  // Dispatch custom event for breadcrumb (so the IIFE module can listen)
  window.dispatchEvent(new CustomEvent('scrolltick'));
}
// Primary: native scroll events
window.addEventListener('scroll', _onScrollTick, { passive: true });
// Fallback: polling at 200ms for environments where scroll events don't fire
setInterval(_onScrollTick, 200);

// ─── Copy for Google Docs ──────────────────────────────────────────────────
async function copyForGoogleDocs() {
  const btn = document.getElementById('copyGdocsBtn');
  const origHTML = btn.innerHTML;
  btn.innerHTML = lucideIconHtml('loader-2', 'btn-icon lucide-icon is-spinning') + ' Preparing…';
  refreshLucideIcons(btn);
  btn.disabled = true;

  try {
    // 1. Expand all collapsed vendor cards temporarily
    const collapsedBodies = document.querySelectorAll('.vc-body.vc-collapsed');
    collapsedBodies.forEach(b => b.classList.remove('vc-collapsed'));

    // 2. Clone the content
    const content = document.getElementById('content');
    const clone = content.cloneNode(true);

    // 3. Convert all canvas elements to inline images
    const origCanvases = content.querySelectorAll('canvas');
    const cloneCanvases = clone.querySelectorAll('canvas');
    origCanvases.forEach((origCanvas, i) => {
      try {
        const dataUrl = origCanvas.toDataURL('image/png');
        const img = document.createElement('img');
        img.src = dataUrl;
        img.style.cssText = 'max-width:100%;height:auto;';
        img.alt = 'Chart';
        if (cloneCanvases[i]) {
          cloneCanvases[i].parentNode.replaceChild(img, cloneCanvases[i]);
        }
      } catch(e) { /* canvas tainted — skip */ }
    });

    // 4. Remove UI-only elements from clone
    clone.querySelectorAll('#vendorFilterBar, .vc-toggle, .vname-link').forEach(el => {
      if (el.classList.contains('vname-link')) {
        // Replace vname-link spans with plain text
        el.replaceWith(document.createTextNode(el.textContent));
      } else {
        el.remove();
      }
    });

    // 5. Make vendor cards look expanded in the copy
    clone.querySelectorAll('.vc-body').forEach(b => {
      b.style.display = 'block';
      b.classList.remove('vc-collapsed');
    });

    // 6. Un-hide the original H3 inside vendor cards and style them
    clone.querySelectorAll('.vendor-card > h3').forEach(h3 => {
      h3.style.display = 'block';
      h3.style.cssText = 'font-size:16pt;color:#1f3864;margin:12px 0 8px;font-weight:bold;';
    });
    // Remove the vc-header since h3 is now visible
    clone.querySelectorAll('.vc-header').forEach(h => h.remove());
    // Remove vc-tags (not needed in doc)
    clone.querySelectorAll('.vc-tags').forEach(t => t.remove());

    // 7. Apply inline styles for Google Docs compatibility
    _inlineStylesForGDocs(clone);

    // 8. Build final HTML with wrapper styles
    const html = `<div style="font-family:Arial,Helvetica,sans-serif;font-size:11pt;color:#1a1a1a;line-height:1.6;max-width:800px;">${clone.innerHTML}</div>`;

    // 9. Copy to clipboard as rich HTML
    const blob = new Blob([html], { type: 'text/html' });
    await navigator.clipboard.write([
      new ClipboardItem({ 'text/html': blob })
    ]);

    // 10. Re-collapse the vendor cards
    collapsedBodies.forEach(b => b.classList.add('vc-collapsed'));

    setActionBtnState(btn, 'check', 'Copied!');
    setTimeout(() => { btn.innerHTML = origHTML; btn.disabled = false; refreshLucideIcons(btn); }, 2500);

  } catch(e) {
    console.error('Copy failed:', e);
    // Re-collapse
    document.querySelectorAll('.vc-body.vc-collapsed').forEach(b => b.classList.add('vc-collapsed'));
    setActionBtnState(btn, 'circle-x', 'Failed');
    setTimeout(() => { btn.innerHTML = origHTML; btn.disabled = false; refreshLucideIcons(btn); }, 2500);
  }
}

// ─── Export to PDF ──────────────────────────────────────────────────────────
// Engine writes sibling landscape-report.pdf at regen time (Playwright page.pdf).
// Button opens that relative file in a new tab — never a blob URL, never a print dialog.
async function exportToPDF() {
  const btn = document.getElementById('pdfExportBtn');
  const origHTML = btn.innerHTML;
  const pdfHref = 'landscape-report.pdf?v=' + Date.now();
  btn.disabled = true;
  try {
    const opened = window.open(pdfHref, '_blank', 'noopener,noreferrer');
    if (!opened) {
      const a = document.createElement('a');
      a.href = pdfHref;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    setActionBtnState(btn, 'check', 'Opened');
  } catch (e) {
    console.error('PDF export failed:', e);
    setActionBtnState(btn, 'circle-x', 'PDF missing — regenerate the landscape report');
  }
  setTimeout(() => { btn.innerHTML = origHTML; btn.disabled = false; refreshLucideIcons(btn); }, 2500);
}

function _inlineStylesForGDocs(root) {
  // Headings
  root.querySelectorAll('h1').forEach(el => {
      el.style.cssText = 'font-size:22pt;color:#1f3864;font-weight:bold;border-bottom:2px solid #d0d7de;padding-bottom:8px;margin:20px 0 12px;';
  });
  root.querySelectorAll('h2').forEach(el => {
      el.style.cssText = 'font-size:16pt;color:#1f3864;font-weight:bold;border-bottom:1px solid #e1e4e8;padding-bottom:6px;margin:24px 0 10px;';
  });
  root.querySelectorAll('h3').forEach(el => {
      if (!el.style.cssText) el.style.cssText = 'font-size:13pt;color:#2f5597;font-weight:bold;margin:16px 0 6px;';
  });
  root.querySelectorAll('h4').forEach(el => {
      el.style.cssText = 'font-size:11pt;color:#2f5597;font-weight:bold;margin:12px 0 4px;';
  });

  // Paragraphs
  root.querySelectorAll('p').forEach(el => {
    el.style.cssText += ';font-size:11pt;margin:0 0 8px;line-height:1.6;';
  });

  // Lists
  root.querySelectorAll('ul,ol').forEach(el => {
    el.style.cssText = 'margin:0 0 10px 24px;font-size:11pt;';
  });
  root.querySelectorAll('li').forEach(el => {
    el.style.cssText = 'margin:3px 0;line-height:1.5;';
  });

  // Bold & italic
  root.querySelectorAll('strong').forEach(el => { el.style.fontWeight = '500'; });

  // Links — blue, no underline (a11y via color + focus outline elsewhere)
  root.querySelectorAll('a').forEach(el => {
      el.style.cssText = 'color:#2563eb;text-decoration:none;';
  });

  // Blockquotes / callouts
  root.querySelectorAll('blockquote, .callout').forEach(el => {
      el.style.cssText = 'border-left:4px solid #2f5597;padding:8px 14px;margin:12px 0;background:#e8eef4;font-size:11pt;';
  });

  // HR
  root.querySelectorAll('hr').forEach(el => {
    el.style.cssText = 'border:none;border-top:1px solid #d0d7de;margin:20px 0;';
  });

  // Code
  root.querySelectorAll('code').forEach(el => {
    el.style.cssText = 'background:#f0f3f6;padding:1px 4px;border-radius:3px;font-family:Consolas,monospace;font-size:10pt;';
  });
  root.querySelectorAll('pre').forEach(el => {
    el.style.cssText = 'background:#f6f8fa;padding:12px;border-radius:6px;overflow-x:auto;margin:10px 0;font-size:10pt;font-family:Consolas,monospace;border:1px solid #d0d7de;';
  });
  root.querySelectorAll('pre code').forEach(el => {
    el.style.cssText = 'background:none;padding:0;font-family:Consolas,monospace;font-size:10pt;';
  });

  // Tables — Google Docs needs inline borders on every cell
  root.querySelectorAll('table').forEach(tbl => {
    tbl.style.cssText = 'width:100%;border-collapse:collapse;margin:12px 0;font-size:10pt;';
    tbl.querySelectorAll('th').forEach(th => {
      th.style.cssText = 'background:#e8eaed;color:#1a1a1a;font-weight:bold;font-size:9pt;text-transform:uppercase;letter-spacing:0.3px;padding:8px 10px;border:1px solid #d0d7de;text-align:left;';
    });
    tbl.querySelectorAll('td').forEach(td => {
      td.style.cssText = 'padding:7px 10px;border:1px solid #d0d7de;vertical-align:top;font-size:10pt;';
    });
    // Zebra striping
    tbl.querySelectorAll('tbody tr').forEach((tr, i) => {
      if (i % 2 === 1) tr.style.background = '#f6f8fa';
    });
  });

  // Pros/cons grid → convert to a simple 2-column table for GDocs (CSS grid won't work)
  root.querySelectorAll('.pros-cons-grid').forEach(grid => {
    const prosCol = grid.querySelector('.pros-col');
    const consCol = grid.querySelector('.cons-col');

    el.style.cssText = 'border:1px solid #d0d7de;border-radius:8px;padding:16px 20px;margin:16px 0;background:#ffffff;';

  root.querySelectorAll('.chart-title').forEach(el => {

  });
  root.querySelectorAll('.chart-subtitle').forEach(el => {
    el.style.cssText = 'font-size:9pt;color:#80868b;margin-bottom:14px;';
  });

  // Trend cards → convert to a simple list for GDocs
  root.querySelectorAll('.trend-strip').forEach(strip => {
    const cards = strip.querySelectorAll('.trend-card');
    if (cards.length === 0) return;
    const tbl = document.createElement('table');
    tbl.style.cssText = 'width:100%;border-collapse:collapse;margin:12px 0;';

    cards.forEach((card, i) => {
      const icon = card.querySelector('.tc-icon')?.textContent || '';
      const title = card.querySelector('.tc-title')?.textContent || '';
      const body = card.querySelector('.tc-body')?.textContent || '';
      rowHTML += `<td style="vertical-align:top;padding:10px;border:1px solid #d0d7de;width:${Math.floor(100/Math.min(cards.length,4))}%;background:#f6f8fa;">

      </td>`;
      // Max 4 per row
      if ((i + 1) % 4 === 0 && i < cards.length - 1) rowHTML += '</tr><tr>';
    });
    rowHTML += '</tr>';
    tbl.innerHTML = rowHTML;
    strip.replaceWith(tbl);
  });

  // Vendor card wrapper — clean border
  root.querySelectorAll('.vendor-card').forEach(el => {
    el.style.cssText = 'border:1px solid #d0d7de;border-radius:8px;padding:12px 16px;margin:14px 0;page-break-inside:avoid;';

  // Collapsible indicators — remove ▾/▸ characters from H3 text
  root.querySelectorAll('h3.collapsible').forEach(h3 => {

  // ── #5 buildTrendCards ───────────────────────────────────────────────────────
  function buildTrendCards() {
    const trendH2 = Array.from(document.querySelectorAll('#content h2'))
      .find(h => /trend/i.test(h.textContent));
    if (!trendH2) return;

    const strip = document.createElement('div');
    strip.className = 'trend-strip';
    strip.setAttribute('role', 'list');

    // Collect all nodes between this H2 and next H2 — to replace them later
    const nodesToReplace = [];
    let sib = trendH2.nextElementSibling;

    // Strategy: collect H3 headings as trend titles + following body paragraphs
    // Falls back to OL/UL list items if no H3s are found
    const trendItems = [];  // { title, body }
    let currentTitle = null, currentBodyParts = [];

    while (sib && sib.tagName !== 'H2') {
      nodesToReplace.push(sib);
      if (sib.tagName === 'H3') {
        // Save previous trend
        if (currentTitle !== null) {
          trendItems.push({ title: currentTitle, body: currentBodyParts.join(' ').trim() });
        }
        // Strip "Trend N: " prefix if present
        currentTitle = sib.textContent.trim().replace(/^Trend\s+\d+:\s*/i, '');
        currentBodyParts = [];
      } else if (currentTitle !== null && ['P','UL','OL'].includes(sib.tagName)) {
        currentBodyParts.push(sib.textContent.trim());
      } else if (sib.tagName === 'LI') {
        // Fallback: plain list
        const strong = sib.querySelector('strong');
        if (strong) {
          if (currentTitle !== null) trendItems.push({ title: currentTitle, body: currentBodyParts.join(' ').trim() });
          currentTitle = strong.textContent.trim();
          currentBodyParts = [sib.textContent.replace(strong.textContent, '').replace(/^[:\s–—]+/, '').trim()];
        }
      }
      sib = sib.nextElementSibling;
    }
    if (currentTitle !== null) {
      trendItems.push({ title: currentTitle, body: currentBodyParts.join(' ').trim() });
    }

    // Fallback: try OL/UL directly after H2 if no H3-based items found
    if (trendItems.length === 0) {
      const list = nodesToReplace.find(n => ['OL','UL'].includes(n.tagName));
      if (list) {
        list.querySelectorAll(':scope > li').forEach(li => {
          const strong = li.querySelector('strong');
          if (strong) {
            const clone = li.cloneNode(true);
            clone.querySelectorAll('strong').forEach(s => s.remove());
            trendItems.push({ title: strong.textContent.trim(), body: clone.textContent.replace(/^[:\s–—]+/, '').trim() });
          } else {
            const text = li.textContent.trim();
            const ci = text.indexOf(':');
            trendItems.push(ci > 0
              ? { title: text.slice(0, ci).trim(), body: text.slice(ci + 1).trim() }
              : { title: text.slice(0, 60).trim(), body: text.slice(60).trim() });
          }
        });
      }
    }

    if (trendItems.length === 0) return;

    trendItems.forEach(({ title, body }, idx) => {
      const card = document.createElement('div');
      card.className = 'trend-card';
      card.setAttribute('role', 'listitem');
      // Truncate body to ~120 chars for card readability
      const shortBody = body.length > 130 ? body.slice(0, 127) + '…' : body;
      card.innerHTML =
        `<div class="tc-icon">${lucideIconHtml(TREND_ICONS[idx % TREND_ICONS.length], 'lucide-icon')}</div>` +
        `<div class="tc-title">${title}</div>` +
        `<div class="tc-body">${shortBody}</div>`;
      strip.appendChild(card);
    });

    // Replace all collected nodes with the strip
    const parent = trendH2.parentNode;
    nodesToReplace.forEach(n => n.remove());
    trendH2.after(strip);
  }

  function buildInfoCards() {
    const SECTION_PATTERNS = [

    ];
    SECTION_PATTERNS.forEach(pattern => {
      const h2 = Array.from(document.querySelectorAll('#content h2')).find(h => pattern.test(h.textContent));
      if (!h2) return;

      // Collect H3s and their body nodes between this H2 and next H2
      const items = [];
      let sib = h2.nextElementSibling;
      let currentH3 = null;
      let currentNodes = [];

      while (sib && sib.tagName !== 'H2') {
        if (sib.tagName === 'H3') {
          if (currentH3) items.push({ h3: currentH3, nodes: currentNodes });
          currentH3 = sib;
          currentNodes = [];
        } else if (currentH3) {
          currentNodes.push(sib);
        }
        sib = sib.nextElementSibling;
      }
      if (currentH3) items.push({ h3: currentH3, nodes: currentNodes });
      if (items.length === 0) return;

      // Build cards in a container, replace existing H3+content
      const container = document.createDocumentFragment();
      items.forEach(({ h3, nodes }) => {
        // Strip leading "N. " from title
        const title = h3.textContent.trim().replace(/^\d+\.\s*/, '');

        const card = document.createElement('div');
        card.className = 'info-card';

        body.className = 'info-card-body'; // collapsed by default
        // Remove any trailing HRs
        const cleanNodes = nodes.filter(n => n.tagName !== 'HR');
        cleanNodes.forEach(n => body.appendChild(n));

        hdr.addEventListener('click', () => {
          const isOpen = body.classList.toggle('open');
          setToggleChevron(hdr.querySelector('.info-card-toggle'), isOpen);
        });

        card.appendChild(hdr);
        card.appendChild(body);
        container.appendChild(card);

        h3.remove();
      });

      // Insert container where first H3 was (after H2)
      h2.after(container);

      // Remove any stray <hr> elements directly under this section
      // (markdown --- separators that land between H2 and next H2)
      let el = h2.nextElementSibling;
      const nextH2 = h2.nextElementSibling ? (function findNext(node){
        while (node) { if (node.tagName === 'H2') return node; node = node.nextElementSibling; }
        return null;
      })(h2.nextElementSibling) : null;
      let scan = h2.nextElementSibling;
      while (scan && scan !== nextH2) {
        const nxt = scan.nextElementSibling;
        if (scan.tagName === 'HR') scan.remove();
        scan = nxt;
      }
    });
