<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){var k='sb-landscape-theme',s=localStorage.getItem(k),t=s||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Preview</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Broken fontsource@5.0.8 weight 500 removed; Roboto Condensed 300/400/500 via Google Fonts -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --sb-sidebar-w: 260px;
    --sb-main-pad-x: 48px;
    --sb-main-pad-top: 120px;
    --sb-topbar-h: 82px;
    --sb-sticky-thead-top: var(--sb-topbar-h);
    --sb-export-bar-clearance: 88px;
    --sb-safe-bottom: env(safe-area-inset-bottom, 0px);
    --sb-safe-top: env(safe-area-inset-top, 0px);
  }

  /* ── Light theme — crisp navy/slate enterprise ── */
  [data-theme="light"] {
    --sb-ink: #1e293b;
    --sb-ink-light: #334155;
    --sb-muted: #64748b;
    --sb-muted-light: #94a3b8;
    --sb-border: #d0d7de;
    --sb-border-soft: #e2e8f0;
    --sb-border-muted: #e1e4e8;
    --sb-surface: #ffffff;
    --sb-surface-muted: #f6f8fa;
    --sb-surface-hover: #f1f5f9;
    --sb-page: #f8fafc;
    --sb-sidebar-bg: #1e293b;
    --sb-sidebar-ink: #cbd5e1;
    --sb-sidebar-muted: #94a3b8;
    --sb-sidebar-hover: #334155;
    --sb-primary: #1f3864;
    --sb-primary-mid: #2f5597;
    --sb-primary-light: #3d6fa8;
    --sb-accent: #2563eb;
    --sb-accent-soft: #e8eef4;
    --sb-accent-hover: #e2e8f0;
    --sb-link: #2563eb;
    --sb-link-hover: #1d4ed8;
    --sb-link-visited: #6d28d9;
    --sb-link-underline: rgba(37, 99, 235, 0.38);
    --sb-sidebar-link-active: #f8fafc;
    --sb-pros: #2f5597;
    --sb-cons: #475569;
    --sb-chart-grid: #e2e8f0;
    --sb-chart-label: #64748b;
    --sb-chart-quad-leaders: #e8f4fd;
    --sb-chart-quad-challengers: #f0eaf8;
    --sb-chart-quad-visionaries: #fff3e6;
    --sb-chart-quad-niche: #f0f0f0;
    --sb-chart-zone-leaders: rgba(90, 150, 210, 0.42);
    --sb-chart-zone-strong: rgba(160, 205, 240, 0.38);
    --sb-chart-zone-mid: rgba(215, 235, 250, 0.58);
    --sb-chart-zone-contenders: rgba(235, 246, 253, 0.72);
    --sb-chart-wave-outer: rgba(135, 193, 238, 0.30);
    --sb-chart-wave-mid: rgba(195, 225, 248, 0.44);
    --sb-chart-wave-inner: rgba(230, 244, 253, 0.70);
    --sb-chart-wave-stroke: rgba(75, 145, 200, 0.38);
    --sb-chart-wave-label: rgba(20, 85, 145, 0.62);
    --sb-chart-label-shadow: rgba(255, 255, 255, 0.92);
    --sb-chart-series: #1f3864, #2f5597, #3d6fa8, #5b7fa6, #64748b, #475569, #334155, #94a3b8;
    --sb-chart-overlay: rgba(15,23,42,0.22);
    --sb-shadow: rgba(15,23,42,0.08);
    --sb-shadow-strong: rgba(15,23,42,0.18);
    --sb-breadcrumb-bg: linear-gradient(180deg,rgba(248,250,252,0.98),rgba(248,250,252,0.95));
    --sb-btn-bg: #ffffff;
    --sb-btn-ink: #0f172a;
    --sb-btn-hover: #f6f8fa;
    --sb-snav-chip-bg: rgba(255,255,255,0.06);
    --sb-snav-chip-hover: rgba(255,255,255,0.1);
    --sb-overlay-scrim: rgba(0,0,0,0.38);
  }

  /* ── Dark theme — deep slate/navy, soft surfaces ── */
  [data-theme="dark"] {
    --sb-ink: #e8edf4;
    --sb-ink-light: #d4dce8;
    --sb-muted: #a8b4c4;
    --sb-muted-light: #8b99ad;
    --sb-border: #334155;
    --sb-border-soft: #3d4f66;
    --sb-border-muted: #2d3a4d;
    --sb-surface: #1a2332;
    --sb-surface-muted: #151f2e;
    --sb-surface-hover: #243044;
    --sb-page: #0f172a;
    --sb-sidebar-bg: #0b1220;
    --sb-sidebar-ink: #cbd5e1;
    --sb-sidebar-muted: #7d8fa8;
    --sb-sidebar-hover: #1e293b;
    --sb-primary: #a8c4e8;
    --sb-primary-mid: #7ba3d4;
    --sb-primary-light: #5b8fd4;
    --sb-accent: #6b9fd8;
    --sb-accent-soft: #1a2840;
    --sb-accent-hover: #243552;
    --sb-link: #5ec8ff;
    --sb-link-hover: #a8e4ff;
    --sb-link-visited: #c4b5fd;
    --sb-link-underline: rgba(94, 200, 255, 0.42);
    --sb-sidebar-link-active: #f1f5f9;
    --sb-pros: #8eb8e8;
    --sb-cons: #94a3b8;
    --sb-chart-grid: #475569;
    --sb-chart-label: #dce4ee;
    --sb-chart-quad-leaders: #1a2a3d;
    --sb-chart-quad-challengers: #231a30;
    --sb-chart-quad-visionaries: #2a2418;
    --sb-chart-quad-niche: #1c1c1c;
    --sb-chart-zone-leaders: rgba(60, 110, 170, 0.35);
    --sb-chart-zone-strong: rgba(50, 90, 140, 0.42);
    --sb-chart-zone-mid: rgba(40, 70, 110, 0.50);
    --sb-chart-zone-contenders: rgba(25, 45, 75, 0.58);
    --sb-chart-wave-outer: rgba(70, 120, 180, 0.28);
    --sb-chart-wave-mid: rgba(55, 95, 145, 0.38);
    --sb-chart-wave-inner: rgba(35, 60, 95, 0.50);
    --sb-chart-wave-stroke: rgba(130, 180, 230, 0.35);
    --sb-chart-wave-label: rgba(203, 213, 225, 0.78);
    --sb-chart-label-shadow: rgba(15, 23, 42, 0.85);
    --sb-chart-series: #6b9fd8, #7ba3d4, #5b8fd4, #4a7fb0, #94a3b8, #7d8fa8, #64748b, #a8c4e8;
    --sb-chart-overlay: rgba(203,213,225,0.55);
    --sb-shadow: rgba(0,0,0,0.35);
    --sb-shadow-strong: rgba(0,0,0,0.5);
    --sb-breadcrumb-bg: linear-gradient(180deg,rgba(15,23,42,0.98),rgba(15,23,42,0.95));
    --sb-btn-bg: #1a2332;
    --sb-btn-ink: #e2e8f0;
    --sb-btn-hover: #243044;
    --sb-snav-chip-bg: rgba(255,255,255,0.05);
    --sb-snav-chip-hover: rgba(255,255,255,0.09);
    --sb-overlay-scrim: rgba(0,0,0,0.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: clip; max-width: 100%; }
  body {
    overflow-x: clip;
    max-width: 100%;
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  /* Roboto Condensed loaded via Google Fonts stylesheet (300+400+500). */
  html {
    font-family: 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif;
  }
  body {
    font-family: inherit;
    font-weight: 300;
    background: var(--sb-page); color: var(--sb-ink); line-height: 1.6;
    transition: background-color .2s ease, color .2s ease;
  }
  button, input, select, textarea, optgroup,
  #sidebar, #solutionNav, #breadcrumb, #exportBar,
  .chart-title, .chart-subtitle, .snav-btn, .export-btn, .vfbtn,
  .info-card-header, .tc-title, .tc-body, .vc-name, .toast {
    font-family: inherit;
  }
  code, pre, kbd, samp, .monospace {
    font-family: 'SF Mono', Consolas, 'Liberation Mono', monospace !important;
  }
  #sidebar { position: fixed; top: 0; left: 0; width: var(--sb-sidebar-w); height: 100vh;
             background: var(--sb-sidebar-bg); color: var(--sb-sidebar-ink); overflow-y: auto; padding: 16px;
             font-size: 13px; z-index: 100; transition: transform .25s ease, width .25s ease; }
  .sidebar-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px; min-height: 36px;
  }
  #sidebar h3 { color: var(--sb-sidebar-ink); margin: 0; font-size: 12px;
                text-transform: uppercase; letter-spacing: 1px; flex: 1; min-width: 0; }
  #sidebar ul { list-style: none; }
  #sidebar li { margin: 4px 0; }
  #sidebar a { color: var(--sb-sidebar-muted); text-decoration: none; display: block;
               padding: 3px 6px; border-radius: 4px; transition: all .15s; }
  #sidebar a:hover, #sidebar a.active { color: var(--sb-sidebar-link-active); background: var(--sb-sidebar-hover); }
  #main {
    margin-left: var(--sb-sidebar-w);
    padding: var(--sb-main-pad-top) var(--sb-main-pad-x)
             calc(40px + var(--sb-export-bar-clearance) + var(--sb-safe-bottom));
    width: calc(100% - var(--sb-sidebar-w));
    min-width: 0;
    max-width: 100%;
    overflow-x: clip;
  }
  #content { min-width: 0; width: 100%; max-width: 100%; font-size: 16px; overflow-x: clip; }
  /* Strict type ladder: H1 > H2 > H3 ≈ card titles > H4 ≈ trend/info titles > body */
  #content h1 { font-size: 1.875rem; font-weight: 500; border-bottom: 2px solid var(--sb-border-soft); padding-bottom: 12px;
                margin: 0 0 8px; color: var(--sb-primary); line-height: 1.2; letter-spacing: -0.02em; }
  #content h1 + p > em,
  #content h1 + em,
  #content .report-subtitle { font-size: 1rem; font-style: normal; font-weight: 400;
                color: var(--sb-muted); margin: 0 0 16px; display: block; line-height: 1.45; }
  #content h2 { font-size: 1.5rem; font-weight: 500; border-bottom: 1px solid var(--sb-border-soft); padding-bottom: 8px;
                margin: 36px 0 14px; color: var(--sb-primary); line-height: 1.25; letter-spacing: -0.01em;
                scroll-margin-top: calc(var(--sb-topbar-h) + 108px); }
  #content h3 { font-size: 1.25rem; font-weight: 500; margin: 28px 0 10px; color: var(--sb-primary-mid); line-height: 1.3;
                scroll-margin-top: calc(var(--sb-topbar-h) + 108px); }
  #content h4 { font-size: 1.0625rem; font-weight: 500; margin: 18px 0 8px; color: var(--sb-primary-mid); line-height: 1.35; }
  #content p { margin: 0 0 12px; font-size: 1rem; font-weight: 300; }
  #content ul, #content ol { margin: 0 0 12px 24px; }
  #content li { margin: 4px 0; font-weight: 300; }
  #content th { border: none; }
  #content td { border: none; font-weight: 300; }
  #content code { background: var(--sb-surface-hover); padding: 2px 6px; border-radius: 4px;
                  font-family: 'SF Mono', Consolas, monospace; font-size: 0.875em; }
  #content pre { background: var(--sb-sidebar-bg); color: var(--sb-sidebar-ink); padding: 16px; border-radius: 8px;
                 overflow-x: auto; margin: 12px 0; }
  #content pre code { background: none; color: inherit; padding: 0; }
  #content blockquote { border-left: 4px solid var(--sb-primary-mid); padding: 8px 16px;
                        background: var(--sb-accent-soft); margin: 12px 0; color: var(--sb-ink); }
  #content strong { font-weight: 500; }
  #content em { font-style: italic; }
  #content hr { border: none; border-top: 1px solid var(--sb-border-muted); margin: 32px 0; }
  /* Info cards — Shortlist Profiles & Future Outlook */
  .info-card { border:1px solid var(--sb-border); border-radius:10px; margin:10px 0; overflow:hidden; }
  .info-card-header { display:flex; align-items:center; justify-content:space-between; padding:11px 16px; background:var(--sb-surface-muted); cursor:pointer; font-weight:500; font-size:1.0625rem; color:var(--sb-ink); user-select:none; }
  .info-card-header:hover { background:var(--sb-accent-soft); }
  .info-card-toggle { color:var(--sb-muted-light); flex-shrink:0; padding-left:10px; line-height:1; display:inline-flex; align-items:center; }
  .info-card-body { display:none; padding:12px 18px 16px; font-size:14px; font-weight:300; }
  .info-card-body.open { display:block; }
  #stats { font-size: 11px; color: var(--sb-muted); margin-top: 8px; padding-top: 8px;
           border-top: 1px solid var(--sb-sidebar-hover); }
  .chart-frame { background: var(--sb-surface); border: 1px solid var(--sb-border); border-radius: 10px;
                 padding: 28px 32px; margin: 20px 0 28px; box-shadow: 0 2px 8px var(--sb-shadow);
                 opacity:0; transform:translateY(22px); transition:opacity .55s ease, transform .55s ease;
                 will-change: opacity, transform; min-width: 0; width: 100%; max-width: 100%; }
  .chart-frame.in-view { opacity:1; transform:translateY(0); }
  .chart-canvas-wrap {
    position: relative; width: 100%; min-width: 0; max-width: 100%;
    height: 480px; overflow: hidden;
  }
  .chart-canvas-wrap--vc { height: 440px; }
  .chart-canvas-wrap canvas { display: block; width: 100% !important; max-width: 100%; }
  .chart-title { font-size: 0.6875rem; font-weight: 500; text-transform: uppercase;
                 letter-spacing: .8px; color: var(--sb-muted); margin-bottom: 6px; }
  .chart-subtitle { font-size: 12px; color: var(--sb-muted-light); margin-bottom: 20px; }
  .chart-source-table { margin-top: 20px; }
  .chart-source-table summary { font-size: 12px; color: var(--sb-primary-mid); cursor: pointer; }
  .chart-source-table table { margin-top: 8px; }
  .wave-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; }
  .wave-legend span { display: flex; align-items: center; gap: 5px; }
  .wave-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
  .vc-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; }
  .vc-legend span { display: flex; align-items: center; gap: 5px; }
  .vc-legend i { display: inline-block; width: 28px; height: 3px; border-radius: 2px; }
  .vc-legend .dashed { border-top: 2px dashed currentColor; background: transparent; height: 0; }

  /* Solution Nav */
  #solutionNav {
    position: fixed; top: var(--sb-safe-top); left: var(--sb-sidebar-w); right: 0; z-index: 10000;
    background: var(--sb-sidebar-bg);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--sb-sidebar-hover);
    padding: 6px 14px;
    display: flex; flex-direction: column; gap: 4px;
    min-width: 0; overflow: hidden;
  }
  .topbar-chrome {
    display: flex; align-items: center; gap: 8px;
    width: 100%; min-height: 36px; flex-shrink: 0;
  }
  .topbar-chrome__spacer { flex: 1; min-width: 8px; }
  .topbar-filter-bar {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    min-width: 0; max-width: min(62vw, 720px);
  }
  .topbar-filter-bar .vf-label {
    font-size: 10px; font-weight: 500; letter-spacing: 0.6px;
    color: var(--sb-sidebar-muted); text-transform: uppercase; flex-shrink: 0;
  }
  /* Solution nav collapse — all viewports */
  #solutionNav.snav-collapsed .snav-body { display: none; }
  #solutionNav:not(.snav-collapsed) { box-shadow: 0 4px 16px var(--sb-shadow); }
  /* Desktop sidebar collapse */
  body.sb-sidebar-collapsed { --sb-sidebar-w: 0px; }
  body.sb-sidebar-collapsed #sidebar {
    width: 0;
    padding: 0;
    overflow: hidden;
    border: none;
    pointer-events: none;
  }
  body.sb-sidebar-collapsed #sidebar #toc,
  body.sb-sidebar-collapsed #sidebar #stats,
  body.sb-sidebar-collapsed #sidebar .sidebar-head {
    display: none;
  }
  #sidebarToggle {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--sb-border);
    background: var(--sb-surface); color: var(--sb-ink); cursor: pointer;
    box-shadow: 0 2px 8px var(--sb-shadow); flex-shrink: 0;
    position: static;
    z-index: 10061;
    pointer-events: auto;
  }
  #sidebarToggle:hover { background: var(--sb-surface-hover); border-color: var(--sb-primary-mid); color: var(--sb-primary-mid); }
  #snavToggle {
    font-size: 11px; font-weight: 500; letter-spacing: .4px;
    padding: 5px 12px; border-radius: 14px; border: 1px solid rgba(148,163,184,0.45);
    background: var(--sb-snav-chip-bg); color: var(--sb-sidebar-ink); cursor: pointer;
    flex-shrink: 0;
  }
  .snav-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .snav-row {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    overflow-x: auto; scrollbar-width: none;
    padding: 1px 0;
  }
  .snav-row::-webkit-scrollbar { display: none; }
  .snav-label {
    font-size: 9.5px; font-weight: 500; color: var(--sb-sidebar-ink); letter-spacing: 1px;
    min-width: 90px; flex-shrink: 0; text-transform: uppercase;
  }
  .snav-btn {
    font-size: 10.5px; padding: 4px 11px; border-radius: 14px;
    border: none; outline: none; background: var(--sb-snav-chip-bg);
    color: var(--sb-sidebar-ink); cursor: pointer; white-space: nowrap;
    transition: all .2s ease; flex-shrink: 0;
  }
  .snav-btn:hover, .snav-btn:focus, .snav-btn:focus-visible {
    border: none; outline: none; background: var(--sb-snav-chip-hover);
    color: var(--sb-sidebar-link-active);
  }
  .snav-btn.active {
    background: var(--sb-primary-mid);
    border: none; outline: none; color: #fff; font-weight: 500;
  }

  /* Reading Progress Bar */
  #readProgress { position:fixed; top:var(--sb-topbar-h); left:var(--sb-sidebar-w); right:0; height:3px; width:auto; background:transparent; z-index:9999; pointer-events:none; }
  #readProgressBar { position:absolute; top:0; left:0; height:3px; width:0%; background:var(--sb-primary-mid); transition:width .1s linear; }

  /* Sticky Breadcrumb */
  #breadcrumb { position:fixed; top:calc(var(--sb-topbar-h) + 1px); left:var(--sb-sidebar-w); right:0; height:32px; background:var(--sb-breadcrumb-bg); backdrop-filter:blur(8px); z-index:9998; display:flex; align-items:center; padding:0 28px; font-size:12px; letter-spacing:0.3px; color:var(--sb-muted); border-bottom:1px solid var(--sb-border-muted); box-shadow:0 1px 3px var(--sb-shadow); min-width:0; overflow:hidden; }
  #bcSection, #bcSub { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #bcSection { flex: 0 1 auto; max-width: 58%; }
  #bcSub { flex: 1 1 auto; max-width: 42%; }

  /* Theme switcher — inside collapsed top bar */
  #themeToggle {
    position: static;
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--sb-border); background: var(--sb-surface);
    color: var(--sb-ink); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px var(--sb-shadow); flex-shrink: 0;
    transition: background .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease;
  }
  #themeToggle:hover {
    background: var(--sb-surface-hover); border-color: var(--sb-primary-mid);
    color: var(--sb-primary-mid); box-shadow: 0 4px 14px var(--sb-shadow-strong);
  }
  #themeToggle .lucide-icon { width: 18px; height: 18px; }
  .topbar-export-cluster {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    margin-left: auto;
    margin-right: 6px;
  }
  .topbar-export-cluster .export-btn,
  .topbar-export-cluster #compareBtn {
    min-height: 36px;
    padding: 6px 10px;
    font-size: 11px;
    border-radius: 16px;
  }
  .topbar-export-cluster .export-btn .btn-icon,
  .topbar-export-cluster #compareBtn .btn-icon { width: 13px; height: 13px; }

  /* Section Colour Coding — enterprise blues/slates */
  .sec-color-0 h2, h2.sec-color-0 { border-left:4px solid var(--sb-primary); padding-left:10px; }
  .sec-color-1 h2, h2.sec-color-1 { border-left:4px solid var(--sb-primary-mid); padding-left:10px; }
  .sec-color-2 h2, h2.sec-color-2 { border-left:4px solid var(--sb-primary-light); padding-left:10px; }
  .sec-color-3 h2, h2.sec-color-3 { border-left:4px solid #5b7fa6; padding-left:10px; }
  .sec-color-4 h2, h2.sec-color-4 { border-left:4px solid var(--sb-muted); padding-left:10px; }
  .sec-color-5 h2, h2.sec-color-5 { border-left:4px solid var(--sb-cons); padding-left:10px; }
  .sec-color-6 h2, h2.sec-color-6 { border-left:4px solid var(--sb-ink-light); padding-left:10px; }
  .sec-color-7 h2, h2.sec-color-7 { border-left:4px solid var(--sb-muted-light); padding-left:10px; }
  a.sec-color-0 { border-left:3px solid var(--sb-primary); padding-left:6px; }
  a.sec-color-1 { border-left:3px solid var(--sb-primary-mid); padding-left:6px; }
  a.sec-color-2 { border-left:3px solid var(--sb-primary-light); padding-left:6px; }
  a.sec-color-3 { border-left:3px solid #5b7fa6; padding-left:6px; }
  a.sec-color-4 { border-left:3px solid var(--sb-muted); padding-left:6px; }
  a.sec-color-5 { border-left:3px solid var(--sb-cons); padding-left:6px; }
  a.sec-color-6 { border-left:3px solid var(--sb-ink-light); padding-left:6px; }
  a.sec-color-7 { border-left:3px solid var(--sb-muted-light); padding-left:6px; }
  #content h2[class*="sec-color"] { background:linear-gradient(90deg,var(--sb-surface-muted),transparent); padding:12px 14px 8px; border-radius:0 6px 6px 0; }

  /* Collapsible Sub-sections */
  #content h3.collapsible { cursor:pointer; user-select:none; display:flex; align-items:flex-start; gap:6px; }
  #content h3.collapsible .collapse-chevron { color:var(--sb-muted); flex-shrink:0; margin-top:2px; }
  .collapsible-body { overflow:hidden; transition:max-height .3s ease; }

  /* Inline Callout Boxes */
  .callout { border-left:4px solid; border-radius:0 6px 6px 0; padding:10px 16px; margin:14px 0; font-size:14px; }
  .callout strong:first-child { display:block; font-size:11px; letter-spacing:.5px; text-transform:uppercase; margin-bottom:4px; }
  .callout-insight { background:var(--sb-accent-soft); border-color:var(--sb-primary-mid); }
  .callout-signal  { background:var(--sb-surface-hover); border-color:var(--sb-muted); }
  .callout-risk    { background:var(--sb-page); border-color:var(--sb-cons); }
  .callout-stat    { background:var(--sb-accent-soft); border-color:var(--sb-primary); }
  .callout-default { background:var(--sb-surface-muted); border-color:var(--sb-muted); }

  /* Trend Cards */
  .trend-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:8px 0 16px; }
  .trend-card { background:var(--sb-surface-muted); border:1px solid var(--sb-border); border-radius:10px; padding:16px 14px; }
  .trend-card:hover { border-color:var(--sb-primary-mid); background:var(--sb-accent-soft); transition:all .2s; }
  .tc-icon { margin-bottom:8px; display:flex; align-items:center; color:var(--sb-primary-mid); }
  .tc-icon .lucide-icon { width:22px; height:22px; }
  .tc-title { font-size:1.0625rem; font-weight:500; color:var(--sb-ink); margin-bottom:6px; }
  .tc-body { font-size:12px; color:var(--sb-muted); line-height:1.5; font-weight:300; }

  /* Vendor Profile Cards */
  .vendor-card { border:1px solid var(--sb-border); border-radius:10px; margin:16px 0; overflow:hidden; }
  .vc-header { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--sb-surface-muted); cursor:pointer; }
  .vc-avatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500; color:#fff; flex-shrink:0; background:var(--sb-primary-mid); }
  .vc-name { font-size:1.25rem; font-weight:500; flex:1; color:var(--sb-primary-mid); line-height:1.3; }
  .vc-compare { display:inline-flex; align-items:center; flex-shrink:0; cursor:pointer; margin:0; padding:4px; }
  .vc-compare input { width:16px; height:16px; accent-color:var(--sb-primary-mid); cursor:pointer; margin:0; }
  .vendor-card.is-compare-selected { border-color:var(--sb-primary-mid); box-shadow:0 0 0 1px var(--sb-primary-mid); }
  .vendor-card.is-compare-selected .vc-header { background:var(--sb-accent-soft); }
  .vendor-card { scroll-margin-top: calc(var(--sb-topbar-h) + 108px); }
  .vc-toggle { color:var(--sb-muted-light); padding:4px 10px; display:inline-flex; align-items:center; line-height:1; }
  .vc-toggle .lucide-icon { width:18px; height:18px; }
  .vc-tags { display:flex; gap:6px; flex-wrap:wrap; padding:8px 16px 0; }
  .vc-tag { font-size:10px; padding:2px 8px; border-radius:12px; background:var(--sb-accent-soft); color:var(--sb-primary-mid); font-weight:500; }
  .vc-body { padding:0 16px 16px; }
  .vc-body.vc-collapsed { display:none; }
  .vendor-card:hover { border-color:var(--sb-primary-mid); box-shadow:0 2px 8px var(--sb-shadow); transition:all .2s ease; }

  /* Filterable Vendor View */
  .vfbtn { font-size: 11px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--sb-border); background: var(--sb-surface); cursor: pointer; color: var(--sb-ink); white-space: nowrap; }
  .vfbtn.active { background: var(--sb-primary-mid); color: #fff; border-color: var(--sb-primary-mid); }
  .vfbtn:hover:not(.active):not(:disabled) { background: var(--sb-surface-muted); }
  .vfbtn.is-hidden { display: none !important; }
  .vfbtn:disabled, .vfbtn.is-empty {
    opacity: 0.45; cursor: not-allowed; text-decoration: line-through;
  }
  .matrix-fill-gap {
    margin: 12px 0 18px; padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--sb-border); background: var(--sb-surface-muted);
    color: var(--sb-ink); font-size: 13px; line-height: 1.45;
  }
  .matrix-fill-gap strong { color: var(--sb-ink); }
  .vc-name a, .vc-name-link {
    color: var(--sb-link);
    text-decoration: none;
    transition: color .15s ease;
  }
  .vc-name a:hover, .vc-name-link:hover { color: var(--sb-link-hover); }
  .snav-btn.is-filtered-out { display: none !important; }
  a.snav-btn { text-decoration: none; display: inline-block; }
  .vendor-card.is-filtered-out { display: none !important; }

  /* Vendor Name Links */
  .vname-link {
    cursor: pointer;
    text-decoration: none;
    color: var(--sb-link);
    transition: color .15s ease;
  }
  .vname-link:hover {
    color: var(--sb-link-hover);
  }

  /* Content hyperlinks — markdown, tables, compare matrix */
  #content a:not(.snav-btn),
  #compareResultsBody a,
  .chart-source-table a {
    color: var(--sb-link);
    text-decoration: none;
    transition: color .15s ease;
  }
  #content a:not(.snav-btn):hover,
  #compareResultsBody a:hover,
  .chart-source-table a:hover,
  #content a:not(.snav-btn):focus-visible,
  #compareResultsBody a:focus-visible {
    color: var(--sb-link-hover);
  }
  #content a:not(.snav-btn):visited:not(:hover),
  #compareResultsBody a:visited:not(:hover) {
    color: var(--sb-link-visited);
  }
  #content a:not(.snav-btn):focus-visible,
  #compareResultsBody a:focus-visible {
    outline: 2px solid var(--sb-link);
    outline-offset: 2px;
    border-radius: 2px;
  }

  /* Export action buttons */
  #exportBar {
    position: fixed;
    bottom: calc(24px + var(--sb-safe-bottom));
    right: calc(24px + env(safe-area-inset-right, 0px));
    z-index: 1003;
    display: flex; align-items: center; gap: 10px;
  }
  #exportBar.export-bar--flow {
    position: static;
    left: auto;
    right: auto;
    margin: 40px auto 24px;
    width: fit-content;
    max-width: calc(100% - 24px);
    justify-content: center;
    flex-wrap: wrap;
    z-index: 20;
  }
  .export-btn {
    color: var(--sb-btn-ink); background: var(--sb-btn-bg);
    border: 1px solid var(--sb-border); padding: 10px 18px; border-radius: 20px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    box-shadow: 0 2px 8px var(--sb-shadow);
    display: flex; align-items: center; gap: 6px;
    transition: all .2s ease; white-space: nowrap;
  }
  .export-btn:hover { transform: translateY(-1px); background: var(--sb-btn-hover); box-shadow: 0 4px 14px var(--sb-shadow-strong); }
  .export-btn:active { transform: translateY(0); }
  .export-btn .btn-icon { width:15px; height:15px; }
  .lucide-icon { width:16px; height:16px; stroke-width:2; }
  .lucide-icon svg { width:100%; height:100%; }
  .lucide-icon.is-spinning svg { animation: lucide-spin 1s linear infinite; }
  @keyframes lucide-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  #sidebarToggle .lucide-icon { width:18px; height:18px; }
  #snavToggle { display:inline-flex; align-items:center; gap:6px; }
  #snavToggle .snav-chevron { width:14px; height:14px; }
  .icon-btn { background:none; border:none; cursor:pointer; color:var(--sb-muted); display:inline-flex; align-items:center; padding:4px; }
  .icon-btn .lucide-icon { width:18px; height:18px; }
  #compareBtn { display:flex; align-items:center; gap:6px; color:var(--sb-btn-ink); background:var(--sb-btn-bg); border:1px solid var(--sb-border); padding:10px 18px; border-radius:20px; cursor:pointer; font-size:13px; font-weight:500; box-shadow:0 2px 8px var(--sb-shadow); transition:all .2s ease; white-space:nowrap; }
  #compareBtn:hover { background:var(--sb-btn-hover); box-shadow:0 4px 14px var(--sb-shadow-strong); transform:translateY(-1px); }

  /* Toast notification */
  .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--sb-ink); color:var(--sb-sidebar-ink); padding:8px 16px; border-radius:8px; font-size:13px; z-index:10001; opacity:1; transition:opacity .5s; pointer-events:none; }
  .toast.fade { opacity:0; }

  /* Vendor Comparison Drawer */
  #compareBadge { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; background:var(--sb-primary); border-radius:50%; font-size:10px; margin-left:6px; color:#fff; }
  .compare-drawer {
    position: fixed;
    bottom: calc(72px + var(--sb-safe-bottom));
    right: calc(24px + env(safe-area-inset-right, 0px));
    width: 560px; max-height: 70vh;
    overflow-y: auto; overflow-x: hidden;
    background: var(--sb-surface); border: 1px solid var(--sb-border);
    border-radius: 12px; padding: 20px;
    z-index: 1002;
    box-shadow: 0 8px 24px var(--sb-shadow-strong);
    display: none;
  }
  .compare-drawer.open { display: block; }
  #compareTableWrap { font-size: 12px; color: var(--sb-muted); }
  .compare-results-section {
    margin-top: 48px; padding-top: 28px;
    border-top: 2px solid var(--sb-border-soft);
    scroll-margin-top: calc(var(--sb-topbar-h) + 108px);
  }
  .compare-results-section h2 { margin-top: 0; }
  #compareResultsBody .table-scroll-wrap { margin: 12px 0 0; }
  #compareResultsBody table { min-width: 480px; font-size: 12px; }
  .compare-empty { color: var(--sb-muted); font-size: 14px; margin: 8px 0 0; }
  .cmp-remove { cursor: pointer; color: var(--sb-muted); font-size: 12px;
    display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; }
  .chart-canvas-wrap canvas { cursor: pointer; }
  .quadrant-compare-layer {
    position: absolute; inset: 0; pointer-events: none; z-index: 4;
  }
  .quadrant-compare-btn-wrap {
    position: absolute; pointer-events: auto; display: none; padding: 2px;
  }
  .quadrant-compare-btn-wrap.is-visible,
  .quadrant-compare-btn-wrap:focus-within { display: block; }
  .quadrant-compare-btn {
    font-size: 10px; font-weight: 500; padding: 3px 9px; border-radius: 10px;
    cursor: pointer; border: 1px solid var(--sb-border); line-height: 1.2;
    background: var(--sb-btn-bg); color: var(--sb-btn-ink);
    box-shadow: 0 1px 5px var(--sb-shadow);
  }
  .quadrant-compare-btn:hover:not(:disabled) { background: var(--sb-btn-hover); }
  .quadrant-compare-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .cmp-col-score { display: block; font-size: 10px; font-weight: 500; color: var(--sb-primary-mid); margin-top: 2px; }
  #compareResultsBody tr.cmp-score-row td {
    background: var(--sb-accent-soft); font-weight: 500; text-align: center;
    border-bottom: 2px solid var(--sb-border);
  }
  #compareResultsBody tr.cmp-score-row td:first-child { text-align: left; }
  .vendor-card.is-chart-target { outline: 2px solid var(--sb-accent); outline-offset: 2px; }
  .wave-legend [data-wave-idx], .vc-legend [data-vc-idx] { cursor: pointer; }
  .table-scroll-wrap {
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    max-width: 100%; margin: 16px 0;
  }
  .table-scroll-wrap table {
    display: table;
    width: max-content;
    min-width: 100%;
    margin: 0;
  }
  #content h2.source-reliability-section + h3 {
    margin-top: 4px;
    margin-bottom: 10px;
    font-size: 1rem;
    font-weight: 500;
    color: var(--sb-primary-mid);
  }
  #content h2.source-reliability-section + h3 + .table-scroll-wrap,
  #content h2.source-reliability-section + h3 + table {
    margin-top: 0;
  }

  /* Pros & Cons Grid */
  .pros-cons-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 24px;
    margin: 12px 0;
  }
  .pros-col strong, .cons-col strong {
    display: block; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 6px;
  }
  .pros-col strong { color: var(--sb-pros); }
  .cons-col strong { color: var(--sb-cons); }
  .pros-col ul, .cons-col ul {
    margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.6;
  }

  /* Polished Table Styling */
  #content table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    border: 1px solid var(--sb-border);
    border-radius: 8px;
    overflow: hidden;
    margin: 16px 0;
    font-size: 13.5px;
    display: table;
  }
  #content table thead th {
    background: linear-gradient(180deg, var(--sb-surface-muted), var(--sb-border-muted));
    color: var(--sb-ink);
    font-weight: 500;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 10px 14px;
    border-bottom: 2px solid var(--sb-border);
    text-align: left;
    position: sticky;
    top: var(--sb-sticky-thead-top);
    z-index: 2;
  }
  /* Sticky thead breaks inside overflow ancestors (collapsible-body / table-scroll-wrap). */
  #content .table-scroll-wrap table thead th,
  #content .collapsible-body table thead th {
    position: static;
    top: auto;
  }
  #content table tbody td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--sb-border-muted);
    color: var(--sb-ink);
    vertical-align: top;
  }
  #content table tbody tr:last-child td {
    border-bottom: none;
  }
  #content table tbody tr:nth-child(even) {
    background: var(--sb-surface-muted);
  }
  #content table tbody tr:hover {
    background: var(--sb-accent-soft);
    transition: background .15s;
  }

  /* ── Responsive — cascade last (overrides base rules above) ── */
  @media (max-width: 1024px) {
    :root { --sb-main-pad-x: 32px; }
    .topbar-filter-bar { max-width: min(68vw, 560px); }
  }

  @media (max-width: 768px) {
    :root {
      --sb-main-pad-x: 20px;
      --sb-export-bar-clearance: 108px;
    }
    #content h1 { font-size: 1.5rem; }
    #content h2 { font-size: 1.25rem; margin-top: 28px; }
    #content h3 { font-size: 1.125rem; }
    .chart-frame { padding: 16px 14px; margin: 16px 0 20px; }
    .chart-canvas-wrap { height: min(400px, 62vw); }
    .chart-canvas-wrap--vc { height: min(360px, 58vw); }
    .trend-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pros-cons-grid { grid-template-columns: 1fr; gap: 12px 0; }
    .topbar-chrome { flex-wrap: wrap; row-gap: 6px; align-items: flex-start; }
    .topbar-filter-bar {
      flex: 1 1 100%;
      order: 10;
      max-width: 100%;
      padding-top: 2px;
    }
    .topbar-chrome__spacer { display: none; }
    #sidebarToggle, #themeToggle, #snavToggle {
      min-width: 44px; min-height: 44px;
    }
    #snavToggle { padding: 8px 14px; }
    .snav-btn {
      min-height: 36px;
      padding: 8px 12px;
      font-size: 11px;
    }
    .snav-label { min-width: 64px; }
    .vc-header { flex-wrap: wrap; gap: 8px; padding: 12px 14px; }
    .vc-name { font-size: 1.1rem; min-width: 0; overflow-wrap: anywhere; }
    .vc-compare {
      min-width: 44px; min-height: 44px;
      align-items: center; justify-content: center;
    }
    .vc-compare input { width: 20px; height: 20px; }
    #exportBar {
      left: 12px;
      right: 12px;
      bottom: calc(12px + var(--sb-safe-bottom));
      justify-content: flex-start;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      gap: 8px;
      max-width: none;
    }
    #exportBar::-webkit-scrollbar { display: none; }
    .export-btn, #compareBtn {
      min-height: 44px;
      padding: 10px 14px;
      font-size: 12px;
      flex-shrink: 0;
    }
    .compare-drawer {
      left: 12px;
      right: 12px;
      width: auto;
      bottom: calc(88px + var(--sb-safe-bottom));
      max-height: min(70vh, calc(100vh - var(--sb-topbar-h) - 120px));
    }
    #content table { display: table; width: 100%; max-width: 100%; }
    .table-scroll-wrap { margin: 12px 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .table-scroll-wrap table { width: max-content; min-width: 100%; }
  }

  @media (max-width: 480px) {
    :root {
      --sb-main-pad-x: 14px;
      --sb-main-pad-top: 52px;
      --sb-export-bar-clearance: 108px;
    }
    #breadcrumb {
      font-size: 11px;
      padding: 0 12px;
      height: 28px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .trend-strip { grid-template-columns: 1fr; }
    .chart-canvas-wrap { height: min(300px, 78vw); }
    .chart-canvas-wrap--vc { height: min(280px, 74vw); }
    .chart-title { font-size: 0.625rem; letter-spacing: 0.6px; }
    .chart-subtitle { font-size: 11px; margin-bottom: 12px; }
    .wave-legend, .vc-legend { gap: 10px; font-size: 11px; }
    .compare-drawer {
      left: 0;
      right: 0;
      width: 100%;
      bottom: 0;
      max-height: min(82vh, calc(100vh - var(--sb-topbar-h)));
      border-radius: 16px 16px 0 0;
      padding: 16px 14px calc(16px + var(--sb-safe-bottom));
    }
    #exportBar {
      left: 8px;
      right: 8px;
      bottom: calc(8px + var(--sb-safe-bottom));
    }
    .toast {
      bottom: calc(96px + var(--sb-safe-bottom));
      max-width: calc(100vw - 32px);
      text-align: center;
    }
  }

  @media (max-width: 360px) {
    :root { --sb-main-pad-x: 12px; }
    .export-btn, #compareBtn { padding: 10px 12px; font-size: 11px; }
    #snavToggle span { display: none; }
  }

  /* Narrow overlay layout (phone + IDE panel) — structural chrome */
  @media (max-width: 900px) {
    :root {
      --sb-sidebar-w: 0px;
      --sb-main-pad-x: 16px;
      --sb-main-pad-top: 52px;
      --sb-topbar-h: 44px;
    }
    #sidebar {
      width: min(280px, 88vw);
      transform: translateX(-105%);
      z-index: 10050;
      box-shadow: 4px 0 24px rgba(0,0,0,.28);
      padding-top: var(--sb-safe-top);
    }
    body.sb-sidebar-open #sidebar { transform: translateX(0); }
    body.sb-sidebar-open::before {
      content: ''; position: fixed; inset: 0; background: var(--sb-overlay-scrim); z-index: 10040;
    }
    body.sb-sidebar-open #sidebar { padding-top: calc(8px + var(--sb-safe-top)); }
    #solutionNav { left: 0; right: 0; padding: 6px 12px; }
    #solutionNav.snav-collapsed { --sb-topbar-h: 44px; }
    #solutionNav:not(.snav-collapsed) {
      --sb-topbar-h: min(50vh, 220px);
    }
    #readProgress, #breadcrumb { left: 0; }
    #breadcrumb { padding: 0 16px; }
    .snav-row { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div id="solutionNav" class="snav-collapsed">
  <div class="topbar-chrome">
    <button id="sidebarToggle" type="button" aria-label="Toggle table of contents" title="Contents"><i data-lucide="panel-left" class="lucide-icon" aria-hidden="true"></i></button>
    <button id="snavToggle" type="button" aria-expanded="false" aria-controls="snavBody"><i data-lucide="layers" class="lucide-icon" aria-hidden="true"></i><span>Solutions</span><i data-lucide="chevron-down" class="lucide-icon snav-chevron" aria-hidden="true"></i></button>
    <div id="vendorFilterBar" class="topbar-filter-bar" role="toolbar" aria-label="Vendor filter"></div>
    <div class="topbar-chrome__spacer"></div>
    <button id="themeToggle" type="button" aria-label="Switch theme" title="Toggle theme"></button>
  </div>
  <div id="snavBody" class="snav-body">
    <div class="snav-row" id="snavCommercial"><span class="snav-label">COMMERCIAL</span></div>
    <div class="snav-row" id="snavOSS"><span class="snav-label">OSS</span></div>
  </div>
</div>
<div id="readProgress"><div id="readProgressBar"></div></div>
<div id="breadcrumb"><span id="bcSection"></span><span id="bcSep" style="display:none"> › </span><span id="bcSub"></span></div>

<div id="sidebar">
  <div class="sidebar-head">
    <h3>Contents</h3>
  </div>
  <ul id="toc"></ul>
  <div id="stats"></div>
</div>

<div id="main">
  <div id="content"><p style="color:var(--sb-muted);padding:40px 0;">Loading report…</p></div>
</div>

<div id="exportBar">
  <button id="copyGdocsBtn" class="export-btn"><i data-lucide="clipboard-copy" class="btn-icon lucide-icon" aria-hidden="true"></i> Copy</button>
  <button id="pdfExportBtn" class="export-btn"><i data-lucide="file-text" class="btn-icon lucide-icon" aria-hidden="true"></i> PDF</button>
  <!-- Vendor Comparison Drawer toggle -->
  <button id="compareBtn"><i data-lucide="columns-2" class="btn-icon lucide-icon" aria-hidden="true"></i> Compare <span id="compareBadge" style="display:none"></span></button>
</div>
<div id="compareDrawer" class="compare-drawer" role="dialog" aria-label="Compare selection">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
    <div>

    </div>

</div>

<script>
Chart.register(ChartDataLabels);
Chart.defaults.font.family = "'Roboto Condensed', 'Arial Narrow', Arial, sans-serif";
Chart.defaults.font.size = 11;
marked.setOptions({ breaks: true, gfm: true });

/** Stamp http(s) anchors so they always open in a new tab. */
function ensureExternalLinksNewTab(root) {
  const scope = root && root.querySelectorAll ? root : document;
  scope.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href') || '';
    if (/^https?:\/\//i.test(href) || href.startsWith('//')) {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
    }
  });
}

try {
  const renderer = new marked.Renderer();
  const priorLink = renderer.link.bind(renderer);
  renderer.link = function (href, title, text) {
    // marked v9+ may pass a single token object as the first arg
    const html = (href && typeof href === 'object')
      ? priorLink(href)
      : priorLink(href, title, text);
    const url = (href && typeof href === 'object')
      ? String(href.href || '')
      : String(href || '');
    if (!(/^https?:\/\//i.test(url) || url.startsWith('//'))) return html;
    let out = html.replace(/\s+target="[^"]*"/gi, '').replace(/\s+rel="[^"]*"/gi, '');
    return out.replace(/<a\s/i, '<a target="_blank" rel="noopener noreferrer" ');
  };
  const priorCodespan = renderer.codespan.bind(renderer);
  renderer.codespan = function (code) {
    const html = (code && typeof code === 'object') ? priorCodespan(code) : priorCodespan(code);
    const text = (code && typeof code === 'object') ? String(code.text || '') : String(code || '');
    const raw = String(text).trim();
    let url = raw;
    while (url && /[.,;:!?]$/.test(url)) url = url.slice(0, -1);
    if (!/^https?:\/\//i.test(url)) return html;
    const safe = url.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    return html.replace(/^<code>([\s\S]*)<\/code>$/i, (_all, inner) => {
      if (/<a\s/i.test(inner)) return _all;
      return `<code><a href="${safe}" target="_blank" rel="noopener noreferrer">${inner}</a></code>`;
    });
  };
  marked.use({ renderer });
} catch (e) {
  console.warn('marked renderer target=_blank wiring failed', e);
}

function lucideIconHtml(name, className = 'lucide-icon') {
  return `<i data-lucide="${name}" class="${className}" aria-hidden="true"></i>`;
}

function refreshLucideIcons(root) {
  if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {

}

function setActionBtnState(btn, iconName, label, spin = false) {
