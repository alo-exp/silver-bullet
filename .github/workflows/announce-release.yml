name: Announce Release

# Posts a Google Chat card when a GitHub release is published.
# Webhook URL is stored in GCHAT_RELEASE_WEBHOOK — never commit the URL.
# If the release commit CI is still settling, the workflow waits until it is
# fully green or the timeout is reached.
# Announcements always reply into the Silver Bullet Updates thread.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to announce (e.g. v0.23.4)"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANNOUNCE_CI_TIMEOUT_SECONDS: 1800
      ANNOUNCE_CI_POLL_INTERVAL_SECONDS: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          [[ -z "$tag" ]] && { echo "No tag resolved"; exit 1; }

          name=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json name --jq '.name // empty')
          url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url  --jq '.url')
          # First ~400 chars of release body — strip leading whitespace, collapse blank lines
          body=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // empty' \
            | sed -E 's/^[[:space:]]+//' | awk 'NF{c++; print; if(c>=6) exit}')

          {
            echo "tag=$tag"
            echo "title=${name:-$tag}"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"

          # Multi-line body via heredoc
          {
            echo "body<<__EOF__"
            echo "$body"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for release commit CI to settle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: ./scripts/verify-release-announcement-ci.sh "$RELEASE_TAG"

      - name: Post to Google Chat
        env:
          WEBHOOK: ${{ secrets.GCHAT_RELEASE_WEBHOOK }}
          THREAD_KEY: silver-bullet-updates
          TAG:   ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          URL:   ${{ steps.meta.outputs.url }}
          BODY:  ${{ steps.meta.outputs.body }}
        run: |
          if [[ -z "$WEBHOOK" ]]; then
            echo "::error::GCHAT_RELEASE_WEBHOOK secret is not set"
            exit 1
          fi

          separator="?"
          [[ "$WEBHOOK" == *"?"* ]] && separator="&"
          webhook_url="${WEBHOOK}${separator}messageReplyOption=REPLY_MESSAGE_FALLBACK_TO_NEW_THREAD"

          # Build Card v2 payload via jq to guarantee valid JSON escaping.
          payload=$(jq -n \
            --arg title "Silver Bullet Updates" \
            --arg subtitle "$TITLE" \
            --arg body "$BODY" \
            --arg url "$URL" \
            --arg logo "https://sb.alolabs.dev/logo.png" \
            --arg thread_key "$THREAD_KEY" \
            '{
              text: $title,
              cardsV2: [{
                cardId: "sb-release",
                card: {
                  header: {
                    title: $title,
                    subtitle: $subtitle,
                    imageUrl: $logo,
                    imageType: "SQUARE"
                  },
                  sections: [{
                    widgets: [
                      { textParagraph: { text: $body } },
                      {
                        buttonList: {
                          buttons: [{
                            text: "View release",
                            onClick: { openLink: { url: $url } }
                          }]
                        }
                      }
                    ]
                  }]
                }
              }],
              thread: { threadKey: $thread_key }
            }')

          http_code=$(curl -sS -o /tmp/gchat.out -w "%{http_code}" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -X POST \
            -d "$payload" \
            "$webhook_url")

          if [[ "$http_code" != "200" ]]; then
            echo "::error::Google Chat webhook returned HTTP $http_code"
            cat /tmp/gchat.out
            exit 1
          fi
          echo "✓ Posted to Google Chat ($http_code)"
