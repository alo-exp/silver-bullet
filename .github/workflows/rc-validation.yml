name: RC Validation (optional)

# Manual diagnostic; the merge and release gate is ci.yml, and the markers this run writes stay
# on the runner, so it never satisfies the release gate's operator-local RC matrix.
#
# What it runs: scripts/run-rc-validation-matrix.sh in CI mode, i.e. the structural install
# smoke (install + diagnostics) for cursor, codex and claude, fresh and upgrade. No host CLI
# (cursor-agent, codex, claude) is installed and no credentials are passed, so no live cell
# runs: each cell ends as "skip" after its structural smoke, the job fails when a structural
# smoke fails, and the job summary lists every cell. require_live=true demands live cells, so
# it fails here (the cursor cells report "unavailable") until this workflow installs and
# authenticates a host CLI.

on:
  workflow_dispatch:
    inputs:
      require_live:
        description: Fail unless live cells run (they cannot on a GitHub-hosted runner; see above)
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rc-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Seed runtime env
        run: |
          source hooks/lib/runtime-paths.sh
          echo "SB_RUNTIME_STATE_DIR=$SB_RUNTIME_STATE_DIR" >> "$GITHUB_ENV"
      - name: Run RC matrix (CI mode, structural install smoke only)
        env:
          REQUIRE_LIVE: ${{ inputs.require_live }}
        run: |
          export SB_RC_CI_MODE=1
          if [[ "$REQUIRE_LIVE" == "true" ]]; then
            export SB_RC_MATRIX_REQUIRE_LIVE=1
          fi
          bash scripts/run-rc-validation-matrix.sh
      - name: Cell results
        if: always()
        run: |
          {
            echo "### RC matrix cells (structural install smoke; no live cell runs on this runner)"
            echo
            for marker in "$SB_RUNTIME_STATE_DIR"/rc-validation/*; do
              [[ -f "$marker" ]] || continue
              echo "- $(basename "$marker"): $(grep -E '^(status|artifact)=' "$marker" | tr '\n' ' ')"
            done
          } >>"$GITHUB_STEP_SUMMARY"
