name: Secret Scan
# Every pull request and every push (any branch, and release tags). Besides the working tree,
# the scan covers the commits the change adds, so a secret added in one commit and deleted in
# a later one is still caught; pushes to main and release-* branches and release tags scan the
# whole history.
on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GITLEAKS_VERSION: 8.21.2

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release's checksums file is fetched from the same release and the tarball must
      # match it before it is installed.
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep -E "[[:space:]]${tarball}\$" checksums.txt >tarball.sha256
          sha256sum --check --strict tarball.sha256
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks detect --no-git --verbose --redact

      - name: Scan the commits this change adds
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [[ "$EVENT" == pull_request ]]; then
            log_opts="${PR_BASE}..${PR_HEAD}"
          elif [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/heads/release-* || "$GITHUB_REF" == refs/tags/* ]]; then
            log_opts=""   # every commit
          elif [[ -n "$BEFORE" && "$BEFORE" != "$zero" ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            log_opts="${BEFORE}..${GITHUB_SHA}"
          else
            log_opts="origin/main..${GITHUB_SHA}"   # a new branch: the commits main does not have
          fi
          if [[ -n "$log_opts" ]]; then
            echo "Scanning commits: $log_opts"
            gitleaks detect --verbose --redact --log-opts="$log_opts"
          else
            echo "Scanning the full history"
            gitleaks detect --verbose --redact
          fi
