name: CI
on: [push, pull_request]
# A newer commit on the same pull request or branch supersedes the run still queued or in
# progress for the older one. Runs for main, release-* branches and tags always complete:
# scripts/verify-release-commit-ci.sh waits for the release commit's own run, so a quick
# follow-up push must not cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release-') && !startsWith(github.ref, 'refs/tags/')) }}
# Least privilege: no job writes to the repository, and no checkout keeps the token on disk.
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Seed Silver Bullet runtime env
        run: |
          export SILVER_BULLET_RUNTIME=codex
          source hooks/lib/runtime-paths.sh
          {
            echo "SILVER_BULLET_RUNTIME=$SILVER_BULLET_RUNTIME"
            echo "SB_RUNTIME_NAME=$SB_RUNTIME_NAME"
            echo "SB_RUNTIME_HOME_ROOT=$SB_RUNTIME_HOME_ROOT"
            echo "SB_RUNTIME_STATE_DIR=$SB_RUNTIME_STATE_DIR"
            echo "SB_RUNTIME_PLUGIN_CACHE_ROOT=$SB_RUNTIME_PLUGIN_CACHE_ROOT"
          } >> "$GITHUB_ENV"

      # Also lints every site page (site/**/*.html) for duplicate element ids, and fails on the
      # repository worm's indicators and on vendored skills that differ from skills-lock.json.
      - name: Repository invariants (manifests, versions, hook references, skill lists, mirrors, worm indicators, site ids)
        run: bash scripts/check-repo-invariants.sh

      - name: Validate committed Graphify artifacts
        run: bash scripts/validate-graphify-artifacts.sh

      # A pushed release tag must name the version the release commit carries.
      - name: Release tag matches the package version
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package_version="$(jq -r '.version' package.json)"
          plugin_version="$(jq -r '.version' .claude-plugin/plugin.json)"
          if [[ "${TAG#v}" == "$package_version" && "${TAG#v}" == "$plugin_version" ]]; then
            echo "tag $TAG matches package.json and .claude-plugin/plugin.json"
          else
            echo "::error::tag $TAG does not match package.json ($package_version) and .claude-plugin/plugin.json ($plugin_version)"
            exit 1
          fi

      - name: Lint shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --version
          # Application Bash (hooks/, scripts/, skills/, site/) must be clean at
          # every severity; test Bash under tests/ must be clean at -S warning.
          # File selection and flags live in scripts/lint-shell.sh.
          status=0
          bash scripts/lint-shell.sh --app || status=1
          bash scripts/lint-shell.sh --tests || status=1
          exit "$status"

      - name: Validate plugin mirror matches source hooks
        run: |
          bash scripts/validate-plugin-mirror.sh

  test:
    # The same isolated runner as `make test`: per-test HOME/TMPDIR, optional host
    # tools hidden. Both runtimes the hooks resolve state paths for.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [claude, codex]
    env:
      SILVER_BULLET_RUNTIME: ${{ matrix.runtime }}
      # Tests must not write bytecode caches into the checkout either.
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test prerequisites
        run: |
          # expect drives the TUI contract tests (tests/tui-contract)
          sudo apt-get install -y jq git expect
          python3 -m pip install -r requirements-dev.txt

      # Tests must write only to their sandboxed HOME/TMPDIR, never into the checkout, and that
      # includes git-ignored paths (forged .e2e-* evidence, caches): compare the full status,
      # ignored files included, before and after the run.
      - name: Record the checkout before the tests
        run: git status --porcelain --ignored --untracked-files=all >"$RUNNER_TEMP/checkout-before.txt"

      - name: Run all test suites
        run: bash tests/run-all-tests.sh --jobs 4

      - name: Check the tests left the checkout unchanged
        if: always()
        run: |
          git status --porcelain --ignored --untracked-files=all >"$RUNNER_TEMP/checkout-after.txt"
          if ! diff -u "$RUNNER_TEMP/checkout-before.txt" "$RUNNER_TEMP/checkout-after.txt" >"$RUNNER_TEMP/checkout.diff"; then
            echo "::error::The test run modified the checkout (\"!!\" lines are git-ignored files):"
            cat "$RUNNER_TEMP/checkout.diff"
            git diff --stat
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test and coverage prerequisites
        run: |
          sudo apt-get install -y jq git expect
          python3 -m pip install -r requirements-dev.txt

      - name: Measure Bash, Python and JS/TS coverage
        run: bash tests/coverage/run-coverage.sh --jobs 4 --fail-under 100

      - name: Coverage summary
        if: always()
        run: cat .coverage-run/coverage-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            .coverage-run/coverage-summary.json
            .coverage-run/coverage-summary.md
          if-no-files-found: warn
