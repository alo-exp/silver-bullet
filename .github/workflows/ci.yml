name: CI
on: [push, pull_request]
# A newer commit on the same branch or pull request supersedes the runs still queued or
# running for the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Seed Silver Bullet runtime env
        run: |
          export SILVER_BULLET_RUNTIME=codex
          source hooks/lib/runtime-paths.sh
          {
            echo "SILVER_BULLET_RUNTIME=$SILVER_BULLET_RUNTIME"
            echo "SB_RUNTIME_NAME=$SB_RUNTIME_NAME"
            echo "SB_RUNTIME_HOME_ROOT=$SB_RUNTIME_HOME_ROOT"
            echo "SB_RUNTIME_STATE_DIR=$SB_RUNTIME_STATE_DIR"
            echo "SB_RUNTIME_PLUGIN_CACHE_ROOT=$SB_RUNTIME_PLUGIN_CACHE_ROOT"
          } >> "$GITHUB_ENV"

      - name: Repository invariants (manifests, versions, hook references, skill lists, mirrors)
        run: bash scripts/check-repo-invariants.sh

      - name: Validate committed Graphify artifacts
        run: bash scripts/validate-graphify-artifacts.sh

      - name: Check plugin.json version vs latest git tag
        continue-on-error: true
        run: |
          plugin_version=$(jq -r '.version' .claude-plugin/plugin.json)
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$latest_tag" ]]; then
            echo "No git tags found — skipping version check"
            exit 0
          fi
          # Strip leading 'v' from tag for comparison (tags are v0.20.11, plugin.json is 0.20.11)
          tag_version="${latest_tag#v}"
          if [[ "$plugin_version" != "$tag_version" ]]; then
            echo "::warning::plugin.json version ($plugin_version) does not match latest git tag ($latest_tag)"
          else
            echo "plugin.json version ($plugin_version) matches latest tag ($latest_tag)"
          fi

      - name: Lint shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --version
          # Application Bash (hooks/, scripts/, skills/, site/) must be clean at
          # every severity; test Bash under tests/ must be clean at -S warning.
          # File selection and flags live in scripts/lint-shell.sh.
          status=0
          bash scripts/lint-shell.sh --app || status=1
          bash scripts/lint-shell.sh --tests || status=1
          exit "$status"

      - name: Validate plugin mirror matches source hooks
        run: |
          bash scripts/validate-plugin-mirror.sh

      - name: Cursor runtime smoke (install, hooks, diagnostics)
        run: |
          bash scripts/release-live-matrix-cursor-smoke.sh
        env:
          SILVER_BULLET_RUNTIME: cursor
          SB_RELEASE_LIVE_MATRIX_WRITE_CURSOR_MARKER: "0"

      - name: Lint site HTML (duplicate IDs, structure)
        continue-on-error: true
        run: |
          npx --yes html-validate@latest \
            --rule 'no-dup-id:error' \
            --rule 'void-style:off' \
            --rule 'attribute-boolean-style:off' \
            site/**/*.html

  test:
    # The same isolated runner as `make test`: per-test HOME/TMPDIR, optional host
    # tools hidden. Both runtimes the hooks resolve state paths for.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [claude, codex]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SILVER_BULLET_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test prerequisites
        run: |
          # expect drives the TUI contract tests (tests/tui-contract)
          sudo apt-get install -y jq git expect
          python3 -m pip install -r requirements-dev.txt

      - name: Run all test suites
        run: bash tests/run-all-tests.sh --jobs 4

      # Tests must write only to their sandboxed HOME/TMPDIR, never into the checkout.
      - name: Check the tests left the checkout unchanged
        if: always()
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$changes" ]]; then
            echo "::error::The test run modified the checkout:"
            printf '%s\n' "$changes"
            git diff --stat
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test and coverage prerequisites
        run: |
          sudo apt-get install -y jq git expect
          python3 -m pip install -r requirements-dev.txt

      - name: Measure Bash, Python and JS/TS coverage
        run: bash tests/coverage/run-coverage.sh --jobs 4

      - name: Coverage summary
        if: always()
        run: cat .coverage-run/coverage-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .coverage-run/coverage-summary.json
            .coverage-run/coverage-summary.md
          if-no-files-found: warn
